    search index=zeek sourcetype=zeek:conn (id_orig_h=10.0.2.2 OR id_orig_h=10.0.2.3) (id_resp_p=445 OR id_resp_p=139) NOT (id_resp_h=10.0.2.2 OR id_resp_h=10.0.2.3)\
    | lookup known_range_hosts ip AS id_orig_h OUTPUT hostname AS host\
    | eval Source_Network_Address=id_resp_h, type="outbound SMB (coercion effect)", user=null()\
  ]\
| bucket _time span=1m\
| stats values(type) as type values(user) as user by _time Source_Network_Address host\
| table Source_Network_Address host type user
description = A coercion RPC call -- a remote invocation of one of the coercion interfaces (MS-EFSR/PetitPotam, MS-DFSNM/DFSCoerce, MS-RPRN/PrinterBug, MS-FSRVP/ShadowCoerce) against any Windows host -- captured by RPC Firewall (zeronetworks), which is injected into the RPC server processes (lsass/spoolsv/dfssvc/vss) on every range host and audits each such call to the RPCFW event channel with the caller's source IP, the interface UUID, and the authenticated subject. This detects the coercion at the RPC layer (encryption-proof and tool-agnostic), reporting the attacker's own source IP (`Source_Network_Address`), the `type` of coercion, the target `host`, and the coercing `user`. A secondary Zeek conn.log leg keeps the original effect-based signal (a DC making an outbound SMB connection to a non-DC) as a backstop for hosts without RPC Firewall or interfaces not in the audited set.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

