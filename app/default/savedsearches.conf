[Relayed SMB or LDAP Connection]
search = index=windows EventCode=4624 Authentication_Package=NTLM NOT Source_Network_Address IN ("-","10.0.2.1")\
| lookup known_range_hosts ip AS Source_Network_Address OUTPUT hostname\
| where isnull(hostname)\
| table _time ComputerName Account_Name Source_Network_Address Package_Name__NTLM_only_ LogonType
description = An NTLM logon (user or computer principal) whose source IP is neither a known cyberhawks.lab host nor this range's own control-host administrative path. Kerberos is this domain's default/preferred protocol when both sides support it, so NTLM at all is already a weaker signal on its own -- this flags it specifically when it also comes from somewhere unexpected.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Ping Sweep]
search = index=zeek sourcetype=zeek:conn proto=icmp\
| bucket _time span=10s\
| stats dc(id_resp_h) as distinct_hosts values(id_resp_h) as hosts by _time id_orig_h\
| where distinct_hosts>=5\
| table id_orig_h distinct_hosts hosts
description = One source pinging 5+ distinct hosts within a 10s window.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Port Scan]
search = index=zeek sourcetype=zeek:conn (proto=tcp OR proto=udp) id_resp_h=10.0.2.* NOT id_resp_p=123\
| bucket _time span=30s\
| stats dc(id_resp_p) as distinct_ports dc(id_resp_h) as distinct_hosts values(id_resp_h) as hosts values(id_resp_p) as ports by _time id_orig_h\
| where distinct_ports>=15 OR distinct_hosts>=6\
| table id_orig_h distinct_ports distinct_hosts hosts ports
description = One source touching 15+ distinct ports on any range host, or 6+ distinct range hosts on the same port(s), within a 30s window.
cron_schedule = */1 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
