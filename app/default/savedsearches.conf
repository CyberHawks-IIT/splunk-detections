[Windows Credential Dump (Local)]
search = index=windows (EventCode=4656 OR EventCode=4663) (Object_Name="*MACHINE*SAM*" OR Object_Name="*MACHINE*SECURITY*") NOT Process_Name="*lsass.exe" NOT Process_Name="*svchost.exe"\
| eval hseg=mvindex(split(Object_Name,"\\"),3)\
| eval hive=case(hseg=="SECURITY","LSA", hseg=="SAM","SAM", true(),null())\
| where isnotnull(hive)\
| eval is_read=if(EventCode=4663,1,0)\
| eval is_open=if(EventCode=4656,1,0)\
| rex field=ComputerName "(?<host>[^.]+)"\
| bin _time span=1m\
| stats sum(is_read) as reads sum(is_open) as opens values(hive) as hive_list values(Account_Name) as user by _time host Logon_ID\
| where reads>0 OR opens>0\
| eval method=if(reads>0,"query","export")\
| eval hives=case(mvcount(hive_list)>1,"SAM and LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")\
| rename Logon_ID as session_id\
| join type=left session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | eval session_id=mvindex(Logon_ID,-1) | stats latest(Source_Network_Address) as logon_src by session_id ]\
| eval host_key=lower(host)\
| lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip\
| eval Source_Network_Address=if(isnull(logon_src) OR logon_src IN ("-","127.0.0.1","::1","0.0.0.0",""), host_ip, logon_src)\
| table Source_Network_Address host user method hives
description = A process other than lsass.exe accessing the local SAM and/or SECURITY registry hives on a host -- local credential-hive dumping, detected by the action taken on the hive keys rather than the tool used. The `method` field distinguishes `query` (direct RegQueryValueEx/RegEnumKeyEx enumeration -- 4663 reads of the hive keys) from `export` (RegSaveKeyEx/`reg save` -- a 4656 backup-privilege handle-open of the hive key with no per-value reads). The attacker IP is resolved by tracing the acting session's 4624 logon (Source Network Address), defaulting to the host's own IP when the session is local. `hives` reports SAM / LSA / "SAM and LSA" from the 4656/4663 object name. svchost.exe is excluded -- a remote-registry dump is the separate Windows Credential Dump (Remote) detection.
