[EXECUTE AS Impersonation]
search = index=mssql sourcetype=mssql_audit action_id="IMP*" succeeded=1 statement="EXECUTE AS*" NOT server_principal_name="NT SERVICE*"\
| eval host=replace(source, "_mssql_audit", "")\
| rex field=statement "EXECUTE AS LOGIN\s*=\s*.(?<impersonated>[^'\"]+)"\
| rename server_principal_name as user\
| lookup known_range_hosts hostname AS host OUTPUT ip AS host_ip\
| join type=left host_ip [ search index=zeek sourcetype=zeek:conn id_resp_p=1433 NOT id_orig_h="10.0.10.2" | lookup known_range_hosts ip AS id_orig_h OUTPUT hostname AS src_known | where isnull(src_known) | rename id_resp_h as host_ip | stats latest(id_orig_h) as Source_Network_Address by host_ip ]\
| bucket _time span=1m\
| stats values(impersonated) as impersonated values(Source_Network_Address) as Source_Network_Address by _time host user\
