[Windows Credential Dump (Local)]
search = index=windows (EventCode=4656 OR EventCode=4663) (Object_Name="*MACHINE*SAM*" OR Object_Name="*MACHINE*SECURITY*" OR Object_Name="*config*SAM*" OR Object_Name="*config*SECURITY*") NOT Process_Name="*lsass.exe" NOT Process_Name="*svchost.exe" `detection_window`\
| eval lastseg=mvindex(split(Object_Name,"\\"),-1)\
| eval hive=case(lastseg=="SECURITY","LSA", lastseg=="SAM","SAM", true(),null())\
| where isnotnull(hive)\
| eval is_read=if(EventCode=4663,1,0)\
| eval is_file=if(like(Object_Name,"%config%"),1,0)\
| eval is_shadow=if(like(Object_Name,"%ShadowCopy%"),1,0)\
| rex field=_raw "Accesses:\s*(?<acc>[^\r\n]+)"\
| where NOT (EventCode=4663 AND is_file=1 AND NOT match(acc,"ReadData"))\
| rex field=ComputerName "(?<host>[^.]+)"\
| stats sum(is_read) as reads max(is_file) as isfile max(is_shadow) as isshadow values(hive) as hive_list values(Account_Name) as user by host Logon_ID\
| eval method=case(isshadow==1,"shadow copy", isfile==1,"file read", reads>0,"query", true(),"export")\
| eval hives=case(mvcount(hive_list)>1,"SAM, LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")\
| eval host_key=lower(host), session_id=lower(Logon_ID)\
| `logon_source`\
| `normalize_host(host)`\
| `normalize_user(user)`\
| table attacker_ip host user method hives
description = A process other than lsass.exe accessing the local SAM and/or SECURITY registry hives on a host -- local credential-hive dumping, detected by the action taken on the hive keys rather than the tool used. The `method` field distinguishes `query` (direct RegQueryValueEx/RegEnumKeyEx enumeration -- 4663 reads of the hive keys), `export` (RegSaveKeyEx/`reg save` -- a 4656 backup-privilege handle-open of the hive key with no per-value reads), and `shadow copy` / `file read` (a 4663 ReadData on the on-disk hive FILE `...\System32\config\SAM` or `...\config\SECURITY`, typically copied out of a VSS shadow-copy device path `\Device\HarddiskVolumeShadowCopyN\...` since the live file is locked -- the same file-SACL technique NTDS.dit Extraction uses). The attacker IP is resolved by tracing the acting session's 4624 logon (Source Network Address), defaulting to the host's own IP when the session is local. `hives` reports SAM / LSA / "SAM, LSA" from the 4656/4663 object name. svchost.exe is excluded -- a remote-registry dump is the separate Windows Credential Dump (Remote) detection.
