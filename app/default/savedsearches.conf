[Pass-the-Ticket]
search = index=zeek sourcetype=zeek:kerberos request_type=TGS service!="krbtgt/*"\
| join type=left client [\
    search index=zeek sourcetype=zeek:kerberos request_type=AS earliest=-1d\
    | stats values(id_orig_h) as as_ips by client\
  ]\
| eval already_known=if(isnull(as_ips), 0, if(mvfind(as_ips, id_orig_h)>=0, 1, 0))\
| where already_known=0\
| eval origin=mvindex(as_ips, 0)\
| rename id_orig_h as destination\
| bucket _time span=1m\
| stats values(origin) as origin values(service) as service by _time client destination\
| table client origin destination service
