[DPAPI Dump]
search = index=windows EventCode=4663 (Object_Name="*\Protect\*" OR Object_Name="*\Protect" OR Object_Name="*\Credentials\*" OR Object_Name="*\Credentials") NOT Process_Name="*lsass.exe"\
| bucket _time span=10s\
| stats count values(Object_Name) as files by _time ComputerName Account_Name\
| rename ComputerName as host, Account_Name as user\
| table host user files
description = A process other than lsass.exe reading a user's DPAPI masterkey or credential-blob store (%APPDATA%\Microsoft\Protect\<SID>\ or %LOCALAPPDATA%\Microsoft\Credentials\) -- the file-theft half of a DPAPI credential decryption attack (mimikatz dpapi::masterkey/cred, or manual file copy for offline decryption elsewhere).
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[LSA Dump: Registry Query]
