[Pass-the-Ticket]
search = index=zeek sourcetype=zeek:kerberos request_type=TGS service!="krbtgt/*" `detection_window`\
| eval ckey=lower(replace(client,"[/@].*",""))\
| join type=left ckey [\
    search index=zeek sourcetype=zeek:kerberos request_type=AS earliest=-1d latest=+5m\
    | eval ckey=lower(replace(client,"[/@].*",""))\
    | stats values(id_orig_h) as as_ips by ckey\
  ]\
| eval already_known=if(isnull(as_ips), 0, if(mvfind(as_ips, id_orig_h)>=0, 1, 0))\
| where isnotnull(as_ips) AND already_known=0\
| eval origin=mvindex(as_ips, 0)\
| lookup known_range_hosts ip AS origin OUTPUT hostname AS origin_name | eval origin=coalesce(origin_name, origin)\
| rename id_orig_h as attacker_ip\
| eval user=replace(client,"[/@].*","")\
| stats values(origin) as origin by attacker_ip user service\
| `normalize_host(origin)`\
| `normalize_user(user)`\
| table attacker_ip origin user service
description = A Kerberos service ticket (TGS-REQ) requested from an IP that did not itself perform the initial authentication (AS-REQ) for that same client principal, WHEN that AS-REQ was positively observed from a different host -- the signature of a stolen/copied TGT (or TGS) being reused from a second host rather than the one that originally obtained it. Firing requires seeing the original AS-REQ from another IP; a TGS-REQ for a principal whose AS-REQ was never observed is not treated as reuse (it is almost always an un-captured or pre-lookback TGT, not an attack).
