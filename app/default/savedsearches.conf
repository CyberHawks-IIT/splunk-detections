[DPAPI Dump]
search = index=windows EventCode=4663 (Object_Name="*\Protect\*" OR Object_Name="*\Protect" OR Object_Name="*\Credentials\*" OR Object_Name="*\Credentials") NOT Process_Name="*lsass.exe"\
| bucket _time span=10s\
| stats count values(Object_Name) as files by _time ComputerName Account_Name\
| rename ComputerName as host, Account_Name as user\
| table host user files
description = A process other than lsass.exe reading a user's DPAPI masterkey or credential-blob store (%APPDATA%\Microsoft\Protect\<SID>\ or %LOCALAPPDATA%\Microsoft\Credentials\) -- the file-theft half of a DPAPI credential decryption attack (mimikatz dpapi::masterkey/cred, or manual file copy for offline decryption elsewhere).
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[LSA Dump: Registry Query]
search = index=windows EventCode=4663 Object_Name="*MACHINE\SECURITY\*" NOT Process_Name="*lsass.exe"\
| bucket _time span=10s\
| stats count by _time ComputerName Account_Name\
| rename ComputerName as host, Account_Name as user\
| table host user
description = A process other than lsass.exe directly enumerating/querying HKLM\SECURITY -- the technique used when reading LSA secrets via ordinary registry calls (RegQueryValueEx/RegEnumKeyEx) rather than RegSaveKeyEx's backup-privilege export path (see SAM/LSA Dump: Registry Export for that one). Correctly names HKLM\SECURITY as the object, so it splits cleanly from the SAM equivalent.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[SAM Dump: Registry Query]
search = index=windows EventCode=4663 Object_Name="*MACHINE\SAM\*" NOT Process_Name="*lsass.exe"\
| bucket _time span=10s\
| stats count by _time ComputerName Account_Name\
| rename ComputerName as host, Account_Name as user\
| table host user
description = A process other than lsass.exe directly enumerating/querying HKLM\SAM -- the technique used when reading the hive via ordinary registry calls (RegQueryValueEx/RegEnumKeyEx) rather than RegSaveKeyEx's backup-privilege export path (see SAM/LSA Dump: Registry Export for that one). This is what SYSTEM-context local enumeration or netexec/secretsdump-style remote SAM enumeration actually does under the hood, and -- unlike the export technique -- correctly names HKLM\SAM as the object, so it can be split cleanly from the SECURITY/LSA equivalent.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[SAM/LSA Dump: Registry Export]
search = index=windows EventCode=4674 Process_Name="*reg.exe" (Privileges="SeBackupPrivilege" OR Privileges="SeRestorePrivilege")\
| bucket _time span=10s\
| stats count by _time ComputerName Account_Name\
| rename ComputerName as host, Account_Name as user\
| table host user
description = A process other than lsass.exe exercising SeBackupPrivilege or SeRestorePrivilege while it has an open handle via reg.exe -- the classic `reg save HKLM\SAM`/`HKLM\SECURITY`/`HKLM\SYSTEM` local credential-hive export technique (secretsdump.py's local mode, samdump2, manual reg.exe use, etc.).
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[NTLM Authentication]
search = index=windows EventCode=4624 Authentication_Package=NTLM NOT Source_Network_Address IN ("-","10.0.2.1")\
| lookup known_range_hosts ip AS Source_Network_Address OUTPUT hostname\
| where isnull(hostname)\
| rename ComputerName as host, Account_Name as user\
| table _time Source_Network_Address host user Package_Name__NTLM_only_ LogonType
description = Any NTLM authentication (user or computer principal) whose source IP is neither a known cyberhawks.lab host nor this range's own control-host administrative path. The focus is NTLM authentication happening at all, not specifically relay -- Kerberos is this domain's default/preferred protocol when both sides support it, so any NTLM logon from an unexpected source is itself the signal, whether it came from a poisoning-based relay, RPC coercion, or a direct NTLM auth attempt.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Ping Sweep]
search = index=zeek sourcetype=zeek:conn proto=icmp\
| bucket _time span=10s\
| stats dc(id_resp_h) as distinct_hosts values(id_resp_h) as hosts by _time id_orig_h\
| where distinct_hosts>=5\
| table id_orig_h hosts
description = One source pinging 5+ distinct hosts within a 10s window.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Port Scan]
search = index=zeek sourcetype=zeek:conn (proto=tcp OR proto=udp) id_resp_h=10.0.2.* NOT id_resp_p=123\
| bucket _time span=30s\
| stats dc(id_resp_p) as distinct_ports dc(id_resp_h) as distinct_hosts values(id_resp_h) as hosts values(id_resp_p) as ports values(proto) as protocol by _time id_orig_h\
| where distinct_ports>=15 OR distinct_hosts>=6\
| table id_orig_h hosts protocol ports
description = One source touching 15+ distinct ports on any range host, or 6+ distinct range hosts on the same port(s), within a 30s window.
cron_schedule = */1 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[AS-REP Roast]
search = index=windows EventCode=4768 Pre_Authentication_Type=0\
| eval Client_Address=replace(Client_Address, "^::ffff:", "")\
| bucket _time span=1m\
| stats values(Account_Name) as users by _time Client_Address\
| table Client_Address users
description = A Kerberos TGT request (4768) for an account that has "Do not require Kerberos preauthentication" set -- Pre-Authentication Type 0, as opposed to the normal encrypted-timestamp pre-auth (type 2) every other account in this domain uses. This is what ASREPRoast (impacket's GetNPUsers.py, Rubeus asreproast) actually abuses: no proof of knowledge of the password is required to get an AS-REP back, so the account's TGT is handed out to anyone who asks, encrypted with a key derived from the account's password and crackable offline.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
