[Certificate Request (HTTP)]
search = index=windows host=ca EventCode=4887 DCOMorRPC=DCOM `detection_window`\
| rex field=_raw "Requester:\s+(?<ruser>[^\r\n]+)"\
| rex field=_raw "Request ID:\s+(?<id>\S+)"\
| eval user=lower(mvindex(split(trim(ruser),"\\"),-1))\
| eval req_epoch=_time\
| join type=left max=0 user [\
    search index=iis host=ca cs_uri_stem="/certsrv/certfnsh.asp" cs_method=POST sc_status=200 earliest=-4h latest=+5m\
    | eval user=lower(mvindex(split(cs_username,"\\"),-1)), post=tostring(floor(_time)) . "|" . c_ip\
    | stats values(post) as posts by user | eval posts=mvjoin(posts, ";")\
  ]\
| eval posts=split(posts, ";")\
| eval prior_posts=mvmap(posts, if(tonumber(mvindex(split(posts, "|"), 0)) <= req_epoch + 2, posts, null()))\
| eval attacker_ip=mvindex(split(mvindex(mvsort(prior_posts), -1), "|"), 1)\
| stats values(attacker_ip) as attacker_ip values(user) as user values(Certificate_Template) as template by id\
| `normalize_user(user)`\
| table attacker_ip user template id
description = A certificate enrollment submitted over AD CS HTTP Web Enrollment (`/certsrv`) on the CA -- the ESC8 transport, where an attacker relays a captured NTLM authentication to the CA's web-enrollment endpoint to obtain a certificate as the relayed victim. The detection is keyed per issued certificate: each CA 4887 (certificate issued) whose transport is `DCOM` -- how AD CS Web Enrollment reaches the CA, versus the `RPC` of ordinary ICPR enrollment -- becomes its own row (grouped by Request ID), so several cert requests in quick succession each alert separately instead of merging into one. Each is confirmed as HTTP (not a local DCOM enrollment) and given its attacker IP by an inner join to an authenticated `POST /certsrv/certfnsh.asp` (200) from the same user in the CA's IIS log, which carries the requesting client IP (`c_ip`) and which no RPC/DCOM enrollment ever produces. Complements Certificate Request (RPC), which covers the `RPC` path and never touches IIS.
