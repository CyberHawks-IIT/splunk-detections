| eval type=case(uuid=="c681d488-d850-11d0-8c52-00c04fd90f7e" OR uuid=="df1941c5-fe89-4e79-bf10-463657acf44d","PetitPotam (MS-EFSR)", uuid=="4fc742e0-4a10-11cf-8273-00aa004ae673","DFSCoerce (MS-DFSNM)", uuid=="12345678-1234-abcd-ef00-0123456789ab","PrinterBug (MS-RPRN)", uuid=="a8e0653c-2744-4389-a61d-7373df8b2292","ShadowCoerce (MS-FSRVP)", true(),"coercion RPC ("+uuid+")")\
