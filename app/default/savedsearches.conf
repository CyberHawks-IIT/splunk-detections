| rename id_resp_h as host\
| table id_orig_h host
description = An unauthenticated DNS zone transfer (AXFR) against a domain controller. dc1's `cyberhawks.lab` zone is misconfigured with `SecureSecondaries=TransferAnyServer`, so any client can dump the entire zone (every A/SRV/NS record) with a single `dig axfr` -- no legitimate client in this domain ever issues an AXFR query (AD-integrated zone data replicates via normal AD replication between dc1/dc2, not classic zone-transfer), so any AXFR request at all is the signal.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
