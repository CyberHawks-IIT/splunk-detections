[Password Spray]
search = index=windows (EventCode=4625 OR EventCode=4771 OR EventCode=4624 OR (EventCode=4768 AND Result_Code=0x0)) earliest=-30m latest=+5m\
| eval new_event=if(`in_detection_window(_indextime)`, 1, 0)\
| eval attacker_ip=replace(coalesce(Source_Network_Address, Client_Address), "^::ffff:", "")\
| eval target_user=mvindex(Account_Name, -1)\
