[Delegation: S4U2Proxy]
search = index=windows EventCode=4769 `detection_window`\
| rex field=_raw "Transited Services:\s*(?<transited>[^\r\n]+)"\
| where isnotnull(transited) AND transited!="-"\
| eval attacker_ip=replace(Client_Address,"^::ffff:","")\
| eval user=replace(Account_Name,"@.*",""), service=Service_Name\
| rex field=_raw "Logon GUID:\s*(?<logon_guid>\S+)"\
| eval tkey=attacker_ip.":".floor(_time)\
| join type=left tkey [\
    search index=zeek sourcetype=zeek:kerberos request_type=TGS\
    | eval tkey=id_orig_h.":".floor(_time), imp=replace(client,"/.*","")\
    | stats values(imp) as impersonated values(eval(if(like(service,"%/%"),service,null()))) as service_spn by tkey ]\
| eval service=coalesce(service_spn, service)\
| stats values(attacker_ip) as attacker_ip values(user) as user values(impersonated) as impersonated by logon_guid service\
| `normalize_user(user)`\
| `normalize_user(impersonated)`\
| table attacker_ip user service impersonated
description = Kerberos constrained-delegation abuse -- the S4U2Proxy exchange, in which a service account holding `msDS-AllowedToDelegateTo` requests a service ticket to a downstream SPN *on behalf of another user* (constrained delegation, T2A4D). Combined with S4U2Self this lets an attacker who controls the delegating account impersonate any user (up to a Domain Admin) to the allowed target service without that user's password. In this range `sql2$` is configured for protocol-transition constrained delegation to `cifs/dc1`, so any S4U2Proxy is signal.
