| eval hseg=mvindex(split(Object_Name,"\\"),3)\
| eval hive=case(EventCode!=4656,null(), hseg=="SECURITY","LSA", hseg=="SAM","SAM", true(),null())\
| where EventCode=4673 OR isnotnull(hive)\
| eval is_query=if(EventCode=4673,1,0)\
