| eval failed_user=if(EventCode=4625 OR EventCode=4771, target_user, null()), succeeded_user=if(EventCode=4625 OR EventCode=4771, null(), target_user)\
| eventstats count(succeeded_user) as succ_cnt by attacker_ip succeeded_user\
| eval success_user=if(isnotnull(succeeded_user) AND succ_cnt<=2, succeeded_user, null())\
| sort 0 _time\
| streamstats time_window=5m dc(failed_user) as failed_users values(success_user) as successes values(ComputerName) as host max(new_event) as has_new by attacker_ip\
| where failed_users>=5 AND has_new=1\
| stats values(successes) as successes values(host) as host by attacker_ip\
| `normalize_host(host)`\
| `normalize_user(successes)`\
| table attacker_ip host successes
description = One source failing authentication against 5+ distinct non-machine accounts within a 5-minute window -- the low-and-slow, one-password- many-accounts pattern password spraying uses to avoid per-account lockout thresholds. Covers both the NTLM/SMB vector (4625) and the Kerberos pre-auth vector (4771), since spray tools use either (netexec/CrackMapExec default to SMB, kerbrute/Rubeus use Kerberos). Correlates in any subsequent successful authentication for the same source in the same window (4624, or 4768 with Result Code 0x0) to report which account(s) the spray actually got in on. A spray cracks an account on a single attempt, so only accounts with <=2 successful logons from the source in the window are reported as `successes` -- an account the source authenticates to repeatedly is an already-established session, not a fresh spray hit, and is excluded (prevents a noisy source's concurrent legitimate logons from being mis-reported as spray successes).
