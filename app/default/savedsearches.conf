[NTLM Authentication]
search = index=windows EventCode=4624 Authentication_Package=NTLM NOT Source_Network_Address IN ("-","10.0.2.1")\
| lookup known_range_hosts ip AS Source_Network_Address OUTPUT hostname\
| where isnull(hostname)\
| rename ComputerName as host, Account_Name as user\
| table _time Source_Network_Address host user Package_Name__NTLM_only_ LogonType
description = Any NTLM authentication (user or computer principal) whose source IP is neither a known cyberhawks.lab host nor this range's own control-host administrative path. The focus is NTLM authentication happening at all, not specifically relay -- Kerberos is this domain's default/preferred protocol when both sides support it, so any NTLM logon from an unexpected source is itself the signal, whether it came from a poisoning-based relay, RPC coercion, or a direct NTLM auth attempt.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Ping Sweep]
