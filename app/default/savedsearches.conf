[Web Credential Read (Web.config.bak)]
search = index=iis host=WEB sc_status=200 (cs_uri_stem="*.bak" OR cs_uri_stem="*.old" OR cs_uri_stem="*.backup" OR cs_uri_stem="*.save" OR cs_uri_stem="*.orig" OR cs_uri_stem="*.config" OR cs_uri_stem="*~") `detection_window`\
| stats values(cs_uri_stem) as file by c_ip\
| rename c_ip as attacker_ip\
| table attacker_ip file
description = A successful HTTP GET of a configuration-backup file (e.g. `Web.config.bak`) on the `web` portal host. The live `Web.config` is deployed alongside a byte-identical `Web.config.bak`, and IIS was given a static MIME mapping for `.bak` so the backup is served as plain text instead of 404ing -- so anyone who requests it gets the real `svc-web` SQL Server connection string (username and plaintext password) back over HTTP. Nothing legitimate ever requests a `.bak`/config-backup path, so any 200 on one is the credential leak being exploited. The attacker IP is the requesting client (`c_ip`); `file` is the path served.
cron_schedule = * * * * *
dispatch.earliest_time = -4h
dispatch.latest_time = +5m
enableSched = 1
disabled = 0
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
realtime_schedule = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = attacker_ip
alert.suppress.period = 5m
action.discord_alert = 1
