[Delegation: S4U2Self]
search = index=windows EventCode=4769 `detection_window`\
| rex field=_raw "Transited Services:\s*(?<transited>[^\r\n]+)"\
| eval attacker_ip=replace(Client_Address,"^::ffff:","")\
| eval user=replace(Account_Name,"@.*","")\
| eval req_acct=lower(replace(user,"\$$","")), tgt_acct=lower(replace(Service_Name,"\$$",""))\
| where (transited="-" OR isnull(transited)) AND req_acct==tgt_acct\
| rex field=_raw "Logon GUID:\s*(?<logon_guid>\S+)"\
| lookup known_range_hosts hostname AS req_acct OUTPUT ip AS own_ip\
| where isnotnull(own_ip) AND attacker_ip!=own_ip AND NOT attacker_ip IN ("::1","127.0.0.1","-","0.0.0.0")\
| eval service=Service_Name\
| eval tkey=attacker_ip.":".floor(_time)\
| join type=left tkey [\
    search index=zeek sourcetype=zeek:kerberos request_type=TGS\
    | eval tkey=id_orig_h.":".floor(_time), imp=replace(client,"/.*","")\
    | stats values(imp) as impersonated by tkey ]\
| eval impersonated=coalesce(impersonated,"unknown")\
| mvexpand impersonated\
| join type=left attacker_ip user impersonated [\
    search index=windows EventCode=4769\
    | rex field=_raw "Transited Services:\s*(?<transited>[^\r\n]+)"\
    | where isnotnull(transited) AND transited!="-"\
    | eval attacker_ip=replace(Client_Address,"^::ffff:",""), user=replace(Account_Name,"@.*","")\
    | eval tkey=attacker_ip.":".floor(_time)\
    | join type=left tkey [\
        search index=zeek sourcetype=zeek:kerberos request_type=TGS\
        | eval tkey=id_orig_h.":".floor(_time), imp=replace(client,"/.*","")\
        | stats values(imp) as impersonated by tkey ]\
    | where isnotnull(impersonated)\
    | eval has_proxy=1\
    | stats values(has_proxy) as has_proxy by attacker_ip user impersonated ]\
| where isnull(has_proxy)\
| stats count by attacker_ip user service impersonated\
| fields - count\
| eval impersonated=if(impersonated="unknown",null(),impersonated)\
| `normalize_user(user)`\
| `normalize_user(impersonated)`\
| table attacker_ip user service impersonated
description = Kerberos constrained-delegation abuse -- the S4U2Self exchange, in which a service account requests a service ticket *to itself* on behalf of an arbitrary user (protocol transition, T2A4D). This is the first half of a full impersonation chain; it is usually followed immediately by an S4U2Proxy to a downstream service. When a matching S4U2Proxy exists this detection stays silent and 'Delegation: S4U2Proxy' fires instead; an S4U2Self with no matching proxy (e.g. `getST -self`, ticket harvested for later use) fires here on its own.
