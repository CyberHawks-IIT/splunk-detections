[Name Resolution Poisoning]
search = index=zeek sourcetype=zeek:conn proto=udp (id_resp_p=5355 OR id_resp_p=5353 OR id_resp_p=137 OR id_orig_p=5355 OR id_orig_p=5353 OR id_orig_p=137) earliest=-30m latest=+5m\
| eval new_event=if(`in_detection_window(_indextime)`, 1, 0)\
| eval protocol=case(id_resp_p=5355 OR id_orig_p=5355, "LLMNR", id_resp_p=5353 OR id_orig_p=5353, "mDNS", true(), "NBNS")\
| eval conn_ts=tonumber(ts), is_query=if(like(id_resp_h, "224.0.0.%") OR like(id_resp_h, "ff02:%") OR like(id_resp_h, "%.255"), 1, 0)\
| eval querier=if(is_query=1, id_orig_h, mvappend(id_orig_h, id_resp_h))\
| mvexpand querier\
| eval responder=if(is_query=1, null(), if(querier=id_orig_h, id_resp_h, id_orig_h)), query_ts=if(is_query=1, conn_ts, null()), new_query_ts=if(is_query=1 AND new_event=1, conn_ts, null())\
| eventstats values(query_ts) as query_times values(new_query_ts) as new_query_times by querier protocol\
| where isnotnull(responder) AND isnotnull(query_times)\
| eval answered=mvmap(query_times, if(conn_ts>=query_times-1 AND conn_ts<=query_times+5, 1, null())), answered_new=mvmap(new_query_times, if(conn_ts>=new_query_times-1 AND conn_ts<=new_query_times+5, 1, null()))\
| where isnotnull(answered) AND (new_event=1 OR isnotnull(answered_new))\
