[AS-REP Roast]
search = index=windows EventCode=4768 Pre_Authentication_Type=0\
| eval Client_Address=replace(Client_Address, "^::ffff:", "")\
| bucket _time span=1m\
| stats values(Account_Name) as users by _time Client_Address\
| table Client_Address users
description = A Kerberos TGT request (4768) for an account that has "Do not require Kerberos preauthentication" set -- Pre-Authentication Type 0, as opposed to the normal encrypted-timestamp pre-auth (type 2) every other account in this domain uses. This is what ASREPRoast (impacket's GetNPUsers.py, Rubeus asreproast) actually abuses: no proof of knowledge of the password is required to get an AS-REP back, so the account's TGT is handed out to anyone who asks, encrypted with a key derived from the account's password and crackable offline.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Computer Password Spray]
search = index=windows (EventCode=4624 OR (EventCode=4768 AND Result_Code=0x0))\
| eval target_user=mvindex(Account_Name, -1)\
| where target_user IN ("computer4$","computer5$")\
| eval ip=replace(coalesce(Source_Network_Address, Client_Address), "^::ffff:", "")\
| bucket _time span=1m\
| stats values(target_user) as successes values(ComputerName) as host by _time ip\
| table ip host successes
description = Any successful authentication as computer4$ (pre-Windows-2000-compatible default machine password, the lowercase account name) or computer5$ (blank password, NT hash 31d6cfe0d16ae931b73c59d7e0c089c0). Unlike the real range hosts' machine accounts (DC1$, WEB$, etc.), which legitimately authenticate constantly as part of normal domain operation, computer4/computer5 are placeholder AD objects with no real host behind them -- there is no legitimate reason either one ever successfully authenticates, so any occurrence at all is the signal. No threshold needed.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Kerberoast]
search = index=windows EventCode=4769 NOT Service_Name=krbtgt NOT Service_Name="*$"\
| eval Client_Address=replace(Client_Address, "^::ffff:", "")\
| eval encryption=case(Ticket_Encryption_Type="0x17","rc4-hmac", Ticket_Encryption_Type="0x12","aes256", Ticket_Encryption_Type="0x11","aes128", Ticket_Encryption_Type="0x3","des-cbc-md5", 1=1, Ticket_Encryption_Type)\
| bucket _time span=5m\
| stats values(Service_Name) as users dc(Service_Name) as distinct_services values(encryption) as encryption values(Ticket_Encryption_Type) as raw_enc by _time Client_Address\
| where distinct_services>=2 OR like(raw_enc,"%0x17%")\
| table Client_Address users encryption
description = Kerberoasting -- requesting a service ticket (4769) for a user-account SPN (not a computer/machine account's own service tickets, which are normal background Kerberos traffic) in order to crack the account's password offline from the ticket. Catches both the classic weak-crypto variant (RC4-HMAC ticket encryption, which every legitimate service ticket in this range's baseline gets AES for instead) and the mass-request variant (one source requesting tickets for 2+ distinct user-account SPNs in a 5-minute window -- this range only has 2 real user-account SPNs total, so touching more than 1 already stands out from the zero-distinct-SPN-request baseline of normal traffic).
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[NetNTLMv1 Authentication]
search = index=windows EventCode=4624 Package_Name__NTLM_only_="NTLM V1"\
| eval target_user=mvindex(Account_Name, -1)\
| where target_user!="-" AND target_user!="ANONYMOUS LOGON" AND NOT match(target_user, "\$$")\
| rename Source_Network_Address as ip, ComputerName as host, target_user as user\
| table ip host user
description = A named-account NTLM logon (4624) negotiated down to NTLMv1 -- both DCs have `LmCompatibilityLevel=1`, permitting the far weaker, much more crackable NTLMv1 response instead of rejecting it and requiring NTLMv2. Scoped to real user/service accounts; excludes anonymous/null-session and machine-to-machine NTLMv1 traffic, which happen constantly in this range's baseline (see known_false_positives) as a side effect of the same domain-wide weakening and aren't a distinct actionable signal on their own.
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Password Spray]
search = index=windows (EventCode=4625 OR EventCode=4771 OR EventCode=4624 OR (EventCode=4768 AND Result_Code=0x0))\
| eval ip=replace(coalesce(Source_Network_Address, Client_Address), "^::ffff:", "")\
| eval target_user=mvindex(Account_Name, -1)\
| where isnotnull(target_user) AND NOT match(target_user, "\$$") AND target_user!="-" AND target_user!="ANONYMOUS LOGON"\
| eval result=if(EventCode=4625 OR EventCode=4771,"failure","success")\
| bucket _time span=5m\
| stats dc(eval(if(result="failure",target_user,null()))) as failed_users values(eval(if(result="success",target_user,null()))) as successes values(ComputerName) as host by _time ip\
| where failed_users>=5\
| table ip host successes
description = One source failing authentication against 5+ distinct non-machine accounts within a 5-minute window -- the low-and-slow, one-password- many-accounts pattern password spraying uses to avoid per-account lockout thresholds. Covers both the NTLM/SMB vector (4625) and the Kerberos pre-auth vector (4771), since spray tools use either (netexec/CrackMapExec default to SMB, kerbrute/Rubeus use Kerberos). Correlates in any subsequent successful authentication for the same source in the same window (4624, or 4768 with Result Code 0x0) to report which account(s) the spray actually got in on.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

