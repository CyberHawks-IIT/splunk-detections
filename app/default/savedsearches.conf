| eval hives=case(method=="regdump","SAM or LSA", mvcount(hive_list)>1,"SAM and LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")\
| table Source_Network_Address host user method hives
description = A remote credential-hive dump against a host via the Remote Registry service (MS-RRP / winreg) -- the svchost.exe hosting RemoteRegistry exercising SeBackupPrivilege/SeRestorePrivilege on behalf of an authenticated remote (network-logon) principal, the signature of secretsdump.py / `netexec --sam`/`--lsa` and similar tools. The `method` field distinguishes `secdump` (the registry-export RPC, BaseRegSaveKey -- svchost backup-opens the hive key, a 4656 Handle-Manipulation event naming \MACHINE\SAM|SECURITY) from `regdump` (the registry-query RPC path -- backup privilege enabled via 4673 with no hive-export open). Attacker IP and the authenticating account come from the matching 4624 Type-3 network logon; that join is also the detection's primary noise filter. `hives` is resolved from the secdump hive-open (SAM / LSA / "SAM and LSA"); a regdump names no hive, so it reports "SAM or LSA".
