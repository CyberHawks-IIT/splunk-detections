| eval hseg=mvindex(split(Object_Name,"\\"),3)\
| eval hive=case(EventCode!=4656,null(), hseg=="SECURITY","LSA", hseg=="SAM","SAM", true(),null())\
| where EventCode=4673 OR isnotnull(hive)\
| rex field=ComputerName "(?<host>[^.]+)"\
| stats values(hive) as hive_list values(Account_Name) as user by host Logon_ID\
| eval method=if(isnotnull(hive_list),"secdump","regdump")\
| eval host_key=lower(host), session_id=lower(Logon_ID)\
| `logon_source`\
| where isnotnull(logon_src)\
| stats values(user) as user values(hive_list) as hive_list by attacker_ip host method\
| eval hives=case(method=="regdump","SAM or LSA", mvcount(hive_list)>1,"SAM, LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")\
| `normalize_host(host)`\
| `normalize_user(user)`\
| table attacker_ip host user method hives
description = A remote credential-hive dump against a host via the Remote Registry service (MS-RRP / winreg) -- the svchost.exe hosting RemoteRegistry exercising SeBackupPrivilege/SeRestorePrivilege on behalf of an authenticated remote (network-logon) principal, the signature of secretsdump.py / `netexec --sam`/`--lsa` and similar tools. The `method` field distinguishes `secdump` (the registry-export RPC, BaseRegSaveKey -- svchost backup-opens the hive key, a 4656 Handle-Manipulation event naming \MACHINE\SAM|SECURITY) from `regdump` (the registry-query RPC path -- backup privilege enabled via 4673 with no hive-export open). Attacker IP and the authenticating account come from the matching 4624 Type-3 network logon; that join is also the detection's primary noise filter. `hives` is resolved from the secdump hive-open (SAM / LSA / "SAM, LSA"); a regdump names no hive, so it reports "SAM or LSA".
