[LDAP Query]
search = index=windows source="WinEventLog:Directory Service" EventCode=1644 `detection_window`\
| rex field=_raw "Client:\r?\n\s*(?<client_raw>[^\r\n]+)"\
| rex field=_raw "Filter:\r?\n\s*(?<query>.+?)\s*\r?\n"\
| rex field=_raw "User:\r?\n\s*(?<user>\S+)"\
| eval client_raw=trim(client_raw)\
| rex field=client_raw "^\[?(?<client_ip>[^\]\s]+?)\]?:(?<client_port>\d+)$"\
| eval is_adws=if(client_ip="::1" OR client_ip="127.0.0.1", 1, 0)\
| eval host=lower(replace(host, "\..*$", ""))\
| where (is_adws=1 AND NOT like(user, "%$") AND user!="UNAVAILABLE") OR is_adws=0\
| lookup known_range_hosts ip AS client_ip OUTPUT hostname AS client_is_range\
| where is_adws=1 OR isnull(client_is_range)\
| eval cp_key=if(is_adws=0, client_ip.":".client_port, "na")\
| join type=left cp_key [\
    search index=zeek sourcetype=zeek:conn_open (id_resp_p=389 OR id_resp_p=636) earliest=-30m\
    | eval cp_key=id_orig_h.":".id_orig_p\
    | stats latest(id_resp_p) as dport by cp_key ]\
| join type=left max=0 host [\
    search index=zeek sourcetype=zeek:conn_open id_resp_p=9389 earliest=-30m\
    | lookup known_range_hosts ip AS id_orig_h OUTPUT hostname AS orig_is_range\
    | where isnull(orig_is_range)\
    | lookup known_range_hosts ip AS id_resp_h OUTPUT hostname AS host\
    | eval host=lower(host), pair=ts."|".id_orig_h\
    | stats list(pair) as pairs by host ]\
| eval pairs=if(is_adws=1, split(mvjoin(pairs, " "), " "), null())\
| eval cand=mvmap(pairs, if(tonumber(mvindex(split(pairs, "|"), 0)) <= _time+2, pairs, null()))\
| eval adws_ip=mvindex(split(mvindex(mvsort(cand), -1), "|"), 1)\
| eval attacker_ip=if(is_adws=1, adws_ip, client_ip)\
| eval protocol=case(is_adws=1, "adws", dport=389, "ldap", dport=636, "ldaps", true(), "ldap")\
| where isnotnull(attacker_ip)\
| stats values(user) as user values(query) as query by attacker_ip host protocol\
| `normalize_host(host)`\
| `normalize_user(user)`\
| table attacker_ip host protocol user query
description = An LDAP, LDAPS, or ADWS (Active Directory Web Services) directory search against a domain controller from an IP not in this range's known static-IP inventory (i.e. not one of the range's own domain-joined hosts) -- the network-visible half of any directory enumeration tool (ldapsearch, BloodHound's SharpHound, netexec's `--users`/`--groups`, the ActiveDirectory PowerShell module, SOAPHound, etc). It anchors on the DC's own 1644 "Field Engineering" event, which logs every directory search with the bind account and the exact filter, so LDAP, LDAPS and ADWS all report the user and query. For LDAP and LDAPS the 1644 also carries the real client IP, so those fire on each query with no dependence on Zeek. ADWS runs the search on the DC over loopback, so its 1644 shows client `[::1]`; its real client IP and the ldap-vs-ldaps distinction come from Zeek's immediate connection-open log (`zeek:conn_open`), written when the TCP session is established rather than when it closes.
