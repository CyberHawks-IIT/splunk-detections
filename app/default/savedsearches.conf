# Verified saved searches for detections/backlog.md entries that have
# graduated out of the backlog. Each stanza name is a technical/descriptive
# label (matching backlog.md's `Detection` column) -- NOT the Discord embed
# title. The Alert Embed Planner (see CLAUDE.md) is the source of truth for
# each detection's human-facing name; rename the stanza to match once that's
# available, since a detection's Splunk alert name IS its embed title per
# this repo's conventions.
#
# All stanzas below are disabled = 1 -- Discord webhook alerting isn't wired
# up yet (see CLAUDE.md's "Detection design pass" section), so nothing here
# should actually fire alerts until that's built and each stanza's alert
# action is configured.

[Recon - Ping Sweep]
search = index=zeek sourcetype=zeek:conn proto=icmp\
| bucket _time span=10s\
| stats dc(id_resp_h) as distinct_hosts values(id_resp_h) as hosts by _time id_orig_h\
| where distinct_hosts>=5\
| table id_orig_h distinct_hosts hosts
description = One source pinging 5+ distinct hosts within a 10s window. Verified 2026-09-27 against a live `nmap -sn 10.0.2.2-8` ping sweep from john-kali (VM 611) targeting all 7 cyberhawks.lab range hosts -- fired exactly once (6 distinct hosts in one 10s bucket; the 7th host's ICMP reply landed in an adjacent bucket). No false positives found over 1h of normal range background traffic (IPv6 router solicitation ICMP to ff02::2 doesn't touch 5+ distinct unicast hosts).
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[Recon - Port Scan]
search = index=zeek sourcetype=zeek:conn (proto=tcp OR proto=udp) id_resp_h=10.0.2.* NOT id_resp_p=123\
| bucket _time span=30s\
| stats dc(id_resp_p) as distinct_ports dc(id_resp_h) as distinct_hosts values(id_resp_h) as hosts values(id_resp_p) as ports by _time id_orig_h\
| where distinct_ports>=15 OR distinct_hosts>=6\
| table id_orig_h distinct_ports distinct_hosts hosts ports
description = One source touching 15+ distinct ports on any range host, or 6+ distinct range hosts on the same port(s), within a 30s window. Scoped to id_resp_h=10.0.2.* (the cyberhawks.lab range) deliberately -- an earlier unscoped version false-positived on ordinary internet browsing to multi-IP CDNs from unrelated student VMs. NOT id_resp_p=123 excludes NTP (dc1/dc2 legitimately resolve time.windows.com/time.google.com/pool.ntp.org to several distinct IPs on every sync, which otherwise tripped the distinct_hosts threshold). Verified 2026-09-27 against three separate live scans from john-kali (VM 611): `nmap -p 445 -n --open 10.0.2.2-8` (port sweep across all 7 hosts, fired once: distinct_hosts=7), `nmap -p 1-1000 -n --open -Pn 10.0.2.8` (port sweep on one host, fired once: distinct_ports=999), and both run back-to-back within the same 30s bucket (correctly merged into one alert covering the whole burst, not duplicated). No false positives found over 2h of normal range background traffic once scoped to the range subnet.
cron_schedule = */1 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
