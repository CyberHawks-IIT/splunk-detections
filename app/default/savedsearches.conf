[EXECUTE AS Impersonation]
search = index=mssql sourcetype=mssql_audit action_id="IMP*" succeeded=1 statement="EXECUTE AS*" NOT server_principal_name="NT SERVICE*" `detection_window`\
| eval event_epoch=strptime(substr(event_time, 1, 19) . " +0000", "%Y-%m-%d %H:%M:%S %z")\
