# Shared search macros for the detections in detections/**/*.yml.
#
# Hand-maintained (unlike savedsearches.conf, which build/build_app.py
# generates). Each macro replaces a block that used to be copy-pasted into
# many detections; see CLAUDE.md "Conventions" for how and when to use them.

# The index-time window each run evaluates: events that finished indexing in
# the last 90 seconds. Every detection runs on two cadences at once:
#   1. A dispatcher on the indexer (defense-tooling's splunk_indexer role,
#      dispatch_detections.py + a systemd service) fires every detection every
#      15s via the REST dispatch endpoint with trigger_actions=1. This is what
#      gives sub-minute latency: an event is picked up by the next 15s run,
#      not on a minute boundary.
#   2. Splunk's own scheduler still runs each search once a minute
#      (cron * * * * *) as a fallback, so if the dispatcher stops, every event
#      is still evaluated within a minute. 90s (> the 60s fallback gap) means
#      two consecutive 1/min fallback runs overlap, so a stopped dispatcher
#      leaves no gap in index-time coverage.
# Because runs overlap (a 90s window fired every 15s), an event is evaluated by
# ~6 runs, not once. Firing exactly ONCE per attempt is therefore NOT a
# property of the window (as it was under the old exactly-once minute tiling) --
# it comes entirely from per-result throttling: each search sets
# alert.suppress on its `throttle` identity fields for alert.suppress.period
# (5m by default), so the first run to see an attempt alerts and the rest are
# suppressed. The throttle period (minutes) is far longer than the time an
# event stays in this 90s window, so an attempt is never re-alerted after the
# window rolls past it. See CLAUDE.md "Sub-minute dispatch" for the full model.
# The joins (logon_source, the SQL login join) look back hours for context that
# always PRECEDES the action, so it is already indexed. A detection whose two
# halves can be indexed in either order and close in time (a Zeek query/reply
# pair, a 4697/7045 pair) uses the wider lookback + the `in_detection_window`
# gate below instead of this window.
# Put it in the base search next to the event filters. The event-time range
# (dispatch.earliest_time/latest_time) is only an outer bound on how late an
# event may arrive and still be seen.
[detection_window]
definition = _index_earliest=-90s

# True when an index time is inside the current `detection_window` (indexed in
# the last 90s). For detections that must see an attempt's neighbouring events
# to judge it (thresholds over a burst, a query/reply pair, a 4697/7045 pair):
# they search a wider event-time span WITHOUT `detection_window`, then use this
# to fire a group when one of its events was freshly indexed
#   | eval new_event=if(`in_detection_window(_indextime)`, 1, 0)
# or each group once its first event is fresh
#   | where `in_detection_window(first_indexed)`
# As with `detection_window`, overlapping 15s runs mean a fresh burst passes
# this gate on several consecutive runs; the per-result throttle collapses
# those to one alert per attempt.
[in_detection_window(1)]
args = t
definition = ($t$>=relative_time(now(), "-90s"))

# host_key (short lowercase host name) and session_id (the Subject's Logon ID)
# of a Windows Security event, for `logon_source`.
[subject_session]
definition = rex field=ComputerName "(?<host_key>[^.]+)" | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)" | eval host_key=lower(host_key), session_id=lower(session_id)

# attacker_ip for a Windows action from the logon session that performed it:
# the network source of the 4624 that created session_id on host_key. That
# Logon ID is the last value of the 4624's multivalue Logon_ID. Falls back to
# the host's own IP (a local action, or a session older than the lookback).
# Needs host_key + session_id (see `subject_session`).
[logon_source]
definition = join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-4h latest=now Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Source_Network_Address) as logon_src by host_key session_id ] | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip | eval attacker_ip=coalesce(logon_src, host_ip)

# Host-valued output: short lowercase name (DC1.cyberhawks.lab -> dc1); IPs
# are left as they are (map range IPs to names with known_range_hosts first).
[normalize_host(1)]
args = field
definition = eval $field$=if(isnull($field$), null(), mvmap($field$, if(match($field$, "^[0-9.]+$") OR like($field$, "%:%"), $field$, lower(replace($field$, "\..*$", "")))))

# User-valued output: bare account name (CYBERHAWKS\dsmith, dsmith@cyberhawks.lab
# -> dsmith). Machine accounts keep their $.
[normalize_user(1)]
args = field
definition = eval $field$=if(isnull($field$), null(), mvmap($field$, replace(replace($field$, "^.*\\\\", ""), "@.*$", "")))
