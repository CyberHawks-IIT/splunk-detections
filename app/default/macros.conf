# Shared search macros for the detections in detections/**/*.yml.
#
# Hand-maintained (unlike savedsearches.conf, which build/build_app.py
# generates). Each macro replaces a block that used to be copy-pasted into
# many detections; see CLAUDE.md "Conventions" for how and when to use them.

# The index-time window each scheduled run evaluates: events that finished
# indexing between 2 and 1 minutes before the run's scheduled time. Runs are
# every minute (cron * * * * *), and a scheduled run's "now" is its scheduled
# minute, so consecutive windows tile index time exactly: every event is
# evaluated by exactly one run, however late it arrived (Zeek writes a UDP
# flow a minute or more after it starts; forwarders batch; a restarted
# forwarder replays a backlog).
# This is the LAST completed minute of index time, so the fire happens within
# a minute of the event being indexed (plus a few seconds of scheduler lag).
# It does NOT wait an extra minute for joined context: the joins (logon_source
# and the SQL login join) look back hours for an event that always PRECEDES
# the action (a logon before what it does), so that context is already indexed
# by the time this runs. A detection whose two halves can be indexed in either
# order and close in time (a Zeek query/reply pair, a 4697/7045 pair) must not
# rely on this one-minute window -- it uses the wider lookback + the
# `in_detection_window` gate below instead.
# Put it in the base search next to the event filters. The event-time range
# (dispatch.earliest_time/latest_time) is only an outer bound on how late an
# event may arrive and still be seen.
[detection_window]
definition = _index_earliest=-1m@m _index_latest=@m

# True when an index time falls in this run's `detection_window`. For
# detections that must see an attempt's neighbouring events to judge it
# (thresholds over a burst, a query/reply pair, a 4697/7045 pair): they
# search a wider event-time span WITHOUT `detection_window`, then use this to
# evaluate each burst when a new event of it arrives
#   | eval new_event=if(`in_detection_window(_indextime)`, 1, 0)
# or each group once, in the run that indexed its first event
#   | where `in_detection_window(first_indexed)`
[in_detection_window(1)]
args = t
definition = ($t$>=relative_time(now(), "-1m@m") AND $t$<relative_time(now(), "@m"))

# host_key (short lowercase host name) and session_id (the Subject's Logon ID)
# of a Windows Security event, for `logon_source`.
[subject_session]
definition = rex field=ComputerName "(?<host_key>[^.]+)" | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)" | eval host_key=lower(host_key), session_id=lower(session_id)

# attacker_ip for a Windows action from the logon session that performed it:
# the network source of the 4624 that created session_id on host_key. That
# Logon ID is the last value of the 4624's multivalue Logon_ID. Falls back to
# the host's own IP (a local action, or a session older than the lookback).
# Needs host_key + session_id (see `subject_session`).
[logon_source]
definition = join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-4h latest=now Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Source_Network_Address) as logon_src by host_key session_id ] | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip | eval attacker_ip=coalesce(logon_src, host_ip)

# Host-valued output: short lowercase name (DC1.cyberhawks.lab -> dc1); IPs
# are left as they are (map range IPs to names with known_range_hosts first).
[normalize_host(1)]
args = field
definition = eval $field$=if(isnull($field$), null(), mvmap($field$, if(match($field$, "^[0-9.]+$") OR like($field$, "%:%"), $field$, lower(replace($field$, "\..*$", "")))))

# User-valued output: bare account name (CYBERHAWKS\dsmith, dsmith@cyberhawks.lab
# -> dsmith). Machine accounts keep their $.
[normalize_user(1)]
args = field
definition = eval $field$=if(isnull($field$), null(), mvmap($field$, replace(replace($field$, "^.*\\\\", ""), "@.*$", "")))
