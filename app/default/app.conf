# A minimal, valid app.conf so Splunk recognizes this as a real app rather
# than a bare config drop. Deployed by defense-tooling's splunk_indexer role
# by dropping this whole app/ directory into $SPLUNK_HOME/etc/apps/ (see
# this repo's README, "How the pieces fit together").
[install]
is_configured = 0

[ui]
is_visible = 1
label = CyberHawks Detections

[launcher]
author = splunk-detections
description = Verified saved searches for detections/backlog.md entries that have graduated out of the backlog (implemented and run against the live cyberhawks.lab range). See README's "Contributing a detection" process.
version = 1.0.0
