# Hand-maintained (unlike savedsearches.conf, which build_app.py generates).
#
# Let scheduled searches use every concurrent-search slot instead of the
# default 50%. This Splunk runs little besides these detections: 49 searches,
# all due every minute. At the default share (and 1 core) the scheduler capped
# out at 3 concurrent searches and skipped 8.5% of runs; with 4 cores and
# continuous scheduling nothing was skipped, but runs still started up to
# ~2 minutes late, which is how late the Discord alert arrives. Ad-hoc
# searches share the same slots and may queue behind the detections.
[scheduler]
max_searches_perc = 100
