# Hand-maintained (unlike savedsearches.conf, which build_app.py generates).
#
# Let scheduled searches use every concurrent-search slot instead of the
# default 50%. This Splunk runs little besides these detections. Ad-hoc
# searches share the same slots and may queue behind the detections.
[scheduler]
max_searches_perc = 100

# Raise the instance-wide concurrent historical search cap well above the
# ~49 detections. The dispatcher (defense-tooling's splunk_indexer role) fires
# every detection every 15s for sub-minute latency, so a whole cycle's worth
# can be running at once, plus the 1/min fallback runs and any ad-hoc search.
# The default cap is base_max_searches + max_searches_per_cpu * cores
# (6 + 1*16 = 22 on this 16-core indexer), which the dispatched batch would
# overrun, and an over-cap dispatch fails ("max concurrent historical searches
# reached") -- a detection that silently does not run that cycle. Each run is
# short (a few seconds over a small index-time window), so oversubscribing the
# 16 cores briefly each cycle is fine. Raise the base so the cap is ~90.
[search]
base_max_searches = 74
