name: Event Log Clear
id: defense-evasion-event-log-clear
version: 2
date: '2026-09-30'
status: production
category: defense-evasion
description: >-
  An explicit event log clear action (`wevtutil cl`, Event Viewer's "Clear
  Log", `Clear-EventLog`) -- classic defense evasion, wiping evidence of
  prior activity. Windows only ever clears a log this way on an explicit
  action; ordinary size-based rotation/overwrite never generates these
  events, so no exclusion is needed to avoid catching routine log
  management.
data_source:
  - >-
    Windows Events -- 1102 (Security log cleared: subject account + Logon
    ID) and System 104 (any other log cleared: subject SID only), merged by
    host and minute so one alert covers every log a single clear touched
  - Windows Event 4624 (the remote logon that opened the clearing session),
    for attacker_ip
search: |-
  index=windows (EventCode=1102 OR EventCode=104)
  | rex field=_raw "The (?<logcleared>.+?) log file was cleared"
  | eval logcleared=coalesce(logcleared, if(EventCode=1102, "Security", null()))
  | rex field=ComputerName "(?<host>[^.]+)"
  | eval host_key=lower(host)
  | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)"
  | rex field=_raw "Security ID:\s+(?<subject_sid>S-[0-9-]+)"
  | eval session_id=lower(session_id), sid=coalesce(Sid, subject_sid)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Source_Network_Address) as session_src by host_key session_id ]
  | join type=left host_key sid [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), sid=mvindex(Security_ID,-1), sid_user=mvindex(Account_Name,-1) | stats latest(Source_Network_Address) as sid_src latest(sid_user) as sid_user by host_key sid ]
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip
  | eval attacker_ip=coalesce(session_src, sid_src, host_ip), user=coalesce(Account_Name, sid_user)
  | bucket _time span=1m
  | stats values(attacker_ip) as attacker_ip values(user) as user values(logcleared) as logs by _time host
  | eval host=if(isnull(host), null(), mvmap(host, if(match(host, "^[0-9.]+$") OR like(host, "%:%"), host, lower(replace(host, "\..*$", "")))))
  | eval user=if(isnull(user), null(), mvmap(user, replace(replace(user, "^.*\\\\", ""), "@.*$", "")))
  | table attacker_ip host user logs
how_to_implement: >-
  No infra fix needed -- both event types were already forwarded (1102 in
  the Security whitelist, 104 in the System whitelist). **Real design
  question from the planner, answered empirically, not assumed:** "does
  Windows regularly clear logs on its own?" -- confirmed no, but this
  project's OWN operational workflow does: the established snapshot-prep
  cycle (clear logs immediately before every VM snapshot, documented in
  this project's own memory) explicitly runs `wevtutil cl` across multiple
  channels on every range host before each snapshot. Live testing found
  18-26 pre-existing 1102/104 events per DC in the prior 24h from exactly
  this workflow, not from any attacker activity or Windows housekeeping.
  **Deliberately not excluded** -- there's no reliable way to distinguish
  "this project's own maintenance log-clear" from "an attacker covering
  their tracks" using only the account name (both could plausibly be
  Administrator), and this pattern is itself a known, attributable,
  intentional part of this project's workflow rather than noise to
  suppress. Document this for whoever operates the range day to day:
  expect this alert to fire around every snapshot cycle, and treat that as
  confirmation the detection works, not a false positive to silence.
  **Real Splunk gap, same pattern as other non-Security-log events:** 104
  never resolves an account name (raw SID only) -- the merged `user` field
  is only populated when the Security log itself is among the logs
  cleared (which brings a 1102 event with a resolved name into the same
  minute); clearing only e.g. the Application log alone reports no user.
known_false_positives: >-
  This project's own pre-snapshot log-clear workflow, expected and
  intentional -- see how_to_implement.

  v2 (2026-09-30): attacker_ip added (it had none, so Discord could only
  say "Unknown"). 1102 carries the clearer's Logon ID, joined to the 4624
  that opened that session (its Source_Network_Address), the same trace
  the other detections use. 104 has no Logon ID, only the subject SID, so
  a 104-only clear falls back to the latest remote 4624 for that SID on
  that host in the last hour (weaker: a user with two remote sessions on
  the host could be attributed to the other one). The SID join also fills
  `user` for 104-only clears, closing the old "104 never resolves an
  account name" gap above. A clear with no network logon behind it (e.g.
  SYSTEM via the guest agent, which is what the snapshot workflow does)
  falls back to the host's own IP, the same convention as the other
  detections. Also fixed: log names containing spaces (e.g.
  "Microsoft-Windows-Windows Defender/Operational") never matched the
  `logs` regex. `host` added to the embed.
verification:
  date: '2026-09-27'
  reverification_2026_09_30: >-
    Live from john-kali (192.168.1.11), netexec WinRM as
    CYBERHAWKS\Administrator against workstation: (A) wevtutil cl
    Application alone -> only a 104, attributed via the SID fallback:
    attacker_ip=192.168.1.11, user=Administrator, logs=Application. (B)
    Application + Security a minute later -> 104 + 1102 (Logon ID
    0x18ED553), attributed via the session trace: attacker_ip=192.168.1.11,
    user=Administrator, logs="Application Security". The earlier SYSTEM
    clears from the snapshot workflow resolve to each host's own IP.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: WinRM from the control host, as domain admin (simulating an attacker who has already achieved local admin and is covering their tracks)
  technique: 'wevtutil cl Application, then wevtutil cl Security, on workstation'
  result: >-
    Fired exactly once, correctly merging both clears into a single alert
    (logs=["Application","Security"]), with user=Administrator resolved
    from the 1102 event.
embed:
  title: Event Log Clear
  additional_fields:
    - host
    - user
    - logs
references:
  - 'detections/backlog.md, "Defense evasion" (backlog row: "Event log clearing")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
