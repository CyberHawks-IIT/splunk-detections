name: Relayed SMB or LDAP Connection
id: ntlm-relayed-smb-ldap
version: 1
date: '2026-09-27'
status: production
category: ntlm-relay-coercion
description: >-
  An NTLM logon (user or computer principal) whose source IP is neither a
  known cyberhawks.lab host nor this range's own control-host administrative
  path. Kerberos is this domain's default/preferred protocol when both
  sides support it, so NTLM at all is already a weaker signal on its own --
  this flags it specifically when it also comes from somewhere unexpected.
data_source:
  - 'Windows Events -- 4624, Authentication Package Name = NTLM'
search: |-
  index=windows EventCode=4624 Authentication_Package=NTLM NOT Source_Network_Address IN ("-","10.0.2.1")
  | lookup known_range_hosts ip AS Source_Network_Address OUTPUT hostname
  | where isnull(hostname)
  | table _time ComputerName Account_Name Source_Network_Address Package_Name__NTLM_only_ LogonType
how_to_implement: >-
  Requires defense-tooling's Windows forwarder shipping Security log 4624,
  and the known_range_hosts lookup (dt_detection_content, defense-tooling's
  splunk_indexer role) covering the 7 real range hosts + computer2-5's
  static IPs. NOT Source_Network_Address IN ("-", "10.0.2.1") is a required
  exclusion -- see known_false_positives.
known_false_positives: >-
  Investigated baseline NTLM frequency before finalizing this (asked
  explicitly, 2026-09-27): zero NTLM logons of any kind occurred over 3+
  hours of normal idle range operation -- everything between domain-joined
  hosts is Kerberos/Negotiate, so this detection has an unusually clean
  baseline. The one real source of legitimate NTLM found: this control
  host itself is not domain-joined (see cyber-range CLAUDE.md's WinRM
  double-hop note), so its own administrative WinRM access to range hosts
  is NTLM by necessity -- and appears in Source_Network_Address as 10.0.2.1
  (the gateway), not this host's own address, because of how this
  particular NetBird VPN route NATs into the ad vnet. "-" covers local/
  non-network logons (no real source to evaluate). Confirmed this exclusion
  doesn't blind the detection to real attacks: traffic from john-kali
  (192.168.1.11, a different subnet reached via plain pfSense routing, not
  VPN NAT) and from the dedicated relay box "test" (10.0.2.10, on the range
  subnet directly) both retain their real source IPs -- neither gets
  NAT-masked the way this control host's traffic does.
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: test (VMID 350, the dedicated relay/poisoning box, 10.0.2.10)
  technique: >-
    Responder (LLMNR/NBT-NS/mDNS poisoning) + impacket ntlmrelayx.py,
    relaying to ldap://10.0.2.2 (dc1). Triggered the range's own built-in
    poolUser_ntlm_relay_http scheduled task on web (manually invoked via
    Start-ScheduledTask rather than waiting up to 5 minutes for its normal
    interval) rather than fabricating a trigger -- see cyber-range
    CLAUDE.md's vulnerable-range design for why this scheduled task exists.
  result: >-
    Relay succeeded (ntlmrelayx: "Authenticating connection from
    CYBERHAWKS/BSMITH@10.0.2.5 against ldap://10.0.2.2 SUCCEED"). Fired
    exactly once on the resulting 4624 (bsmith, ComputerName=DC1, Source_
    Network_Address=10.0.2.10). Also separately confirmed firing (from
    earlier testing this same session) on a direct netexec SMB auth from
    john-kali using valid Administrator credentials -- any NTLM logon from
    an unexpected source triggers this, not just a completed relay, which
    matches the design intent.
  note: >-
    This exercises the relay/poisoning side (LLMNR/NBT-NS-triggered NTLM
    landing at a target) but not RPC-based coercion (PetitPotam/DFSCoerce/
    ShadowCoerce/PrinterBug) -- that produces the same kind of telemetry
    here but is the separate "Coercion trigger" detection's own concern
    (named-pipe events, not this one), still open in backlog.md.
embed:
  title: TBD -- pending the Alert Embed Planner
  additional_fields:
    - Account_Name
    - ComputerName
    - Source_Network_Address
references:
  - detections/backlog.md, "NTLM relay & coercion"
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
