name: 'Lateral Movement: Service'
id: lateral-movement-service
version: 5
date: '2026-09-30'
status: production
category: lateral-movement
description: >-
  A service installed on a host that also saw a fresh remote (Type 3)
  network logon in the same window -- the signature of remote
  service-based execution (PsExec, `impacket-psexec`, `sc.exe create \\target`).
  The correlation with a preceding remote logon is what distinguishes this
  from Service Creation (Local), the host-persistence variant of the same
  underlying event.
data_source:
  - >-
    Windows Events -- 7045 (service installed) correlated with 4624 (Logon
    Type 3) on the same host in the same window
search: |-
  index=windows (EventCode=4697 OR EventCode=7045) earliest=-30m latest=+5m
  | rex field=ComputerName "(?<host_key>[^.]+)"
  | rex field=_raw "Logon ID:\s+(?<sid>0x[0-9A-Fa-f]+)"
  | eval host_key=lower(host_key)
  | stats min(_indextime) as first_indexed latest(eval(if(EventCode=4697,lower(sid),null()))) as session_id latest(eval(if(EventCode=4697,Subject_Account_Name,null()))) as subj_acct by host_key Service_Name
  | where `in_detection_window(first_indexed)`
  | eval has_4697=if(isnull(session_id),0,1), acct=lower(subj_acct)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-4h latest=+5m | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Logon_Type) as subj_type latest(Source_Network_Address) as exact_src latest(_time) as subj_time by host_key session_id ]
  | join type=left host_key acct [ search index=windows EventCode=4624 Logon_Type=3 earliest=-4h latest=+5m Source_Network_Address=* NOT Source_Network_Address IN ("-","10.0.2.1","127.0.0.1","::1","0.0.0.0") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), acct=lower(mvindex(Account_Name,-1)), logon=tostring(floor(_time)) . "|" . Source_Network_Address | stats values(logon) as fb_logons by host_key acct | eval fb_logons=mvjoin(fb_logons, ";") ]
  | eval fb_logons=split(fb_logons, ";")
  | eval fb_pair=mvmap(fb_logons, if(abs(tonumber(mvindex(split(fb_logons, "|"), 0)) - floor(subj_time)) <= 2, fb_logons, null()))
  | eval fb_src=mvindex(split(mvindex(mvsort(fb_pair), -1), "|"), 1)
  | eval exact_src=if(exact_src IN ("-","127.0.0.1","::1","0.0.0.0",""),null(),exact_src)
  | eval src=coalesce(exact_src, fb_src)
  | eval path=case(has_4697=1 AND subj_type!=3,"local", has_4697=1 AND (src=="10.0.2.1" OR isnull(src)),"admin", has_4697=1,"lateral", true(),"local")
  | where path="lateral"
  | rename src as attacker_ip, host_key as host, Service_Name as service, subj_acct as user
  | `normalize_host(host)`
  | `normalize_user(user)`
  | table attacker_ip host user service
how_to_implement: >-
  No infra fix needed -- 7045/4624 already forwarded. Same control-host
  exclusion finding and fix as Lateral Movement: Scheduled Task (see that
  detection's notes for the full explanation) -- excluded 10.0.2.1 from
  the correlation. **Real Splunk gap, not fixed, documented instead:** 7045
  carries only a raw SID (`Sid`/`user` fields), never a resolved account
  name (`User=NOT_TRANSLATED` in the raw event) -- pulled the resolved
  name from the correlated 4624's `Account_Name` instead, which is why the
  correlation join does double duty here (source IP AND username), unlike
  the scheduled-task version where 4698 already has a resolved
  `Subject_Account_Name`.
known_false_positives: >-
  This control host's own admin traffic is excluded by IP. No legitimate
  remote service deployment happens in this range.

  2026-09-30: fallback tightened. A remote NTLM logon produces two 4624s on
  the target in the same second: one carries the source IP, the other (the
  RPC authentication over the named pipe, which is the session that creates
  the task/service) has none, and Windows does not link them (Linked Logon
  ID 0x0, no shared GUID/port/workstation; confirmed on a live atexec
  sample). The fallback used to take the same account's latest
  source-bearing logon in the previous 2 minutes, which could name another
  client using that account. It now requires that logon to be within 2
  seconds of the acting session's own logon on the same host.
throttle: [attacker_ip, host, service]
changes_2026_09_30: >-
  The 4697 (Security log) and 7045 (System log) of one install reach
  Splunk through separate forwarder inputs, so they can be indexed in
  different minutes; a minute bucket that caught only the 7045 misread a
  lateral install as local. Each (host, service) is now evaluated once, in
  the run that indexed its FIRST event, with everything indexed in the
  minute since as context (`in_detection_window(first_indexed)`). Runs
  every minute and looks back 30 minutes, so an event arriving up to 30
  minutes late is still evaluated; before this, each run searched the last
  minute of event time, and anything indexed after its run (Security up to
  ~50s late, Zeek conn p90 ~1 min) was never evaluated. Each result row is
  its own alert, throttled for 5m on the `throttle` fields.
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: re-architected onto 4697 (Security; carries Subject account +
    Logon ID, unlike 7045) as primary with 7045 (System) as a backstop, then the
    same logon-type split as the scheduled-task pair. REQUIRED an infra fix: the
    Security System Extension audit subcategory was OFF range-wide so 4697 never
    fired -- added to cyber-range configure_audit_policy.ps1 and enabled live on
    all 7 hosts. Live-verified: impacket-psexec/-services service creation on
    sql1 -> lateral with Attacker IP 192.168.1.11 and user resolved.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    impacket-psexec cyberhawks.lab/Administrator:<password>@10.0.2.6
    (uploads a binary to ADMIN$, creates and starts service "rubo", runs
    whoami returning nt authority\system)
  result: >-
    Fired exactly once, correctly attributing 192.168.1.11 / SQL1 /
    Administrator (resolved via the 4624 join, not 7045's own raw SID) /
    service name "rubo". Service stopped and deleted afterward.
embed:
  title: 'Lateral Movement: Service'
  additional_fields:
    - host
    - user
    - service
references:
  - 'detections/backlog.md, "Lateral movement" (backlog row: "Remote service creation (including PsExec)")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
