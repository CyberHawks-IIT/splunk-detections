name: 'Lateral Movement: WinRM'
id: lateral-movement-winrm
version: 4
date: '2026-10-03'
status: production
category: lateral-movement
description: >-
  A remote PowerShell/WinRM shell session created on a range host by a
  source other than this project's own control host. WinRM session
  establishment (`evil-winrm`, `Enter-PSSession`, `Invoke-Command`) is a
  common lateral-movement primitive once an attacker has valid credentials
  -- distinct from PsExec/remote-scheduled-task lateral movement, which are
  covered by their own detections.
data_source:
  - >-
    Microsoft-Windows-WinRM/Operational, EventCode 91 ("Creating WSMan
    shell on server" -- fires once per interactive/PowerShell remoting
    session, with the target account and client IP embedded in the message
    text). On the Windows Server 2016 hosts (dc1, sql1) event 91 carries no
    data, so the client comes from Zeek `conn_open` (WinRM connection opens)
    and the account from the session's 4624
search: |-
  index=windows LogName="Microsoft-Windows-WinRM/Operational" EventCode=91 `detection_window`
  | rex field=_raw "\\\\(?<user>\S+) clientIP: (?<attacker_ip>[\d\.]+)\)"
  | rex field=_raw "(?m)^Sid=(?<user_sid>S-1-\S+)"
  | rex field=ComputerName "(?<host>[^.]+)"
  | eval host=lower(host)
  | eval host_key=host
  | `winrm_open_source(attacker_ip, _time)`
  | join type=left host user_sid [ search index=windows EventCode=4624 Logon_Type=3 earliest=-30m latest=+5m | rex field=ComputerName "(?<host>[^.]+)" | rex field=_raw "New Logon:\s+Security ID:\s+(?<user_sid>\S+)\s+Account Name:\s+(?<sid_user>[^\r\n]+?)\s*[\r\n]" | eval host=lower(host) | stats latest(sid_user) as sid_user by host user_sid ]
  | eval attacker_ip=coalesce(attacker_ip, winrm_src), user=coalesce(user, sid_user, user_sid)
  | where isnotnull(attacker_ip) AND attacker_ip!="10.0.2.1"
  | stats count by attacker_ip host user
  | `normalize_host(host)`
  | `normalize_user(user)`
  | table attacker_ip host user
how_to_implement: >-
  No infra fix needed -- the WinRM Operational channel was already
  forwarded (no whitelist restriction on this channel in monitor.yml).
  EventCode 91 embeds both the authenticated account and the real client IP
  directly in its message text (`Creating WSMan shell on server ...
  (HOST\user clientIP: x.x.x.x)`), which Splunk doesn't auto-extract into
  fields -- pulled both via `rex` against `_raw` instead of relying on
  Account_Name/Source_Network_Address, which don't populate for this event
  type. Excluded this control host's own NAT'd admin IP (10.0.2.1, same
  address documented in the NTLM Authentication detection) since this
  project's own live-fire testing and administration constantly uses WinRM
  against every range host.
known_false_positives: >-
  This control host's own administrative WinRM traffic is excluded by IP.
  No other legitimate WinRM usage exists in this range day-to-day (no
  configuration-management tooling polls over WinRM here) -- revisit if
  that changes.
changes_2026_10_03: >-
  Was blind on dc1 and sql1. A netexec WinRM command against dc1 from
  john-kali produced no alert: on those two Windows Server 2016 hosts (build
  14393) WinRM/Operational event 91 is written with no event data at all, so
  its message reads "Creating WSMan shell on server with ResourceUri: %1"
  with no account or clientIP (checked on the hosts with Get-WinEvent: 0 of
  ~20 recent 91s had data on dc1/sql1, all of them did on the 2019/2022/
  Windows 11 hosts). The WinRM logon's 4624 has no source address either. For
  those events the client is now the latest WinRM (5985/5986) connection
  opened to the host in the 30s before the 91, from Zeek's `conn_open` log
  (which now includes the WinRM ports, ~50 KB/day, in Splunk in under a
  second), and the account is the 91's Sid resolved through that host's
  network 4624. This is a time join, like LDAP Query's ADWS branch: two
  different clients opening WinRM sessions to the same host within the same
  few seconds could be confused. Hosts whose 91 has the clientIP still use it.
throttle: [attacker_ip, host, user]
changes_2026_09_30: >-
  One row per attacker, host and user (the minute bucket is gone). Runs
  every minute over the events indexed in the previous minute
  (`detection_window`), so an event is evaluated however late it arrives;
  before this, each run searched the last minute of event time, and
  anything indexed after its run (Security up to ~50s late, Zeek conn p90
  ~1 min) was never evaluated. Each result row is its own alert, throttled
  for 5m on the `throttle` fields.
verification:
  reverification_2026_10_03: >-
    netexec winrm 10.0.2.2 -u Administrator -x 'net user user password
    /domain' from john-kali: before the conn_open join, no alert (dc1's 91
    is empty); after, fired with 192.168.1.11 / dc1 / Administrator ~11s
    after the command.
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    evil-winrm -i 10.0.2.8 -u Administrator -p '<shared lab password>'
    against workstation, ran `whoami` (returned workstation\administrator,
    confirming the session)
  result: >-
    Fired exactly once (two EventCode 91 events half a second apart --
    interactive shell setup issues two shell-creation calls -- correctly
    bucketed into a single alert), correctly attributing 192.168.1.11 /
    workstation / Administrator.
embed:
  title: 'Lateral Movement: WinRM'
  additional_fields:
    - host
    - user
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog row: "WinRM logon")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
