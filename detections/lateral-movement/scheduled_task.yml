name: 'Lateral Movement: Scheduled Task'
id: lateral-movement-scheduled-task
version: 4
date: '2026-09-30'
status: production
category: lateral-movement
description: >-
  A scheduled task created on a host that also saw a fresh remote (Type 3)
  network logon in the same window -- the signature of remote task-based
  execution (`impacket-atexec`, `schtasks /create /s <target>`). The
  correlation with a preceding remote logon is what distinguishes this from
  Scheduled Task Creation (Local), the host-persistence variant of the same
  underlying event.
data_source:
  - >-
    Windows Events -- 4698 (scheduled task created) correlated with 4624
    (Logon Type 3) on the same host in the same window
search: |-
  index=windows EventCode=4698
  | rex field=ComputerName "(?<host_key>[^.]+)"
  | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)"
  | eval host_key=lower(host_key), session_id=lower(session_id), acct=lower(Subject_Account_Name)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-1h | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Logon_Type) as subj_type latest(Source_Network_Address) as exact_src latest(_time) as subj_time by host_key session_id ]
  | join type=left host_key acct [ search index=windows EventCode=4624 Logon_Type=3 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","10.0.2.1","127.0.0.1","::1","0.0.0.0") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), acct=lower(mvindex(Account_Name,-1)), logon=tostring(floor(_time)) . "|" . Source_Network_Address | stats values(logon) as fb_logons by host_key acct | eval fb_logons=mvjoin(fb_logons, ";") ]
  | eval fb_logons=split(fb_logons, ";")
  | eval fb_pair=mvmap(fb_logons, if(abs(tonumber(mvindex(split(fb_logons, "|"), 0)) - floor(subj_time)) <= 2, fb_logons, null()))
  | eval fb_src=mvindex(split(mvindex(mvsort(fb_pair), -1), "|"), 1)
  | eval exact_src=if(exact_src IN ("-","127.0.0.1","::1","0.0.0.0",""),null(),exact_src)
  | eval src=coalesce(exact_src, fb_src)
  | eval path=case(subj_type!=3,"local", src=="10.0.2.1" OR isnull(src),"admin", true(),"lateral")
  | where path="lateral"
  | bucket _time span=1m
  | stats values(Subject_Account_Name) as user by _time src host_key Task_Name
  | rename src as Source_Network_Address, host_key as host, Task_Name as task
  | rename Source_Network_Address as attacker_ip
  | eval host=if(isnull(host), null(), mvmap(host, if(match(host, "^[0-9.]+$") OR like(host, "%:%"), host, lower(replace(host, "\..*$", "")))))
  | eval user=if(isnull(user), null(), mvmap(user, replace(replace(user, "^.*\\\\", ""), "@.*$", "")))
  | table attacker_ip host user task
how_to_implement: >-
  No infra fix needed -- 4698/4624 were already forwarded and used by
  other detections. **Real design finding from live testing:** a naive
  "any Type 3 logon on the target in the same minute" correlation is too
  broad in an environment where an admin control host is constantly
  connecting via WinRM -- confirmed live that this control host's own
  WinRM traffic (10.0.2.1) generates a fresh 4624 essentially simultaneous
  with any command it runs, which would make even a genuinely *local*
  (SYSTEM-triggered) task look "remote" by pure timing coincidence. Excluded
  10.0.2.1 from the correlation, same as the NTLM Authentication/WinRM
  logon detections' own established exclusion -- verified this doesn't
  just mask the problem by testing both directions explicitly (see
  verification below).
known_false_positives: >-
  This control host's own admin traffic is excluded by IP. No other
  legitimate remote task-scheduling tooling runs against this range.

  2026-09-30: fallback tightened. A remote NTLM logon produces two 4624s on
  the target in the same second: one carries the source IP, the other (the
  RPC authentication over the named pipe, which is the session that creates
  the task/service) has none, and Windows does not link them (Linked Logon
  ID 0x0, no shared GUID/port/workstation; confirmed on a live atexec
  sample). The fallback used to take the same account's latest
  source-bearing logon in the previous 2 minutes, which could name another
  client using that account. It now requires that logon to be within 2
  seconds of the acting session's own logon on the same host.
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: RE-ARCHITECTED off the brittle same-minute join onto the 4698
    Subject Logon ID -> 4624 trace, splitting local vs lateral by the acting
    session's logon TYPE. KEY FINDING: NTLM remote logons come in pairs -- one
    4624 carries the source IP, a near-simultaneous elevated one has source '-';
    atexec/WinRM's task-creating session lands on the source-less one, so an
    exact-session-only trace under-attributes them. Uses the exact session for
    the logon type + a fallback join (latest source-bearing Type-3 4624 for the
    same host+account, -2m) for the IP. Live-verified: atexec, wmiexec, and
    evil-winrm task creation on sql1 all -> lateral with Attacker IP
    192.168.1.11; control-host admin sessions (type-3, src 10.0.2.1/'-') are
    dropped.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    impacket-atexec cyberhawks.lab/Administrator:<password>@10.0.2.6 whoami
    (creates, runs, and deletes a task named for a random string)
  result: >-
    Fired exactly once, correctly attributing 192.168.1.11 / SQL1 /
    Administrator / the task name. Separately confirmed the *local* variant
    (SYSTEM-triggered task creation on workstation with no remote logon
    involved, other than this control host's own excluded IP) correctly
    produces NO match here -- see Scheduled Task Creation (Local)'s own
    verification for that test.
embed:
  title: 'Lateral Movement: Scheduled Task'
  additional_fields:
    - host
    - user
    - task
references:
  - 'detections/backlog.md, "Lateral movement" (backlog row: "Remote scheduled task creation")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
