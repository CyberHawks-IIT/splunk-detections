name: Ping Sweep
id: recon-ping-sweep
version: 3
date: '2026-09-30'
status: production
category: reconnaissance
description: >-
  One source pinging 5+ distinct hosts within a 10s window.
data_source:
  - Zeek conn.log (proto=icmp)
search: |-
  index=zeek sourcetype=zeek:conn proto=icmp earliest=-30m latest=+5m
  | eval new_event=if(`in_detection_window(_indextime)`, 1, 0)
  | lookup known_range_hosts ip AS id_resp_h OUTPUT hostname AS resp_name
  | eval resp_host=coalesce(resp_name, id_resp_h)
  | sort 0 _time
  | streamstats time_window=10s dc(id_resp_h) as distinct_hosts values(resp_host) as hosts max(new_event) as has_new by id_orig_h
  | where distinct_hosts>=5 AND has_new=1
  | stats values(hosts) as hosts by id_orig_h
  | rename id_orig_h as attacker_ip
  | `normalize_host(hosts)`
  | table attacker_ip hosts
how_to_implement: >-
  Requires defense-tooling's Zeek sensor forwarding conn.log, plus this
  repo's search-time field extraction fix (see CLAUDE.md's "Zeek
  sourcetype/field-extraction incident" for why Splunk_TA_zeek's own
  INDEXED_EXTRACTIONS doesn't work against this range's data, and why
  fields use underscores, e.g. id_resp_h, not the dotted Zeek/CIM form).
known_false_positives: >-
  None found over 1h of normal range background traffic. IPv6 router
  solicitation ICMP (to ff02::2) doesn't touch 5+ distinct unicast hosts,
  so it doesn't trip this.
throttle: [attacker_ip]
changes_2026_09_30: >-
  Sliding 10s window per source instead of fixed 10s buckets: a sweep that
  straddled a bucket boundary could fall under 5 hosts in both halves and
  never fire (the original verification already saw a 7-host sweep split
  6+1 across two buckets). It counts the last 30 minutes of ICMP and
  alerts when a window that reaches 5 hosts includes a newly indexed flow,
  so a sweep is judged whole however its flows are spread over indexing
  minutes. Runs every minute and looks back 30 minutes, so an event
  arriving up to 30 minutes late is still evaluated; before this, each run
  searched the last minute of event time, and anything indexed after its
  run (Security up to ~50s late, Zeek conn p90 ~1 min) was never
  evaluated. Each result row is its own alert, throttled for 5m on the
  `throttle` fields.
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611)
  technique: 'nmap -sn 10.0.2.2-8'
  result: >-
    Fired exactly once -- 6 distinct hosts in one 10s bucket (the 7th
    host's ICMP reply landed in an adjacent bucket, a timing artifact of
    when nmap's individual echo requests went out, not a detection gap).
embed:
  title: Ping Sweep
  additional_fields:
    - hosts
references:
  - detections/backlog.md, "Reconnaissance & discovery"
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
