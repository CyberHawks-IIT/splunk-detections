name: Port Scan
id: recon-port-scan
version: 4
date: '2026-09-30'
status: production
category: reconnaissance
description: >-
  One source touching 15+ distinct ports on any range host, or 6+ distinct
  range hosts on the same port(s), within a 30s window.
data_source:
  - Zeek conn.log (proto=tcp or udp)
search: |-
  index=zeek sourcetype=zeek:conn (proto=tcp OR proto=udp) id_resp_h=10.0.2.* NOT id_resp_p=123 NOT id_orig_h=10.0.2.1 earliest=-30m latest=+5m
  | where isnull(history) OR (substr(history,1,1)!="H" AND NOT (match(history,"^[Cc]+$") AND id_resp_p>=49152))
  | eval new_event=if(`in_detection_window(_indextime)`, 1, 0)
  | lookup known_range_hosts ip AS id_resp_h OUTPUT hostname AS resp_name
  | eval resp_host=coalesce(resp_name, id_resp_h)
  | sort 0 _time
  | streamstats time_window=30s dc(id_resp_p) as distinct_ports dc(id_resp_h) as distinct_hosts values(resp_host) as hosts values(id_resp_p) as ports values(proto) as protocol max(new_event) as has_new by id_orig_h
  | where (distinct_ports>=15 OR distinct_hosts>=6) AND has_new=1
  | stats values(hosts) as hosts values(protocol) as protocol values(ports) as ports by id_orig_h
  | rename id_orig_h as attacker_ip
  | `normalize_host(hosts)`
  | mvexpand ports
  | eval port=tonumber(ports)
  | sort 0 attacker_ip port
  | streamstats current=f last(port) as prev by attacker_ip
  | eval _brk=if(isnull(prev) OR port>prev+1, 1, 0)
  | streamstats sum(_brk) as _grp by attacker_ip
  | stats min(port) as lo max(port) as hi values(hosts) as hosts values(protocol) as protocol by attacker_ip _grp
  | eval rng=if(lo==hi, tostring(lo), tostring(lo)."-".tostring(hi))
  | sort 0 attacker_ip _grp
  | stats list(rng) as ports values(hosts) as hosts values(protocol) as protocol by attacker_ip
  | table attacker_ip hosts protocol ports
how_to_implement: >-
  Requires defense-tooling's Zeek sensor forwarding conn.log, plus this
  repo's search-time field extraction fix (see CLAUDE.md's "Zeek
  sourcetype/field-extraction incident"). Deliberately scoped to
  id_resp_h=10.0.2.* (the cyberhawks.lab range) -- see known_false_positives
  for why an unscoped version doesn't work.
known_false_positives: >-
  An earlier, unscoped version (no id_resp_h restriction) false-positived on
  ordinary internet browsing to multi-IP CDNs from unrelated student VMs on
  the same Proxmox host (6+ distinct external IPs on ports 443/53 in 30s is
  normal for that). Scoping to the range subnet fixed this. Separately,
  dc1/dc2 legitimately resolve time.windows.com/time.google.com/pool.ntp.org
  to several distinct IPs on every NTP sync (see cyber-range CLAUDE.md's
  "Monitoring rollout plan" section), which also tripped the distinct_hosts
  threshold -- excluded via NOT id_resp_p=123. No false positives found over
  2h of normal range background traffic once both fixes were in place.
  v2 (2026-09-30, found while enabling Discord alerting; this fired about
  every 30s): Zeek often records a long-lived session mid-stream with the
  direction reversed, so the SERVER shows up as a source hitting many
  clients' ephemeral ports. Three separate cases, each fixed at its cause:
  (1) the Splunk indexer (10.0.10.2) "scanning" all 7 range hosts, really
  their forwarders' 9997 sessions, where Zeek's first packet was the
  indexer's SYN-ACK (history starts with "H"). A scanner never opens with a
  SYN-ACK, so H-first flows are dropped (case-sensitive: lowercase "h" is a
  different event). (2) dc1/dc2 "scanning" a client's ephemeral ports.
  On same-vnet mirrored taps, checksum offload leaves Zeek only
  bad-checksum packets (history all "C"/"c"), so it can't see flags or
  direction. For those flows only, targets in the ephemeral range
  (>=49152) are ignored, since a reversed server-to-client flow always lands
  on a client's ephemeral port while a scan targets service ports. Flows
  with valid packets keep every port. (3) The range gateway 10.0.2.1
  sweeping WinRM (5985) on all hosts: management traffic NATed by pfSense
  (Ansible/WinRM during maintenance). Attackers route through pfSense with
  their own source IP preserved, so no attacker appears as 10.0.2.1.
  Replayed over the full ~5h of data since boot, v2 fires only on the
  deliberate john-kali scan.
throttle: [attacker_ip]
changes_2026_09_30: >-
  Sliding 30s window per source instead of fixed 30s buckets (a scan split
  across a boundary could miss both thresholds), over the last 30 minutes
  of flows, alerting when a window over threshold includes a newly indexed
  flow. Zeek writes each flow when it ends, so one scan's flows arrive
  over several minutes; the throttle keeps it to one alert per scanner per
  5 minutes. Runs every minute and looks back 30 minutes, so an event
  arriving up to 30 minutes late is still evaluated; before this, each run
  searched the last minute of event time, and anything indexed after its
  run (Security up to ~50s late, Zeek conn p90 ~1 min) was never
  evaluated. Each result row is its own alert, throttled for 5m on the
  `throttle` fields. `ports` is collapsed into ascending numeric ranges
  (`mvexpand` the ports, run-length them with `streamstats`, emit lo or
  lo-hi) so the embed reads `1-122, 124-300` instead of a lexically-sorted
  list of every port -- which also keeps the field under Discord's 1024-char
  cap on a full scan. `list()` caps at 100 ranges (a pathological
  every-other-port scan could hit that; a normal scan is a handful of runs).
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611)
  technique:
    - 'nmap -p 445 -n --open 10.0.2.2-8 (port sweep across all 7 hosts)'
    - 'nmap -p 1-1000 -n --open -Pn 10.0.2.8 (port sweep on one host)'
  result: >-
    Each fired exactly once when run in isolation (distinct_hosts=7 for the
    first; distinct_ports=999 for the second). Also confirmed both run
    back-to-back land in the same 30s bucket and correctly merge into one
    alert covering the whole burst, rather than duplicating.
embed:
  title: Port Scan
  additional_fields:
    - hosts
    - protocol
    - ports
references:
  - detections/backlog.md, "Reconnaissance & discovery"
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
