name: Name Resolution Poisoning
id: recon-name-resolution-poisoning
version: 2
date: '2026-09-30'
status: production
category: reconnaissance
description: >-
  A host answers another host's broadcast/multicast name query with a
  unicast reply. The target sends an LLMNR (224.0.0.252 / ff02::1:3),
  mDNS (224.0.0.251 / ff02::fb) or NBNS (subnet broadcast) query; a
  poisoner (Responder, Inveigh, pretender...) answers it directly. Nothing
  on this network legitimately answers these queries: every name it needs
  resolves through AD DNS, so the only unicast answers are fraudulent ones.
  Works from any source, including a compromised range host: the attacker
  is identified as whoever answered the target's query, not by an
  allowlist of known hosts.
data_source:
  - Zeek conn.log, UDP port 5355 (LLMNR), 5353 (mDNS) or 137 (NBNS): the target's broadcast/multicast query plus the unicast reply to it
search: |-
  index=zeek sourcetype=zeek:conn proto=udp (id_resp_p=5355 OR id_resp_p=5353 OR id_resp_p=137 OR id_orig_p=5355 OR id_orig_p=5353 OR id_orig_p=137)
  | eval protocol=case(id_resp_p=5355 OR id_orig_p=5355, "LLMNR", id_resp_p=5353 OR id_orig_p=5353, "mDNS", true(), "NBNS")
  | eval conn_ts=tonumber(ts), is_query=if(like(id_resp_h, "224.0.0.%") OR like(id_resp_h, "ff02:%") OR like(id_resp_h, "%.255"), 1, 0)
  | eval querier=if(is_query=1, id_orig_h, mvappend(id_orig_h, id_resp_h))
  | mvexpand querier
  | eval responder=if(is_query=1, null(), if(querier=id_orig_h, id_resp_h, id_orig_h)), query_ts=if(is_query=1, conn_ts, null())
  | eventstats values(query_ts) as query_times by querier protocol
  | where isnotnull(responder) AND isnotnull(query_times)
  | eval answered=mvmap(query_times, if(conn_ts>=query_times-1 AND conn_ts<=query_times+5, 1, null()))
  | where isnotnull(answered)
  | rename responder as attacker_ip, querier as target
  | bucket _time span=1m
  | stats values(protocol) as protocols by _time attacker_ip target
  | table attacker_ip target protocols
how_to_implement: >-
  Required a real, significant infra fix, not just a config tweak:
  `defense-tooling`'s existing mirroring (`setup-mirror.sh`) only mirrors
  the ROUTER's (pfSense) own per-vnet tap interface. A Linux bridge is a
  real switch -- two other hosts on the same vnet talking directly (or
  broadcasting) never reach the router's port at all, so the sensor never
  saw this traffic, full stop, regardless of Zeek's own protocol-analyzer
  support. Confirmed live 2026-09-27: ran a genuine Responder poisoning
  round (real poisoned LLMNR/NBT-NS/mDNS answers sent, a real NTLMv2 hash
  captured), and zero packets on these ports ever reached Zeek's capture
  NIC even though the identical capture interface saw thousands of
  ordinary unicast packets/sec from the same subnet. Root-caused and fixed
  with a new script, `defense-tooling/scripts/proxmox/mirror-vnet-guests.sh`,
  that mirrors every guest's own tap on the `ad` vnet (not just the
  router's) to the sensor -- see that script and the Forced Authentication
  detection's YAML (which hit and fixed the identical root cause) for the
  full investigation. Re-ran the exact same poisoning test after the fix:
  the full exchange (broadcast queries, poisoned unicast answers, both
  IPv4 and IPv6) is now visible in `conn.log`.
known_false_positives: >-
  None found in 24h of range background traffic -- every match in that
  window traces to this session's own live tests (the Responder poisoning
  round, and earlier `netexec`/`enum4linux-ng` runs that happened to query
  NBT-NS directly against a specific host as part of their own
  enumeration, which this detection also correctly flags as unicast
  NBT-NS activity). **Documented gap, not fixed:** Zeek's DNS analyzer
  does not decode LLMNR/mDNS packet content on these ports even now that
  the traffic reaches it (confirmed: no `dns.log` entries at all for this
  same traffic, despite the backlog's original assumption that Zeek's DNS
  analyzer would pick these up via dynamic protocol detection regardless
  of port) -- so the planner's `name` (DNS name responded to) and `ip`
  (address provided in the poisoned answer) fields aren't obtainable;
  `host`/`target` (which two hosts were involved) is what's actually
  available. A single real incident may produce two rows (one per
  direction of the exchange) rather than being merged into one -- both
  carry true information, not treated as a bug worth suppressing.

  v2 (2026-09-30), redesigned. v1 flagged ANY unicast flow on these ports
  as host -> target, which had two problems. (1) An ordinary TCP port scan
  (nmap -p 1-1000 from john-kali against workstation) fired it on its TCP
  SYN to port 137: a scan probe, not name resolution. (2) Zeek's orig/resp
  is not the attacker: a poisoned LLMNR answer goes from the poisoner's
  5355 to the querier's ephemeral port, and Zeek records that reply with
  the direction flipped (history "^c"), so v1's `host` was often the victim.
  v2 correlates instead: a target's broadcast/multicast query, then a
  unicast UDP flow on the same protocol between the target and another
  host within -1s/+5s of that query. The other host is attacker_ip,
  whichever way Zeek labelled the flow, so no allowlist is needed and a
  poisoner on a compromised range host is still caught. Replayed over all
  ~6h of data since boot (including the nmap scan that fired v1): exactly
  one result, the Responder test below. Trade-off: a direct unicast NBT-NS
  or mDNS query with no preceding broadcast (netexec/enum4linux-style
  enumeration) no longer fires this detection. That is enumeration, not
  poisoning. The `ports` field became `protocols` (LLMNR/mDNS/NBNS). `name`
  and `ip` remain unobtainable: Zeek writes no dns.log rows for these ports
  and has no NBNS/LLMNR/mDNS log at all (re-confirmed 2026-09-30).
verification:
  date: '2026-09-27'
  reverification_2026_09_30: >-
    v2 correlation logic, live from the test box (10.0.2.10): Responder
    (/opt/Responder, its own venv) for 4 minutes. Responder logged
    "[LLMNR] Poisoned answer sent to 10.0.2.5 for name filesvc" (web's
    scheduled task) and re-captured rsmith/bsmith NTLMv2. Zeek showed web's
    LLMNR/mDNS/NBNS broadcast queries and the test box's unicast replies
    (the LLMNR ones flipped, on web's query source port). The detection
    returned attacker_ip=10.0.2.10, target=10.0.2.5, protocols="LLMNR mDNS
    NBNS" and nothing else since boot.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: test box (VMID 350, 10.0.2.10)
  technique: >-
    Responder (LLMNR/NBT-NS/mDNS poisoning) against web's own built-in
    `CyberHawksSync-FileServiceCheck`/`-BackupMountCheck` scheduled tasks
    as the trigger, after the mirroring fix
  result: >-
    Real poisoned answers sent and captured (matches this backlog's
    already-graduated NTLM Authentication detection's own verification).
    Zeek's conn.log now shows the full exchange: web's broadcast queries
    to 224.0.0.252/224.0.0.251/the subnet broadcast address, AND the test
    box's poisoned unicast answers back to web on all three ports (137,
    5353, 5355), plus the IPv6 equivalents. Fired correctly.
embed:
  title: Name Resolution Poisoning
  additional_fields:
    - target
    - protocols
references:
  - 'detections/backlog.md, "Reconnaissance & discovery" (backlog row: "Name resolution poisoning (LLMNR / NBT-NS / mDNS)")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
