name: Certificate Request (HTTP)
id: adcs-certificate-request-http
version: 4
date: '2026-09-30'
status: production
category: adcs
description: >-
  A certificate enrollment submitted over AD CS HTTP Web Enrollment
  (`/certsrv`) on the CA -- the ESC8 transport, where an attacker relays a
  captured NTLM authentication to the CA's web-enrollment endpoint to obtain
  a certificate as the relayed victim. The detection is keyed per issued
  certificate: each CA 4887 (certificate issued) whose transport is `DCOM`
  -- how AD CS Web Enrollment reaches the CA, versus the `RPC` of ordinary
  ICPR enrollment -- becomes its own row (grouped by Request ID), so several
  cert requests in quick succession each alert separately instead of merging
  into one. Each is confirmed as HTTP (not a local DCOM enrollment) and given
  its attacker IP by an inner join to an authenticated `POST
  /certsrv/certfnsh.asp` (200) from the same user in the CA's IIS log, which
  carries the requesting client IP (`c_ip`) and which no RPC/DCOM enrollment
  ever produces. Complements Certificate Request (RPC), which covers the
  `RPC` path and never touches IIS.
data_source:
  - >-
    IIS request logging on `ca` from the Microsoft-IIS-Logging/Logs ETW
    channel (`index=iis`, host=ca, `cs_uri_stem`, `cs_method`, `cs_username`,
    `c_ip`, `sc_status`) correlated with the CA Security log 4887 (certificate
    issued -- `Requester`, `Request ID`, `Certificate_Template`), already
    forwarded via the ca whitelist
search: |-
  index=windows host=ca EventCode=4887 DCOMorRPC=DCOM `detection_window`
  | rex field=_raw "Requester:\s+(?<ruser>[^\r\n]+)"
  | rex field=_raw "Request ID:\s+(?<id>\S+)"
  | eval user=lower(mvindex(split(trim(ruser),"\\"),-1))
  | eval req_epoch=_time
  | join type=left max=0 user [
      search index=iis host=ca cs_uri_stem="/certsrv/certfnsh.asp" cs_method=POST sc_status=200 earliest=-4h latest=+5m
      | eval user=lower(mvindex(split(cs_username,"\\"),-1)), post=tostring(floor(_time)) . "|" . c_ip
      | stats values(post) as posts by user | eval posts=mvjoin(posts, ";")
    ]
  | eval posts=split(posts, ";")
  | eval prior_posts=mvmap(posts, if(tonumber(mvindex(split(posts, "|"), 0)) <= req_epoch + 2, posts, null()))
  | eval attacker_ip=mvindex(split(mvindex(mvsort(prior_posts), -1), "|"), 1)
  | stats values(attacker_ip) as attacker_ip values(user) as user values(Certificate_Template) as template by id
  | `normalize_user(user)`
  | table attacker_ip user template id
how_to_implement: >-
  Requires IIS request forwarding from `ca` (index=iis, from the
  Microsoft-IIS-Logging/Logs ETW channel as of 2026-09-30 -- see
  defense-tooling's splunk_forwarder_windows role and Web Credential Read's
  how_to_implement for why ETW replaced the buffered W3C files; ca's IIS
  logging exists specifically for this detection) and 4886/4887 in ca's
  Security whitelist (already present). Action-based: it keys on the certificate-issued event
  and its transport plus the web-enrollment object served (an authenticated
  POST to /certsrv/certfnsh.asp returning 200), never on a client tool or
  user-agent -- certipy's `-web`, an ntlmrelayx relay to /certsrv, or a
  browser all produce identical telemetry. It anchors on the CA's own 4887
  filtered to `DCOMorRPC=DCOM` (Web Enrollment reaches the CA over DCOM;
  ordinary ICPR is RPC, covered by Certificate Request (RPC)) and groups by
  Request ID so each issued cert is one alert, then inner-joins the CA IIS
  log by enrolling user (IIS cs_username == 4887 Requester) both to confirm
  the request actually arrived over HTTP (a local/non-web DCOM enrollment
  would have no /certsrv POST) and to attach the attacker's `c_ip` (4887
  carries no source IP). `join max=0` keeps every matching enrollment rather
  than one. Machine accounts are deliberately NOT excluded (ESC8 commonly
  relays a machine account's NTLM). Residual imprecision: if two different
  source IPs enrolled as the SAME user within the join window, each id would
  list both IPs -- not a miss, and not expected in this range. (The IIS ETW
  event carries its own timestamp, so the old HTTP.SYS boot-clock latch that
  future-dated the W3C file lines no longer affects this detection.)
known_false_positives: >-
  None expected in this range: AD CS web enrollment is not used
  legitimately here (it exists for this detection), so any authenticated
  /certsrv/certfnsh.asp POST is an actual web enrollment worth surfacing. In
  an environment where web enrollment is a sanctioned path, this would fire
  on every legitimate web enrollment and should be scoped to unexpected
  source IPs or off-template requests. Because the anchor is the per-id 4887
  filtered to DCOM and confirmed by a same-user /certsrv POST, an ordinary
  RPC enrollment (RPC transport, no IIS) is excluded and does not collide
  with Certificate Request (RPC).

  2026-09-30: attacker IP took the latest certfnsh.asp POST by the same
  user in a 10m window, so a second request by that account (or a retry
  from another host) could overwrite the IP. Now takes that user's POST at
  or before the 4887 event time, the same at-or-before rule as the other
  cert/task detections. Ambiguous only if one account posts from two hosts
  in the same window. Attribution is still by cs_username + time, since IIS
  and the CA event share no request identifier.
throttle: [attacker_ip, id]
changes_2026_09_30: >-
  Now uses the shared `detection_window` like every other detection. It used
  to run a minute further back to give the IIS POST time to be indexed after
  the 4887, because IIS access log lines reached Splunk up to ~60s late from
  HTTP.SYS's file buffer. Since 2026-09-30 ca forwards IIS requests from the
  Microsoft-IIS-Logging/Logs ETW channel instead of the W3C files, which
  arrives in ~1s (faster than the 4887 Security event itself), so no extra
  slack is needed. The IIS join still keeps a request whose POST it can't
  find (attacker_ip blank) instead of dropping the alert. Each result row is
  its own alert, throttled for 5m on the `throttle` fields.
verification:
  date: '2026-09-29'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    certipy-ad req -u dsmith@cyberhawks.lab -p Summer2026 -ca cyberhawks-CA
    -template ESC1Template -web -http-scheme http -http-port 80
    -no-channel-binding -target ca.cyberhawks.lab -upn
    administrator@cyberhawks.lab -- a real HTTP Web Enrollment (ESC8
    transport) against the range's genuine ESC1 template misconfiguration.
    Ran four web enrollments (request IDs 5-8). Each surfaced as its own row
    keyed by id -- e.g. Source_Network_Address=192.168.1.11, user=dsmith,
    template=ESC1Template, id in {6,7,8} all returned together (confirming
    subsequent requests don't collapse into one alert), each 4887 DCOM with a
    matching POST /certsrv/certfnsh.asp (200, cs_username=CYBERHAWKS\DSMITH).
    The RPC detection did not fire on any (DCOM transport, and it has no IIS
    leg). Verified in the real trailing scheduled window as well as ad hoc.
embed:
  title: Certificate Request (HTTP)
  additional_fields:
    - user
    - template
    - id
references:
  - 'detections/backlog.md, "ADCS" (backlog row: "HTTP web enrollment (ESC8)")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
