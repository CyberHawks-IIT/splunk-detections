name: SMB Share Access
id: credential-exposure-smb-share-access
version: 5
date: '2026-10-09'
status: production
category: credential-exposure
description: >-
  Reading content inside sql1's `Shared` file share -- 57 folders of
  realistic filler content across HR/IT/Finance/Engineering/etc., with one
  real leaked credential (`IT\PasswordResets\ResetLog_2026.txt`, the
  smbshare-creds pool account's password) buried in it. Nothing in this
  range legitimately uses this share day to day, so any read inside it is
  the signal -- no threshold needed. Fires only on reads below the share
  root, not on access to the share itself (enumerating shares, listing the
  root), same as SYSVOL Share Read. 5145 can't tell a file from a folder,
  so listing a subfolder counts as a read; `files` keeps only the deepest
  paths read (a folder is dropped when something under it was read), so a
  spider's walk collapses to the files it reached plus any leaf folders.
data_source:
  - Windows Events -- 5145, Share Name = \\*\Shared (sql1), a granted read (Access Mask bit 0x1) below the share root
search: |-
  index=windows EventCode=5145 Share_Name="\\\\*\\Shared" `detection_window`
  | `share_content_read`
  | eval share=mvindex(split(Share_Name, "\\"), -1)
  | stats values(Relative_Target_Name) as files values(share) as share values(ComputerName) as host by Source_Address
  | eval all_paths=files
  | mvexpand files
  | where isnull(mvmap(all_paths, if(substr(all_paths, 1, len(files)+1)==files . "\\", 1, null())))
  | stats values(files) as files values(share) as share values(host) as host by Source_Address
  | rename Source_Address as attacker_ip
  | `normalize_host(host)`
  | table attacker_ip host share files
how_to_implement: >-
  Same infra fix as NETLOGON Share Read / SYSVOL Share Read -- "Detailed
  File Share" auditing was not enabled anywhere in the range; fixed in
  cyber-range's `detection_logging` role and applied live to dc1/dc2/sql1
  this session.
known_false_positives: >-
  None -- zero access to sql1's Shared share of any kind in 24h of range
  background traffic before this session's live test (most of that window
  predates the audit-policy fix, so this baseline is short). In the
  14 days retained on 2026-10-09 the only 5145s on the share were one
  share listing (root access checks only), which no longer fires.
throttle: [attacker_ip]
changes_2026_10_09: >-
  Fired on any 5145 against the share, so just listing sql1's shares
  (`netexec smb --shares` access-checks each share's root,
  `Relative_Target_Name` "\") alerted. Now filtered by `share_content_read`
  like NETLOGON/SYSVOL Share Read (below the root, granted, ReadData
  requested, not a delete-open), and gains a `files` field with SYSVOL
  Share Read's deepest-path pruning, which keeps a spider of the 57
  folders from crowding the leaked file out of Discord's 1024-character
  field limit.
changes_2026_09_30: >-
  One row per source (the minute bucket is gone). Runs every minute over
  the events indexed in the previous minute (`detection_window`), so an
  event is evaluated however late it arrives; before this, each run
  searched the last minute of event time, and anything indexed after its
  run (Security up to ~50s late, Zeek conn p90 ~1 min) was never
  evaluated. Each result row is its own alert, throttled for 5m on the
  `throttle` fields.
verification:
  reverification_2026_10_09: >-
    Live from john-kali (192.168.1.11) as dsmith against sql1, steps ~40s
    apart: `netexec smb --shares` (including its write test, which
    creates and delete-opens a temp file and folder in the share);
    smbclient `ls` of the share root; smbclient `get
    IT\PasswordResets\ResetLog_2026.txt`. Only the get fired, once, 6s
    later (host=sql1, share=Shared,
    files=`IT\PasswordResets\ResetLog_2026.txt`), posted to Discord (HTTP
    204); later runs suppressed. The enumeration and root listing did not
    fire.
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    smbclient //10.0.2.6/Shared -U CYBERHAWKS/user%password -c "get
    IT\PasswordResets\ResetLog_2026.txt"
  result: >-
    Retrieved the file (jjohnson's leaked password, per cyber-range's own
    build verification). Fired exactly once.
embed:
  title: SMB Share Access
  additional_fields:
    - host
    - share
    - files
references:
  - 'detections/backlog.md, "Credential exposure" (backlog row: "File share dump")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
