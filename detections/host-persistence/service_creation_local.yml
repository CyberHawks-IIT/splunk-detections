name: Service Creation (Local)
id: host-persistence-service-creation-local
version: 6
date: '2026-09-30'
status: production
category: host-persistence
description: >-
  A service installed on a host with NO correlated fresh remote (Type 3)
  network logon in the same window -- local persistence set up by an
  attacker already on the box, as opposed to Lateral Movement: Service's
  remote-execution (PsExec-style) case. Same distinguishing logic as
  Scheduled Task Creation (Local).
data_source:
  - >-
    Windows Events -- 7045 (service installed) with no correlated 4624
    (Logon Type 3) on the same host in the same window
search: |-
  index=windows (EventCode=4697 OR EventCode=7045) earliest=-30m latest=+5m
  | eval svc_type=tonumber(replace(Service_Type, "^0x", ""), 16)
  | where isnull(svc_type) OR floor(svc_type/128)%2=0
  | rex field=ComputerName "(?<host_key>[^.]+)"
  | rex field=_raw "Logon ID:\s+(?<sid>0x[0-9A-Fa-f]+)"
  | eval host_key=lower(host_key)
  | stats min(_indextime) as first_indexed latest(eval(if(EventCode=4697,lower(sid),null()))) as session_id latest(eval(if(EventCode=4697,Subject_Account_Name,null()))) as subj_acct by host_key Service_Name
  | where `in_detection_window(first_indexed)`
  | eval has_4697=if(isnull(session_id),0,1), acct=lower(subj_acct)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-4h latest=+5m | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Logon_Type) as subj_type latest(Source_Network_Address) as exact_src latest(_time) as subj_time by host_key session_id ]
  | join type=left host_key acct [ search index=windows EventCode=4624 Logon_Type=3 earliest=-4h latest=+5m Source_Network_Address=* NOT Source_Network_Address IN ("-","10.0.2.1","127.0.0.1","::1","0.0.0.0") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), acct=lower(mvindex(Account_Name,-1)), logon=tostring(floor(_time)) . "|" . Source_Network_Address | stats values(logon) as fb_logons by host_key acct | eval fb_logons=mvjoin(fb_logons, ";") ]
  | eval fb_logons=split(fb_logons, ";")
  | eval fb_pair=mvmap(fb_logons, if(abs(tonumber(mvindex(split(fb_logons, "|"), 0)) - floor(subj_time)) <= 2, fb_logons, null()))
  | eval fb_src=mvindex(split(mvindex(mvsort(fb_pair), -1), "|"), 1)
  | eval exact_src=if(exact_src IN ("-","127.0.0.1","::1","0.0.0.0",""),null(),exact_src)
  | eval src=coalesce(exact_src, fb_src)
  | eval path=case(has_4697=1 AND subj_type!=3,"local", has_4697=1 AND (src=="10.0.2.1" OR isnull(src)),"admin", has_4697=1,"lateral", true(),"local")
  | where path="local"
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS attacker_ip
  | rename host_key as host, Service_Name as service, subj_acct as user
  | `normalize_host(host)`
  | `normalize_user(user)`
  | table attacker_ip host user service
how_to_implement: >-
  No infra fix needed -- shares its data source with Lateral Movement:
  Service, the inverted branch of the same join. **Documented gap, same as
  the remote variant:** 7045 has no resolved account name (only a raw SID),
  and unlike the remote case there's no correlated 4624 available here to
  borrow a resolved name from (that's the whole point of this branch --
  there IS no correlated logon) -- so `user` isn't included in this
  detection's output at all, only `target`/`service`. A SID-to-name lookup
  would need either an LDAP-backed lookup table (not built in this
  project) or accepting the raw SID as-is; left out entirely rather than
  shipping a raw SID under a field named "user".
known_false_positives: >-
  None expected -- no legitimate local service-installation workflow
  exists in this range outside initial provisioning.

  2026-09-30: fired with 14 rows on web (CDPUserSvc_3c1e3,
  WpnUserService_3c1e3, ...), posted to Discord minutes after alerting went
  live. These are per-user service instances Windows creates from its
  built-in templates whenever a user logs on (suffix = logon-session LUID),
  logged as a 4697 by LocalSystem. Excluded structurally, not by name: their
  Service_Type has the SERVICE_USERSERVICE_INSTANCE bit (0x80) set (0xD0/
  0xE0), which Windows applies only to those automatic copies. A service an
  attacker creates (sc create, PsExec, impacket services, a new per-user
  template at 0x50/0x60) never carries it, so it still fires. Events whose
  Service_Type isn't hex (7045's text form) are kept.

  2026-09-30: fallback tightened. A remote NTLM logon produces two 4624s on
  the target in the same second: one carries the source IP, the other (the
  RPC authentication over the named pipe, which is the session that creates
  the task/service) has none, and Windows does not link them (Linked Logon
  ID 0x0, no shared GUID/port/workstation; confirmed on a live atexec
  sample). The fallback used to take the same account's latest
  source-bearing logon in the previous 2 minutes, which could name another
  client using that account. It now requires that logon to be within 2
  seconds of the acting session's own logon on the same host.
throttle: [attacker_ip, host, service]
changes_2026_09_30: >-
  The 4697 (Security log) and 7045 (System log) of one install reach
  Splunk through separate forwarder inputs, so they can be indexed in
  different minutes; a minute bucket that caught only the 7045 misread a
  lateral install as local. Each (host, service) is now evaluated once, in
  the run that indexed its FIRST event, with everything indexed in the
  minute since as context (`in_detection_window(first_indexed)`). Runs
  every minute and looks back 30 minutes, so an event arriving up to 30
  minutes late is still evaluated; before this, each run searched the last
  minute of event time, and anything indexed after its run (Security up to
  ~50s late, Zeek conn p90 ~1 min) was never evaluated. Each result row is
  its own alert, throttled for 5m on the `throttle` fields.
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: re-architected as the local branch of the 4697+7045 service
    trace (see Lateral Movement: Service and its 4697 audit-subcategory infra
    fix). Live-verified: a SYSTEM-created service (sc.exe as SYSTEM, logon type
    5) on workstation -> local with the host's own IP and now carries user (4697
    provides it; 7045-only backstop leaves user blank).
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: workstation itself, via a locally-triggered SYSTEM task (same double-hop pattern as Scheduled Task Creation (Local))
  technique: >-
    The same outer/inner SYSTEM-task trigger used for the scheduled-task
    local test, whose inner action creates a service ("LocalSvcTest2") via
    `sc.exe create` instead of a scheduled task
  result: >-
    Fired exactly once, correctly showing no Source_Network_Address match.
    Confirmed the corresponding remote detection does NOT fire for this
    same event. Service deleted afterward.
embed:
  title: Service Creation (Local)
  additional_fields:
    - host
    - user
    - service
references:
  - 'detections/backlog.md, "Host persistence" (backlog row: "Malicious local service creation")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
