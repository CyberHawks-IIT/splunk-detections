name: Scheduled Task Creation (Local)
id: host-persistence-scheduled-task-local
version: 2
date: '2026-09-29'
status: production
category: host-persistence
description: >-
  A scheduled task created on a host with NO correlated fresh remote (Type
  3) network logon in the same window -- the signature of local
  persistence set up by an attacker already on the box (a dropped payload,
  an already-running implant), as opposed to Lateral Movement: Scheduled
  Task's remote-execution case. The absence of a correlated logon is
  exactly what distinguishes the two.
data_source:
  - >-
    Windows Events -- 4698 (scheduled task created) with no correlated 4624
    (Logon Type 3) on the same host in the same window
search: |-
  index=windows EventCode=4698
  | rex field=ComputerName "(?<host_key>[^.]+)"
  | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)"
  | eval host_key=lower(host_key), session_id=lower(session_id), acct=lower(Subject_Account_Name)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-1h | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Logon_Type) as subj_type latest(Source_Network_Address) as exact_src by host_key session_id ]
  | join type=left host_key acct [ search index=windows EventCode=4624 Logon_Type=3 earliest=-2m Source_Network_Address=* NOT Source_Network_Address IN ("-","10.0.2.1","127.0.0.1","::1","0.0.0.0") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), acct=lower(mvindex(Account_Name,-1)) | stats latest(Source_Network_Address) as fb_src by host_key acct ]
  | eval exact_src=if(exact_src IN ("-","127.0.0.1","::1","0.0.0.0",""),null(),exact_src)
  | eval src=coalesce(exact_src, fb_src)
  | eval path=case(subj_type!=3,"local", src=="10.0.2.1" OR isnull(src),"admin", true(),"lateral")
  | where path="local"
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip
  | bucket _time span=1m
  | stats values(Subject_Account_Name) as user values(host_ip) as host_ip by _time host_key Task_Name
  | eval Source_Network_Address=host_ip
  | rename host_key as host, Task_Name as task
  | table Source_Network_Address host user task
how_to_implement: >-
  No infra fix needed -- shares its data source with Lateral Movement:
  Scheduled Task, just the inverted `isnull()` branch of the same join.
  **Real testing challenge solved, worth documenting:** genuinely
  simulating "local, no remote logon at all" from a control host that only
  has WinRM access is harder than it sounds -- a plain
  `Invoke-Command`-created task always has ITS OWN WinRM logon essentially
  simultaneous with the task creation, which would incorrectly look
  "remote" even though 10.0.2.1 is excluded (the point being to prove the
  *correlation logic itself* works, not just to lean on the exclusion).
  Solved by using the SYSTEM-scheduled-task double-hop pattern already
  established in this session's memory (an outer WinRM-created task that
  triggers an *inner* task, which runs moments later via the Task
  Scheduler engine's own Batch-type execution context -- not a fresh
  Network logon at all) to get a genuinely representative local-creation
  event.
known_false_positives: >-
  None expected -- no legitimate local task-scheduling workflow exists in
  this range outside of range provisioning itself (which predates any
  detection's live window).
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: re-architected as the local (non-network subject session) branch
    of the 4698 trace (see Lateral Movement: Scheduled Task). Live-verified: a
    SYSTEM-created task (logon type 5) on workstation -> local with the host's
    own IP (10.0.2.8) and now carries user.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: workstation itself, via a locally-triggered SYSTEM task (see how_to_implement)
  technique: >-
    An outer WinRM-created task ("TriggerLocalPersist") whose own action
    creates a second task ("LocalPersistTest2") when it fires -- the inner
    creation has no correlated Type 3 logon from any non-excluded IP
  result: >-
    Fired exactly once for the inner task, correctly showing no
    Source_Network_Address match. Confirmed the corresponding *remote*
    detection does NOT fire for this same event (verified together as a
    pair). All test tasks deleted afterward.
embed:
  title: Scheduled Task Creation (Local)
  additional_fields:
    - target
    - task
references:
  - 'detections/backlog.md, "Host persistence" (backlog row: "Local scheduled task persistence")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
