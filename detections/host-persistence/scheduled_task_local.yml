name: Scheduled Task Creation (Local)
id: host-persistence-scheduled-task-local
version: 5
date: '2026-09-30'
status: production
category: host-persistence
description: >-
  A scheduled task created on a host with NO correlated fresh remote (Type
  3) network logon in the same window -- the signature of local
  persistence set up by an attacker already on the box (a dropped payload,
  an already-running implant), as opposed to Lateral Movement: Scheduled
  Task's remote-execution case. The absence of a correlated logon is
  exactly what distinguishes the two.
data_source:
  - >-
    Windows Events -- 4698 (scheduled task created) with no correlated 4624
    (Logon Type 3) on the same host in the same window
search: |-
  index=windows EventCode=4698
  | rex field=ComputerName "(?<host_key>[^.]+)"
  | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)"
  | eval host_key=lower(host_key), session_id=lower(session_id), acct=lower(Subject_Account_Name)
  | rex field=_raw "Security ID:\s+(?<subject_sid>S-[0-9-]+)"
  | rex field=_raw "<URI>(?<task_uri>[^<]*)</URI>"
  | rex field=_raw "<UserId>(?<task_principal>[^<]*)</UserId>"
  | rex field=_raw "<Actions Context=\"(?<task_context>[^\"]*)\">"
  | rex field=_raw max_match=0 "<(?<task_action>Exec|ComHandler|SendEmail|ShowMessage)>"
  | rex field=_raw "<Command>(?<task_cmd>[^<]*)</Command>"
  | rex field=_raw "<Arguments>(?<task_args>[^<]*)</Arguments>"
  | eval defender_scan=if(session_id="0x3e7" AND subject_sid="S-1-5-18" AND Task_Name="\\Microsoft\\Windows\\Windows Defender\\Windows Defender Scheduled Scan" AND task_uri=Task_Name AND task_principal="S-1-5-18" AND task_context="LocalSystem" AND mvcount(task_action)=1 AND task_action="Exec" AND match(task_cmd, "^C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\\\\MpCmdRun\.exe$") AND task_args="Scan -ScheduleJob -ScanTrigger 55 -IdleScheduledJob", 1, 0)
  | where defender_scan=0
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-1h | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Logon_Type) as subj_type latest(Source_Network_Address) as exact_src latest(_time) as subj_time by host_key session_id ]
  | join type=left host_key acct [ search index=windows EventCode=4624 Logon_Type=3 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","10.0.2.1","127.0.0.1","::1","0.0.0.0") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), acct=lower(mvindex(Account_Name,-1)), logon=tostring(floor(_time)) . "|" . Source_Network_Address | stats values(logon) as fb_logons by host_key acct | eval fb_logons=mvjoin(fb_logons, ";") ]
  | eval fb_logons=split(fb_logons, ";")
  | eval fb_pair=mvmap(fb_logons, if(abs(tonumber(mvindex(split(fb_logons, "|"), 0)) - floor(subj_time)) <= 2, fb_logons, null()))
  | eval fb_src=mvindex(split(mvindex(mvsort(fb_pair), -1), "|"), 1)
  | eval exact_src=if(exact_src IN ("-","127.0.0.1","::1","0.0.0.0",""),null(),exact_src)
  | eval src=coalesce(exact_src, fb_src)
  | eval path=case(subj_type!=3,"local", src=="10.0.2.1" OR isnull(src),"admin", true(),"lateral")
  | where path="local"
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip
  | bucket _time span=1m
  | stats values(Subject_Account_Name) as user values(host_ip) as host_ip by _time host_key Task_Name
  | eval Source_Network_Address=host_ip
  | rename host_key as host, Task_Name as task
  | rename Source_Network_Address as attacker_ip
  | eval host=if(isnull(host), null(), mvmap(host, if(match(host, "^[0-9.]+$") OR like(host, "%:%"), host, lower(replace(host, "\..*$", "")))))
  | eval user=if(isnull(user), null(), mvmap(user, replace(replace(user, "^.*\\\\", ""), "@.*$", "")))
  | table attacker_ip host user task
how_to_implement: >-
  No infra fix needed -- shares its data source with Lateral Movement:
  Scheduled Task, just the inverted `isnull()` branch of the same join.
  **Real testing challenge solved, worth documenting:** genuinely
  simulating "local, no remote logon at all" from a control host that only
  has WinRM access is harder than it sounds -- a plain
  `Invoke-Command`-created task always has ITS OWN WinRM logon essentially
  simultaneous with the task creation, which would incorrectly look
  "remote" even though 10.0.2.1 is excluded (the point being to prove the
  *correlation logic itself* works, not just to lean on the exclusion).
  Solved by using the SYSTEM-scheduled-task double-hop pattern already
  established in this session's memory (an outer WinRM-created task that
  triggers an *inner* task, which runs moments later via the Task
  Scheduler engine's own Batch-type execution context -- not a fresh
  Network logon at all) to get a genuinely representative local-creation
  event.
known_false_positives: >-
  None expected -- no legitimate local task-scheduling workflow exists in
  this range outside of range provisioning itself (which predates any
  detection's live window).

  2026-09-30: fired on Windows Defender re-registering its own
  "Windows Defender Scheduled Scan" task as SYSTEM around reboots and
  platform updates (8 rows in 24h on dc2, ca, sql2, web). Excluded only when
  EVERY property matches Defender's own registration: subject SYSTEM
  (S-1-5-18, Logon ID 0x3E7); exact task name, with the XML URI equal to it;
  principal S-1-5-18 and action context LocalSystem; exactly one action, an
  Exec; command exactly C:\ProgramData\Microsoft\Windows
  Defender\Platform\<n.n.n.n-n>\MpCmdRun.exe (only the platform version
  may vary, since it changes on every Defender platform update); arguments
  exactly "Scan -ScheduleJob -ScanTrigger 55 -IdleScheduledJob". Anything
  else under that name (a different or lookalike binary, extra arguments or
  actions, a COM handler, a user creator or principal) still fires. The one
  residual blind spot is a task byte-identical to Defender's, which runs
  only Defender's real signed scanner. The command match is on the task's
  registered action, not an attacker's command line.

  2026-09-30: fallback tightened. A remote NTLM logon produces two 4624s on
  the target in the same second: one carries the source IP, the other (the
  RPC authentication over the named pipe, which is the session that creates
  the task/service) has none, and Windows does not link them (Linked Logon
  ID 0x0, no shared GUID/port/workstation; confirmed on a live atexec
  sample). The fallback used to take the same account's latest
  source-bearing logon in the previous 2 minutes, which could name another
  client using that account. It now requires that logon to be within 2
  seconds of the acting session's own logon on the same host.
verification:
  date: '2026-09-27'
  reverification_2026_09_30: >-
    Defender exclusion: all 8 real Defender re-registrations from the last
    30h evaluate as excluded; 13 synthetic variants built from a real event
    (genuine, newer platform version, binary outside the Platform dir,
    lookalike path, renamed binary, appended payload, changed arguments,
    second Exec, extra ComHandler, different task name, user-session
    creator, user principal, non-LocalSystem context) all classify as
    expected: only the first two are excluded.
  reverification_2026_09_29: >-
    2026-09-29: re-architected as the local (non-network subject session) branch
    of the 4698 trace (see Lateral Movement: Scheduled Task). Live-verified: a
    SYSTEM-created task (logon type 5) on workstation -> local with the host's
    own IP (10.0.2.8) and now carries user.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: workstation itself, via a locally-triggered SYSTEM task (see how_to_implement)
  technique: >-
    An outer WinRM-created task ("TriggerLocalPersist") whose own action
    creates a second task ("LocalPersistTest2") when it fires -- the inner
    creation has no correlated Type 3 logon from any non-excluded IP
  result: >-
    Fired exactly once for the inner task, correctly showing no
    Source_Network_Address match. Confirmed the corresponding *remote*
    detection does NOT fire for this same event (verified together as a
    pair). All test tasks deleted afterward.
embed:
  title: Scheduled Task Creation (Local)
  additional_fields:
    - host
    - user
    - task
references:
  - 'detections/backlog.md, "Host persistence" (backlog row: "Local scheduled task persistence")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
