name: LDAP Query
id: enumeration-ldap-query
version: 8
date: '2026-10-02'
status: production
category: enumeration
description: >-
  An LDAP, LDAPS, or ADWS (Active Directory Web Services) directory search
  against a domain controller from an IP not in this range's known static-IP
  inventory (i.e. not one of the range's own domain-joined hosts) -- the
  network-visible half of any directory enumeration tool (ldapsearch,
  BloodHound's SharpHound, netexec's `--users`/`--groups`, the ActiveDirectory
  PowerShell module, SOAPHound, etc). It anchors on the DC's own 1644 "Field
  Engineering" event, which logs every directory search with the bind account
  and the exact filter, so LDAP, LDAPS and ADWS all report the user and query.
  For LDAP and LDAPS the 1644 also carries the real client IP, so those fire on
  each query with no dependence on Zeek. ADWS runs the search on the DC over
  loopback, so its 1644 shows client `[::1]`; its real client IP and the
  ldap-vs-ldaps distinction come from Zeek's immediate connection-open log
  (`zeek:conn_open`), written when the TCP session is established rather than
  when it closes.
data_source:
  - >-
    Windows Event 1644 (Field Engineering, Directory Service log, dc1/dc2) for
    the bind account, filter and -- for LDAP/LDAPS -- the client IP, correlated
    to Zeek `conn_open.log` (`zeek:conn_open`, the connection-open log for
    TCP/389, TCP/636 and TCP/9389): by client IP + source port to label
    ldap vs ldaps, and by DC + connection time for the ADWS (9389) client IP
    that 1644 does not carry
search: |-
  index=windows source="WinEventLog:Directory Service" EventCode=1644 `detection_window`
  | rex field=_raw "Client:\r?\n\s*(?<client_raw>[^\r\n]+)"
  | rex field=_raw "Filter:\r?\n\s*(?<query>.+?)\s*\r?\n"
  | rex field=_raw "Attribute selection:\r?\n(?<attributes>[^\r\n]*)"
  | eval attributes=split(replace(replace(trim(attributes), "^\[all(_with_list)?\]", "*,"), ",$", ""), ",")
  | eval attributes=mvmap(attributes, if(trim(attributes)="", null(), trim(attributes)))
  | rex field=_raw "User:\r?\n\s*(?<user>\S+)"
  | eval client_raw=trim(client_raw)
  | rex field=client_raw "^\[?(?<client_ip>[^\]\s]+?)\]?:(?<client_port>\d+)$"
  | eval is_adws=if(client_ip="::1" OR client_ip="127.0.0.1", 1, 0)
  | eval host=lower(replace(host, "\..*$", ""))
  | where (is_adws=1 AND NOT like(user, "%$") AND user!="UNAVAILABLE") OR is_adws=0
  | lookup known_range_hosts ip AS client_ip OUTPUT hostname AS client_is_range
  | where is_adws=1 OR isnull(client_is_range)
  | eval cp_key=if(is_adws=0, client_ip.":".client_port, "na")
  | join type=left cp_key [
      search index=zeek sourcetype=zeek:conn_open (id_resp_p=389 OR id_resp_p=636) earliest=-30m
      | eval cp_key=id_orig_h.":".id_orig_p
      | stats latest(id_resp_p) as dport by cp_key ]
  | join type=left max=0 host [
      search index=zeek sourcetype=zeek:conn_open id_resp_p=9389 earliest=-30m
      | lookup known_range_hosts ip AS id_orig_h OUTPUT hostname AS orig_is_range
      | where isnull(orig_is_range)
      | lookup known_range_hosts ip AS id_resp_h OUTPUT hostname AS host
      | eval host=lower(host), pair=ts."|".id_orig_h
      | stats list(pair) as pairs by host ]
  | eval pairs=if(is_adws=1, split(mvjoin(pairs, " "), " "), null())
  | eval cand=mvmap(pairs, if(tonumber(mvindex(split(pairs, "|"), 0)) <= _time+2, pairs, null()))
  | eval adws_ip=mvindex(split(mvindex(mvsort(cand), -1), "|"), 1)
  | eval attacker_ip=if(is_adws=1, adws_ip, client_ip)
  | eval protocol=case(is_adws=1, "adws", dport=389, "ldap", dport=636, "ldaps", true(), "ldap")
  | where isnotnull(attacker_ip)
  | stats values(user) as user values(query) as query values(attributes) as attributes by attacker_ip host protocol
  | `normalize_host(host)`
  | `normalize_user(user)`
  | table attacker_ip host protocol user query attributes
how_to_implement: >-
  **1644 must log every search, with the thresholds at 1, not 0.**
  cyber-range's `configure_1644.ps1` sets Field Engineering (NTDS\Diagnostics
  "15 Field Engineering") to 5 and the three NTDS\Parameters search thresholds
  ("Search Time Threshold (msecs)", "Expensive Search Results Threshold",
  "Inefficient Search Results Threshold") all to 1. At 0 (Microsoft's "use the
  default" = 30000 ms / 10000 visited / 1000 visited) only slow or unindexed
  searches log, so indexed recon like `(sAMAccountName=administrator)` produces
  no 1644 over any protocol; at 1 a single-object indexed lookup logs. Read
  live, no NTDS restart. LDAP, LDAPS and ADWS all produce a 1644: LDAP/LDAPS
  with the real client IP:port (LDAPS is logged after the DC terminates TLS),
  ADWS with client `[::1]` and the real remote user because ADWS runs the
  search on the DC over loopback.
  **Attribution changed 2026-09-30 (latency pass): anchor on 1644, enrich from
  Zeek's connection-open log.** The detection used to anchor on the Zeek
  `conn.log` flow (`id_orig_h` as the attacker IP), which is only written when
  the connection closes -- so it was slow, and it could fire on a bare TLS
  connection that never completed a search, producing an embed with no user or
  query. It now anchors on the 1644 itself (logged ~1s after each search), so
  it fires per query and always has the user and filter. LDAP/LDAPS take the
  client IP straight from the 1644. ADWS's real IP and the ldap-vs-ldaps label
  (the 1644 does not record which port the client used) come from
  `zeek:conn_open`, a lightweight log the Zeek sensor writes on
  `connection_established` for ports 389/636/9389 (see defense-tooling's
  `zeek_sensor` role `cyberhawks.zeek` and the `dt_detection_content`
  `zeek:conn_open` field extraction). Because that log is written when the TCP
  session opens -- before the first query -- it is always already indexed by
  the time a 1644 arrives, so both joins resolve immediately (no waiting for
  the connection to close, which for a pooled ADWS session could be minutes).
  The ADWS join is by DC + time (most recent external 9389 open at/before the
  1644); if Zeek did not see the 9389 connection (e.g. an on-subnet client
  whose mirrored traffic Zeek can't reassemble) the ADWS row has no IP and is
  dropped rather than alerting without attribution. **Volume:** 1644 is
  ~52 MB/day at these thresholds, nearly all the DCs' own searches, dropped at
  the forwarder (dc1/dc2 Directory Service blacklist: DC machine accounts
  DC1$/DC2$ and user UNAVAILABLE only; any other `$` account is still
  forwarded). `conn_open` is a few hundred lines a day (all directory-service
  ports), negligible.
known_false_positives: >-
  `known_range_hosts` excludes every domain-joined host's static IP, so
  ordinary intra-domain LDAP/ADWS traffic (group policy refresh, member
  servers querying the DC, RSAT from the workstation) never reaches this
  search: for LDAP/LDAPS the 1644's client IP is checked against it directly,
  and for ADWS the 9389 connection's origin is. ADWS query attribution is by
  time, not an exact key: if an in-range admin's ADWS session overlapped an
  outside session to the same DC the outside alert could list the admin's
  queries too (it still only fires for the outside IP). Because the anchor is
  the 1644, a bare port scan or an incomplete TLS handshake to 389/636 -- which
  runs no directory search -- produces no 1644 and cannot fire this (the old
  Zeek-anchored version needed a "history contains D" guard for exactly that;
  no longer relevant). Revisit if a legitimate non-domain-joined LDAP/ADWS
  client (a vulnerability scanner, a monitoring agent) is ever added.
changes_2026_10_02: >-
  Added `attributes`: the attribute list each search asked for, from the
  1644's "Attribute selection" (already in the event, so no new data), split
  into individual names and de-duplicated across the grouped queries. "*"
  stands for "all attributes" (1644's `[all]` / `[all_with_list]` prefix).
  Replayed against the day's real activity: john-kali's LAPS read showed
  `msLAPS-EncryptedPassword msLAPS-Password sAMAccountName`.
throttle: [attacker_ip, host, protocol]
changes_2026_09_30: >-
  Re-anchored from the Zeek `conn.log` flow onto the DC's 1644 event, as part
  of the latency pass. LDAP and LDAPS now fire per query with no Zeek
  dependency (client IP, user and filter all come from the 1644); LDAPS in
  particular now always shows the user and query, which the old flow-anchored
  version dropped when a TLS connection completed no search. ADWS fires per
  query too, taking its client IP and the ldap/ldaps label from the new
  `zeek:conn_open` connection-open log (written on session establishment, so it
  is available immediately rather than at connection close). The old
  history-"D" scan guard and the `conn.log` join are gone. Grouped by attacker,
  DC and protocol; each result row is its own alert, throttled for 5m on the
  `throttle` fields. (Implementation note: the ADWS join carries the candidate
  9389 opens as a single multivalue `pair` = `ts|ip` field and re-splits it
  with `split(mvjoin(...))` after the join, because `join` flattens a
  multivalue field into one space-joined value -- a plain `mvzip` of two such
  fields mis-pairs them.)
verification:
  reverification_2026_09_30_latency: >-
    Rebuilt to anchor on 1644 + zeek:conn_open. Live from john-kali
    (192.168.1.11): ldapsearch as dsmith over ldap:// and ldaps:// to dc1 with
    `(sAMAccountName=administrator)` / `(servicePrincipalName=*)` -- both fired
    with protocol correctly labelled ldap vs ldaps (from conn_open's dest port),
    user dsmith@cyberhawks.lab and the full filter, ~13-18s after the query.
    ADWS from john-windows: fired with the real client IP (from the 9389
    conn_open), protocol adws, the remote user and the filter. conn_open lands
    in Splunk in ~0.2s. See the pre-latency-pass verification below for the
    original threshold/LDAPS/ADWS findings.
  reverification_2026_09_30: >-
    History-filter change (superseded by the latency re-anchor above), replayed
    inline over all data since boot: the old logic returned the nmap scan's SYN
    probes to workstation 389/636 (no user, no query) plus the real queries;
    the new logic returns only the real queries.
  date: '2026-09-29'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11) for LDAP/LDAPS; john-windows (VM 610, 192.168.1.10) for ADWS
  technique: >-
    From john-kali: `ldapsearch -x -H ldap://10.0.2.2 -D dsmith@cyberhawks.lab
    ...` with an indexed filter `(sAMAccountName=administrator)`, and the
    same over `ldaps://` with `(servicePrincipalName=*)` -- both produced no
    1644 at all before the threshold fix. From john-windows: `Get-ADUser
    -Server 10.0.2.2 -Credential cyberhawks\dsmith -Filter 'adminCount -eq 1'`
    over ADWS/9389.
  result: >-
    Live via the deployed scheduled search (2026-09-29, after the threshold
    fix + forwarder blacklist): the 12:59 run returned exactly two rows --
    ldap (192.168.1.11 -> 10.0.2.2, user dsmith@cyberhawks.lab, query
    `(description=*) (sAMAccountName=administrator)`) and ldaps (same IP/
    user, query `(servicePrincipalName=*)`); the 13:00 run returned exactly
    one adws row (192.168.1.10 -> 10.0.2.2, user CYBERHAWKS\dsmith, query =
    every filter the cmdlet issued, including `(servicePrincipalName=*)` and
    ADWS's own schema lookups). Negative control: workstation (a range
    host) querying dc1 as its machine account produced no alert.
embed:
  title: LDAP Query
  additional_fields:
    - host
    - protocol
    - user
    - query
    - attributes
references:
  - 'detections/backlog.md, "Enumeration (info pulled)" (backlog row: "LDAP query content")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
  - https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/event1644reader-analyze-ldap-query-performance
  - https://www.huntress.com/blog/ldap-active-directory-detection-part-5b
