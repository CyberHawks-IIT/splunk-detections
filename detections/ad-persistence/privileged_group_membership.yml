name: Privileged Group Membership
id: ad-persistence-privileged-group-membership
version: 2
date: '2026-09-29'
status: production
category: ad-persistence
description: >-
  A member added to or removed from a Tier-0 AD group (Domain Admins,
  Enterprise Admins, Schema Admins, built-in Administrators, Account
  Operators, Backup Operators, Server Operators). No ongoing membership
  churn in these groups is expected post-provisioning, so both directions
  fire with no additional filtering.
data_source:
  - >-
    Windows Events -- 4728/4732/4756 (member added to a global/local/
    universal security group) and their removal counterparts 4729/4733/4757
search: |-
  index=windows (EventCode=4728 OR EventCode=4729 OR EventCode=4732 OR EventCode=4733 OR EventCode=4756 OR EventCode=4757)
  Group_Name IN ("Domain Admins", "Enterprise Admins", "Schema Admins", "Administrators", "Account Operators", "Backup Operators", "Server Operators")
  | eval type=case(EventCode=4728 OR EventCode=4732 OR EventCode=4756, "add", EventCode=4729 OR EventCode=4733 OR EventCode=4757, "remove")
  | rex field=Member_Account_Name "(?:CN=)?(?<target>[^,]+)"
  | rex field=ComputerName "(?<host_key>[^.]+)"
  | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)"
  | eval host_key=lower(host_key), session_id=lower(session_id)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Source_Network_Address) as logon_src by host_key session_id ]
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip
  | eval Source_Network_Address=coalesce(logon_src, host_ip)
  | bucket _time span=1m
  | stats values(Subject_Account_Name) as user values(Source_Network_Address) as Source_Network_Address by _time Group_Name target type
  | rename Source_Network_Address as attacker_ip
  | table attacker_ip user type target
how_to_implement: >-
  Required a real infra fix: 4728/4732/4756 (the "add member" events) were
  already in defense-tooling's Security-channel forwarder whitelist, but
  their removal counterparts 4729/4733/4757 were not -- confirmed via
  Get-WinEvent directly on dc1 that the removal event genuinely fires
  locally (RecordId present, auditpol shows "Security Group Management" =
  Success and Failure) but never reached Splunk before this fix, since it
  was silently dropped at the forwarder's inputs.conf whitelist stage, not
  an audit-policy gap. Fixed in defense-tooling's
  group_vars/splunk_forwarders_windows/monitor.yml (added 4729,4733,4757
  to the common Security whitelist) and applied live to dc1/dc2's
  forwarder_inputs app + service restart. Group_Name is filtered to the
  Tier-0 groups list rather than alerting on every security group, since
  ordinary (non-privileged) group membership churn may be legitimate in a
  larger domain -- not observed here, but scoping now avoids having to
  revisit this if the range ever grows non-Tier-0 groups.
known_false_positives: >-
  None expected in this range -- no ongoing AD administration happens here
  after initial provisioning. **Documented gap, same pattern as Machine
  Account Creation/DNS Record Creation:** 4728/4729/4732/4733/4756/4757
  carry no source IP field, so the Attacker-lookup embed field can't be
  populated from this event; `user` (who made the change) is the available
  attribution.
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: added the logon-session IP trace. Re-fired add+remove of skumar
    in Domain Admins; resolves the acting session's source (control-host path ->
    DC host IP here; a network-sourced change resolves the real IP via the same
    trace).
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: WinRM from the control host, as domain admin (simulating an attacker who already achieved Domain Admin and is adding a persistence account)
  technique: >-
    Add-ADGroupMember -Identity "Domain Admins" -Members "skumar", then
    Remove-ADGroupMember -Identity "Domain Admins" -Members "skumar"
  result: >-
    4729 (remove) confirmed completely missing from Splunk before the
    forwarder-whitelist fix despite firing locally on dc1; both 4728 (add)
    and 4729 (remove) fired exactly once each after the fix, correctly
    typed and attributed. skumar's real group membership restored to its
    original state afterward.
embed:
  title: Privileged Group Membership
  additional_fields:
    - user
    - type
    - target
references:
  - 'detections/backlog.md, "AD persistence & privilege escalation" (backlog row: "New Domain Admin / privileged group membership change")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
