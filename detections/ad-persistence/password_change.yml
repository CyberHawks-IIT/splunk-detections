name: Password Change
id: ad-persistence-password-change
version: 1
date: '2026-10-02'
status: production
category: ad-persistence
description: >-
  One account changes or resets another account's password, or its own. A
  reset without the old password (4724) is how an attacker abuses
  ForceChangePassword / GenericAll / User-Force-Change-Password rights over a
  user to take the account over; a change with the old password (4723) is
  what an attacker who has guessed, sprayed or cracked a password does to lock
  the real owner out or satisfy "must change password at next logon". Both
  are logged by the machine that holds the account: a DC for a domain account,
  the member server itself for a local one.
data_source:
  - >-
    Windows Events -- 4723 (an attempt was made to change an account's
    password) and 4724 (an attempt was made to reset an account's password),
    successes only. Subject = the account doing it, Target Account = whose
    password changed; the Subject Logon ID traces to the 4624 that carries the
    network source.
search: |-
  index=windows source="WinEventLog:Security" (EventCode=4723 OR EventCode=4724) Keywords="Audit Success" `detection_window`
  | rex field=_raw "Subject:\s+Security ID:\s+\S+\s+Account Name:\s+(?<user>[^\r\n]+?)\s*[\r\n]"
  | rex field=_raw "Target Account:\s+Security ID:\s+\S+\s+Account Name:\s+(?<target>[^\r\n]+?)\s*[\r\n]"
  | `subject_session`
  | where session_id!="0x3e7" AND NOT (lower(user)="cloudbase-init" AND lower(target)="cloudbase-init")
  | eval acct=lower(user)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-4h latest=+5m | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Source_Network_Address) as exact_src latest(_time) as subj_time by host_key session_id ]
  | join type=left host_key acct [ search index=windows EventCode=4624 Logon_Type=3 earliest=-4h latest=+5m Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1","0.0.0.0") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), acct=lower(mvindex(Account_Name,-1)), logon=tostring(floor(_time)) . "|" . Source_Network_Address | stats values(logon) as fb_logons by host_key acct | eval fb_logons=mvjoin(fb_logons, ";") ]
  | eval fb_logons=split(fb_logons, ";")
  | eval fb_pair=mvmap(fb_logons, if(abs(tonumber(mvindex(split(fb_logons, "|"), 0)) - floor(subj_time)) <= 2, fb_logons, null()))
  | eval fb_src=mvindex(split(mvindex(mvsort(fb_pair), -1), "|"), 1)
  | eval exact_src=if(exact_src IN ("-","127.0.0.1","::1","0.0.0.0",""), null(), exact_src)
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip
  | eval attacker_ip=coalesce(exact_src, fb_src, host_ip), host=host_key
  | where attacker_ip!="10.0.2.1"
  | stats count by attacker_ip host user target
  | `normalize_host(host)`
  | `normalize_user(user)`
  | `normalize_user(target)`
  | table attacker_ip host user target
how_to_implement: >-
  Needed 4723 and 4724 added to the forwarder's common Security-channel
  whitelist (defense-tooling `group_vars/splunk_forwarders_windows/
  monitor.yml`, 2026-10-02). Both are required: they are different techniques
  (change with the old password vs reset without it) and neither event is
  raised for the other. "User Account Management" auditing was already
  Success and Failure on all 7 hosts. Measured before enabling: one 4723/4724
  in ~2 days across all hosts, so the added volume is effectively zero and no
  forwarder-side filtering was worth its cost. Attacker IP comes from the
  Subject Logon ID -> 4624 trace. A remote NTLM logon (WinRM, PsExec) writes
  two 4624s in the same second and the session that acts has source "-" with
  no link to the other, so when the exact trace finds no address the search
  takes the same host + account's network 4624 within 2s of that session's
  logon -- the fallback the Scheduled Task / Service detections use. Seen live:
  a reset run through WinRM resolved to the DC's own IP until this was added.
known_false_positives: >-
  Excluded: this project's control host (10.0.2.1, as in the RDP / WinRM /
  Scheduled Task detections); changes made by SYSTEM (Logon ID 0x3e7), which is how Windows LAPS
  rotates a member server's local Administrator password (ca and sql2), and
  cloudbase-init resetting its own password at boot (seen on dc1). An
  administrator's legitimate password reset would match; none happens in this
  range after provisioning.
throttle: [attacker_ip, user, target]
verification:
  date: '2026-10-02'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    As `user` (the range account holding ForceChangePassword on skhan):
    impacket-changepasswd cyberhawks.lab/skhan@10.0.2.2 -reset -altuser
    cyberhawks.lab/user (a SAMR reset without the old password, 4724), then
    impacket-changepasswd cyberhawks.lab/user@10.0.2.2 (an own-password change,
    4723). skhan was left with a new password; user was restored afterwards.
  result: >-
    Fired twice on dc1 from 192.168.1.11: user -> skhan (reset) and
    user -> user (change), attributed through the SMB session's 4624.
embed:
  title: Password Change
  additional_fields:
    - host
    - user
    - target
references:
  - User request 2026-10-02 (new detection, named by the user)
disabled: false
