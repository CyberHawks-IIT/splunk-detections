name: Computer Password Spray
id: weak-auth-computer-password-spray
version: 1
date: '2026-09-27'
status: production
category: weak-auth
description: >-
  Any successful authentication as computer4$ (pre-Windows-2000-compatible
  default machine password, the lowercase account name) or computer5$
  (blank password, NT hash 31d6cfe0d16ae931b73c59d7e0c089c0). Unlike the
  real range hosts' machine accounts (DC1$, WEB$, etc.), which
  legitimately authenticate constantly as part of normal domain operation,
  computer4/computer5 are placeholder AD objects with no real host behind
  them -- there is no legitimate reason either one ever successfully
  authenticates, so any occurrence at all is the signal. No threshold
  needed.
data_source:
  - Windows Events -- 4624 (SMB/NTLM logon), 4768 with Result Code 0x0 (Kerberos TGT)
search: |-
  index=windows (EventCode=4624 OR (EventCode=4768 AND Result_Code=0x0))
  | eval target_user=mvindex(Account_Name, -1)
  | where target_user IN ("computer4$","computer5$")
  | eval ip=replace(coalesce(Source_Network_Address, Client_Address), "^::ffff:", "")
  | bucket _time span=1m
  | stats values(target_user) as successes values(ComputerName) as host by _time ip
  | rename ip as attacker_ip
  | table attacker_ip host successes
how_to_implement: >-
  Requires defense-tooling's Windows forwarder shipping Security log
  4624/4768 from the DCs (already forwarded). No infra fix needed. Both
  auth vectors matter: computer4's pre-2k default password only produced a
  usable TGT (4768) in live testing, not a full SMB logon (netexec's own
  SMB auth attempt against it failed with
  STATUS_NOLOGON_WORKSTATION_TRUST_ACCOUNT -- a normal Windows restriction
  on using a computer account for an interactive-style network logon, not
  a sign the password is wrong); computer5's blank password worked via
  both paths, but 4624 is what fired live.
known_false_positives: >-
  None -- computer4$/computer5$ never appear in any successful-auth event
  in 24h of range background traffic outside this session's live test,
  confirmed directly. computer2/computer3 (the range's other two
  placeholder computer objects, used by the RBCD Configuration and Shadow
  Credential Creation detections respectively) are deliberately not
  included here -- they aren't part of this specific weak-password
  finding per cyber-range's VULNERABLE_RANGE_PLAN.md.
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique:
    - 'impacket-getTGT cyberhawks.lab/computer4$:computer4 -dc-ip 10.0.2.2'
    - 'netexec smb 10.0.2.2 -u "computer5$" -p "" -d cyberhawks.lab'
  result: >-
    Both authenticated successfully with their known weak/default
    passwords. Fired exactly once, correctly merged into one alert
    listing both computers in `successes`.
embed:
  title: Computer Password Spray
  additional_fields:
    - host
    - successes
references:
  - 'detections/backlog.md, "Weak / missing authentication" (backlog row: "Pre-2000 / blank password")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
