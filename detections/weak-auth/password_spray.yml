name: Password Spray
id: weak-auth-password-spray
version: 3
date: '2026-09-30'
status: production
category: weak-auth
description: >-
  One source failing authentication against 5+ distinct non-machine
  accounts within a 5-minute window -- the low-and-slow, one-password-
  many-accounts pattern password spraying uses to avoid per-account
  lockout thresholds. Covers both the NTLM/SMB vector (4625) and the
  Kerberos pre-auth vector (4771), since spray tools use either
  (netexec/CrackMapExec default to SMB, kerbrute/Rubeus use Kerberos).
  Correlates in any subsequent successful authentication for the same
  source in the same window (4624, or 4768 with Result Code 0x0) to
  report which account(s) the spray actually got in on.
data_source:
  - >-
    Windows Events -- 4625 + 4771 (failures, threshold), 4624 + 4768
    (successes, correlation only)
search: |-
  index=windows (EventCode=4625 OR EventCode=4771 OR EventCode=4624 OR (EventCode=4768 AND Result_Code=0x0)) earliest=-30m latest=+5m
  | eval new_event=if(`in_detection_window(_indextime)`, 1, 0)
  | eval attacker_ip=replace(coalesce(Source_Network_Address, Client_Address), "^::ffff:", "")
  | eval target_user=mvindex(Account_Name, -1)
  | where isnotnull(target_user) AND NOT match(target_user, "\$$") AND target_user!="-" AND target_user!="ANONYMOUS LOGON"
  | eval failed_user=if(EventCode=4625 OR EventCode=4771, target_user, null()), success_user=if(EventCode=4625 OR EventCode=4771, null(), target_user)
  | sort 0 _time
  | streamstats time_window=5m dc(failed_user) as failed_users values(success_user) as successes values(ComputerName) as host max(new_event) as has_new by attacker_ip
  | where failed_users>=5 AND has_new=1
  | stats values(successes) as successes values(host) as host by attacker_ip
  | `normalize_host(host)`
  | `normalize_user(successes)`
  | table attacker_ip host successes
how_to_implement: >-
  Requires defense-tooling's Windows forwarder shipping Security log
  4624/4625/4768/4771 from the DCs (already forwarded). No infra fix
  needed. `mvindex(Account_Name, -1)` normalizes 4624/4625's multivalue
  Account_Name (`["-", "<real account>"]`) and 4768/4771's single-value
  field to the same target-username extraction. The `NOT match(...,"\$$")`
  and `target_user!="ANONYMOUS LOGON"` exclusions are required -- see
  known_false_positives.
known_false_positives: >-
  netexec's own pre-spray null-session/OS-fingerprint SMB connection
  generates a 4624 for ANONYMOUS LOGON on every run -- excluded explicitly,
  since it's tooling noise, not a spray "success". Machine accounts
  ($-suffixed) doing their routine mutual authentication are excluded the
  same way the Kerberoast detection excludes them, for the same reason.
  **Real, documented limitation, not fixed**: asmith (the range's
  dedicated "do not require Kerberos preauthentication" account, see the
  AS-REP Roast detection) will always show up in `successes` for a
  Kerberos-vector spray that happens to include it in its wordlist,
  regardless of whether the guessed password is actually correct -- a
  no-preauth account's AS-REQ always gets a valid-looking AS-REP back
  (Result Code 0x0) since the KDC never validates the encrypted timestamp
  in the first place. Confirmed live: kerbrute's spray reported dsmith as
  its only valid login, but the resulting 4768 traffic still shows
  Result_Code=0x0 for asmith too. Not worth excluding by hardcoding the
  account name (defeats the point of a general detection); flagged here
  instead, matching this repo's convention of documenting a known signal
  weakness rather than silently working around it. Zero legitimate
  failures of any kind (4625/4771) found in 24h of background traffic, so
  the failed_users>=5 threshold itself has a very wide safety margin.
throttle: [attacker_ip]
changes_2026_09_30: >-
  Sliding 5-minute window per source instead of fixed 5-minute buckets run
  every 5 minutes (a spray split across a boundary could stay under 5
  failed users in both halves). Runs every minute over the last 30
  minutes, alerting when a window with 5+ failed users includes a newly
  indexed event; successes are the accounts that logged on from that
  source within the window. Runs every minute and looks back 30 minutes,
  so an event arriving up to 30 minutes late is still evaluated; before
  this, each run searched the last minute of event time, and anything
  indexed after its run (Security up to ~50s late, Zeek conn p90 ~1 min)
  was never evaluated. Each result row is its own alert, throttled for 5m
  on the `throttle` fields.
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique:
    - >-
      netexec smb 10.0.2.2 -u <20-name wordlist> -p Summer2026
      --continue-on-success -d cyberhawks.lab (SMB/NTLM vector)
    - >-
      kerbrute passwordspray -d cyberhawks.lab --dc 10.0.2.2 <same
      wordlist> Summer2026 (Kerberos vector)
  result: >-
    Both fired exactly once (one alert per tool run, correctly merged by
    the 5-minute bucket). netexec's run correctly reported successes=
    dsmith after excluding the ANONYMOUS LOGON noise from its own
    null-session probe; kerbrute's run reported successes=[asmith, dsmith]
    -- dsmith a real hit, asmith the documented no-preauth false-positive
    above. dsmith/Summer2026 is a real weak-credential pool account in
    this range per cyber-range's VULNERABLE_RANGE_PLAN.md.
embed:
  title: Password Spray
  additional_fields:
    - host
    - successes
references:
  - 'detections/backlog.md, "Weak / missing authentication" (backlog row: "Password spray / guessable password")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
