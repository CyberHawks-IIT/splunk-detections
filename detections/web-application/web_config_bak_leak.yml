name: Web Credential Read (Web.config.bak)
id: web-application-web-config-bak-leak
version: 2
date: '2026-09-30'
status: production
category: web-application
description: >-
  A successful HTTP GET of a configuration-backup file (e.g.
  `Web.config.bak`) on the `web` portal host. The live `Web.config` is
  deployed alongside a byte-identical `Web.config.bak`, and IIS was given a
  static MIME mapping for `.bak` so the backup is served as plain text
  instead of 404ing -- so anyone who requests it gets the real `svc-web`
  SQL Server connection string (username and plaintext password) back over
  HTTP. Nothing legitimate ever requests a `.bak`/config-backup path, so any
  200 on one is the credential leak being exploited. The attacker IP is the
  requesting client (`c_ip`); `file` is the path served.
data_source:
  - >-
    IIS request logging on `web` from the Microsoft-IIS-Logging/Logs ETW
    channel (`index=iis`, host=WEB), fields `cs_uri_stem`, `sc_status`,
    `c_ip`
search: |-
  index=iis host=WEB sc_status=200 (cs_uri_stem="*.bak" OR cs_uri_stem="*.old" OR cs_uri_stem="*.backup" OR cs_uri_stem="*.save" OR cs_uri_stem="*.orig" OR cs_uri_stem="*.config" OR cs_uri_stem="*~") `detection_window`
  | stats values(cs_uri_stem) as file by c_ip
  | rename c_ip as attacker_ip
  | table attacker_ip file
how_to_implement: >-
  Requires IIS request logging forwarded from `web`. As of 2026-09-30 this
  comes from IIS's ETW output (the Microsoft-IIS-Logging/Logs event channel),
  not the W3C log files: HTTP.SYS buffers the files up to ~60s before writing
  them (confirmed live -- DisableLogBuffering and IIS 10's
  flushByEntryCountW3CLog do not change this), which added up to a minute of
  latency, whereas the ETW channel indexes each request in ~1s. cyber-range's
  detection_logging role sets `logTargetW3C = File,ETW` and enables the
  channel; defense-tooling's `splunk_forwarder_windows` role forwards it
  (renderXml, granting the forwarder's account read on the channel). The same
  `cs_uri_stem`/`sc_status`/`c_ip` fields are extracted from the ETW event as
  from the old file lines. The match is action-based: it keys on the object
  served (a config-backup path) and the 200 result, never on a user-agent or
  client tool. The extension set covers the common config-backup shapes an
  attacker probes (`.bak`, `.old`, `.backup`, `.save`, `.orig`, bare
  `.config`, editor `~` files); add more here if the range ever ships a
  differently-named backup. NOTE: because ETW carries the event's own
  timestamp, the HTTP.SYS boot-clock latch that used to future-date the W3C
  file lines no longer affects this detection.
known_false_positives: >-
  None expected -- no legitimate client requests a `.bak`/`.old`/config-backup
  path, and a normal page load (`/Default.aspx`, static assets) never matches
  the extension filter. If a future deployment legitimately serves a `.config`
  asset (unusual), scope the bare-`.config` clause out. Verified no benign
  hits over the baseline IIS traffic on `web`.
throttle: [attacker_ip]
changes_2026_09_30: >-
  Now fed by the Microsoft-IIS-Logging/Logs ETW channel instead of the
  buffered W3C log file, cutting up to ~60s of IIS delivery lag (see
  how_to_implement). Uses the shared `detection_window`. Each result row is
  its own alert, throttled for 5m on the `throttle` fields.
verification:
  date: '2026-09-29'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    curl http://10.0.2.5/Web.config.bak -- the range's real MIME-mapped
    backup file, which returns 200 with the plaintext `svc-web` connection
    string.
  result: >-
    Fired once with Source_Network_Address=192.168.1.11, file=/Web.config.bak.
    A normal 200 page load does not match (extension filter); a `.bak` request
    that 404s does not match (sc_status=200 required). Verified _time is the
    real request time after fixing the HTTP.SYS boot-clock latch on web (see
    how_to_implement).
embed:
  title: Web Credential Read (Web.config.bak)
  additional_fields:
    - file
references:
  - 'detections/backlog.md, "Web application" (backlog row: "Web.config.bak credential leak")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
