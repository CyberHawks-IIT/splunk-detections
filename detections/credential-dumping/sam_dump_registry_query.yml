name: 'SAM Dump: Registry Query'
id: sam-dump-registry-query
version: 1
date: '2026-09-27'
status: production
category: credential-dumping
description: >-
  A process other than lsass.exe directly enumerating/querying HKLM\SAM --
  the technique used when reading the hive via ordinary registry calls
  (RegQueryValueEx/RegEnumKeyEx) rather than RegSaveKeyEx's backup-privilege
  export path (see SAM/LSA Dump: Registry Export for that one). This is
  what SYSTEM-context local enumeration or netexec/secretsdump-style remote
  SAM enumeration actually does under the hood, and -- unlike the export
  technique -- correctly names HKLM\SAM as the object, so it can be split
  cleanly from the SECURITY/LSA equivalent.
data_source:
  - 'Windows Events -- 4663, Object Name under \REGISTRY\MACHINE\SAM\'
search: |-
  index=windows EventCode=4663 Object_Name="*MACHINE\SAM\*" NOT Process_Name="*lsass.exe"
  | bucket _time span=10s
  | stats count by _time ComputerName Account_Name
  | rename ComputerName as host, Account_Name as user
  | table host user
how_to_implement: >-
  Requires the registry SACL on HKLM\SAM (already set by cyber-range's
  detection_logging role) and the "Registry" audit subcategory (also
  already set). No additional fix was needed for this technique --
  unlike the export path, this one worked as originally designed.
known_false_positives: >-
  None found over 4h of normal range background traffic (this specific
  local-enumeration technique was only ever exercised as SYSTEM via a
  one-shot scheduled task for verification, so no other process legitimately
  touches this key on this range).
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: this control host, run as SYSTEM via a one-shot scheduled task (RegQueryValueEx/RegEnumKeyEx requires SYSTEM or backup privilege -- a plain elevated Administrator token gets Access Denied)
  technique: 'reg query HKLM\SAM\SAM\Domains\Account\Users /s, on workstation'
  result: >-
    Fired exactly once, correctly showing Object_Name paths under
    \REGISTRY\MACHINE\SAM\ specifically (distinct from the SECURITY-path
    events the same run also produced -- see "LSA Dump: Registry Query").
embed:
  title: 'SAM Dump: Registry Query'
  additional_fields:
    - host
    - user
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog row: "SAM hive dumping")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- original title "SAM Dump (Local)", renamed 2026-09-27 to distinguish this technique from the registry-export variant
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
