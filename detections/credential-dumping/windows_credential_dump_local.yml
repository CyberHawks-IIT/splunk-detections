name: Windows Credential Dump (Local)
id: windows-credential-dump-local
version: 3
date: '2026-09-28'
status: production
category: credential-dumping
description: >-
  A process other than lsass.exe accessing the local SAM and/or SECURITY
  registry hives on a host -- local credential-hive dumping, detected by the
  action taken on the hive keys rather than the tool used. The `method`
  field distinguishes `query` (direct RegQueryValueEx/RegEnumKeyEx
  enumeration -- 4663 reads of the hive keys) from `export`
  (RegSaveKeyEx/`reg save` -- a 4656 backup-privilege handle-open of the
  hive key with no per-value reads). The attacker IP is resolved by
  tracing the acting session's 4624 logon (Source Network Address),
  defaulting to the host's own IP when the session is local. `hives` reports
  SAM / LSA / "SAM and LSA" from the 4656/4663 object name. svchost.exe is
  excluded -- a remote-registry dump is the separate Windows Credential Dump
  (Remote) detection.
data_source:
  - 'Windows Events -- 4656 (handle-open naming \REGISTRY\MACHINE\SAM|SECURITY; requires Audit Handle Manipulation), 4663 (value reads on the hive keys), 4624 (logon session -> source IP)'
search: |-
  index=windows (EventCode=4656 OR EventCode=4663) (Object_Name="*MACHINE*SAM*" OR Object_Name="*MACHINE*SECURITY*") NOT Process_Name="*lsass.exe" NOT Process_Name="*svchost.exe"
  | eval hseg=mvindex(split(Object_Name,"\\"),3)
  | eval hive=case(hseg=="SECURITY","LSA", hseg=="SAM","SAM", true(),null())
  | where isnotnull(hive)
  | eval is_read=if(EventCode=4663,1,0)
  | eval is_open=if(EventCode=4656,1,0)
  | rex field=ComputerName "(?<host>[^.]+)"
  | bin _time span=1m
  | stats sum(is_read) as reads sum(is_open) as opens values(hive) as hive_list values(Account_Name) as user by _time host Logon_ID
  | where reads>0 OR opens>0
  | eval method=if(reads>0,"query","export")
  | eval hives=case(mvcount(hive_list)>1,"SAM and LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")
  | rename Logon_ID as session_id
  | join type=left session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | eval session_id=mvindex(Logon_ID,-1) | stats latest(Source_Network_Address) as logon_src by session_id ]
  | eval host_key=lower(host)
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip
  | eval Source_Network_Address=if(isnull(logon_src) OR logon_src IN ("-","127.0.0.1","::1","0.0.0.0",""), host_ip, logon_src)
  | rename Source_Network_Address as attacker_ip
  | table attacker_ip host user method hives
how_to_implement: >-
  Requires two audit subcategories (both in cyber-range's detection_logging
  role, configure_audit_policy.ps1) plus the SAM/SECURITY registry SACL:
  "Registry" (4663 value reads) and -- added 2026-09-28 -- "Handle
  Manipulation" (4656 handle-open with the Object Name populated). Handle
  Manipulation is what makes the `export` technique detectable tool-
  agnostically: RegSaveKeyEx's backup codepath bypasses the ordinary object-
  access SACL (no 4663), but with Handle Manipulation on it emits a 4656 that
  DOES name \REGISTRY\MACHINE\SAM / \SECURITY. Detection is action-based, not
  tool-based -- it keys on the object accessed (the hive keys), never on the
  acting process name. The lsass.exe exclusion is a baseline-noise filter
  (lsass reads the SAM hive constantly during normal authentication); the
  svchost.exe exclusion hands the remote-registry path to the Remote
  detection -- neither is an attacker-tool match. `method` is derived action-
  based: a 4663 value-read means `query`; a 4656 hive-open with no value-reads
  means `export`. IP trace uses the New Logon "Logon ID" (last value of the
  multivalue Logon_ID on 4624); known_range_hosts (dt_detection_content)
  resolves the host's own IP for the local-default case. NOTE (2026-09-29):
  this originally also corroborated `export` with a same-session 4674
  SeBackupPrivilege event, but 4674 was dropped from ingest entirely (its
  FullPrivilegeAuditing firehose was ~550 MB/day of benign desktop-app
  backup-privilege use on workstation, dwarfing the free-tier license). The
  4656 Handle-Manipulation hive-open is the load-bearing signal and names the
  hive on its own; see known_false_positives for why the bare open is safe
  here.
known_false_positives: >-
  None observed -- a non-lsass, non-svchost process reading or backup-opening
  the SAM/SECURITY hive keys does not occur in normal range operation. Over a
  48h baseline (2026-09-29) the ONLY non-lsass 4656/4663 on \MACHINE\SAM /
  \MACHINE\SECURITY was the export-technique verification itself; every other
  4656 was against unrelated keys (e.g. svchost on the EventLog-Security
  autologger key) that don't match the SAM/SECURITY object filter. That zero
  baseline is what makes the bare 4656 hive-open safe as the `export` signal
  now that the 4674 corroboration was removed for ingest reasons -- a Handle-
  Manipulation open of these specific hive keys by a non-OS process is itself
  the anomaly. Handle Manipulation is a noisy subcategory in general (it emits
  4656 for handle opens to every SACL'd object, notably the AD object SACLs on
  the DCs) -- extra Splunk ingest, not false positives, since this search is
  scoped to the SAM/SECURITY hive keys.
verification:
  date: '2026-09-28'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (192.168.1.11) over WinRM for the export case; local SYSTEM (one-shot scheduled task) for the query case
  technique: >-
    export: `reg save HKLM\SAM ...` / `reg save HKLM\SECURITY ...` run over a
    WinRM session from john-kali (RegSaveKeyEx). query: `reg query
    HKLM\SECURITY\Policy /s` as SYSTEM. reg is only a convenient driver -- the
    search matches neither its name nor its command line, only the 4656/4663
    telemetry any tool would produce.
  result: >-
    Reverified 2026-09-29 after dropping the 4674 corroboration. export ->
    method=export, user=Administrator, Source_Network_Address traced through
    the logon session to 192.168.1.11, hives="SAM and LSA" (both 4656 hive-
    opens). query -> method=query, user=WORKSTATION$, Source_Network_Address
    defaulted to the host's own IP (10.0.2.8), hives=LSA from the 4663
    objects. Each fired once; the remote secdump/regdump runs in the same
    windows did NOT surface here (svchost excluded), and neither local run
    surfaced in the Remote detection.
embed:
  title: Windows Credential Dump (Local)
  additional_fields:
    - host
    - user
    - method
    - hives
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog rows: "SAM hive dumping", "LSA hive dumping (incl. LSA secrets)")'
  - 'Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- consolidated by the user 2026-09-28 into two detections (Local/Remote); Local carries attacker IP + host + user + method + hives. The export technique (initially thought undetectable without a tool match) was made tool-agnostic by enabling Audit Handle Manipulation (4656 names the hive), restoring the method field.'
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
