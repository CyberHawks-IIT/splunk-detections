name: Windows Credential Dump (Local)
id: windows-credential-dump-local
version: 2
date: '2026-09-28'
status: production
category: credential-dumping
description: >-
  A process other than lsass.exe reading the local SAM and/or SECURITY
  registry hives on a host -- local credential-hive dumping via direct
  registry enumeration (RegQueryValueEx/RegEnumKeyEx on the hive keys),
  regardless of which tool performs it. The attacker IP is resolved by
  tracing the acting process's logon session back to the 4624 that created
  it (the source IP that connected), defaulting to the host's own IP when
  the session is local/interactive and no remote origin exists. The `hives`
  field reports which hive(s) were touched -- SAM / LSA / "SAM and LSA" --
  from the 4663 object name. NOTE: the `reg save`/RegSaveKeyEx "export"
  technique is deliberately NOT covered here -- see known_false_positives
  for why it has no tool-agnostic signal.
data_source:
  - 'Windows Events -- 4663 (object access on \REGISTRY\MACHINE\SAM\ or \SECURITY\), 4624 (logon session -> source IP)'
search: |-
  index=windows EventCode=4663 Object_Name="*MACHINE*" (Object_Name="*SAM*" OR Object_Name="*SECURITY*") NOT Process_Name="*lsass.exe"
  | eval hive=case(like(Object_Name,"%SECURITY%"),"LSA", like(Object_Name,"%SAM%"),"SAM", true(),null())
  | rex field=ComputerName "(?<host>[^.]+)"
  | bin _time span=1m
  | stats values(hive) as hive_list values(Account_Name) as user by _time host Logon_ID
  | eval hives=case(mvcount(hive_list)>1,"SAM and LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")
  | rename Logon_ID as session_id
  | join type=left session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | eval session_id=mvindex(Logon_ID,-1) | stats latest(Source_Network_Address) as logon_src by session_id ]
  | lookup known_range_hosts hostname AS host OUTPUT ip AS host_ip
  | eval Source_Network_Address=if(isnull(logon_src) OR logon_src IN ("-","127.0.0.1","::1","0.0.0.0",""), host_ip, logon_src)
  | table Source_Network_Address host user hives
how_to_implement: >-
  Requires the registry SACL on HKLM\SAM and HKLM\SECURITY plus the
  "Registry" audit subcategory (both set by cyber-range's detection_logging
  role -- confirmed live on workstation: Everyone/Success+Failure audit ACE,
  ContainerInherit+ObjectInherit). Detection is action-based, not
  tool-based: it keys on the object actually accessed (the SAM/SECURITY
  hive keys), so it fires regardless of which tool reads them. The
  logon-session -> source-IP trace joins on the New Logon "Logon ID"
  (extracted as the last value of the multivalue Logon_ID on 4624, avoiding
  a costly _raw rex); the -1h subsearch lookback bounds how far back the
  session's originating logon can be. `known_range_hosts`
  (dt_detection_content) resolves the host's own IP for the local-default
  case. The lsass.exe exclusion is a baseline-noise filter (lsass reads the
  SAM hive constantly as part of normal authentication) -- not an
  attacker-tool match; an attacker cannot evade by "being lsass".
known_false_positives: >-
  None observed -- a non-lsass process reading the SAM/SECURITY hive keys
  does not happen in normal range operation (over a 24h baseline the only
  non-lsass 4663 on these keys were verification runs). The object filter
  relies on only the SAM and SECURITY hives carrying an audit SACL, so no
  other MACHINE\...SAM/SECURITY key is audited.
  **Deliberate coverage limitation (2026-09-28), not a false-positive
  concern:** the `reg save`/RegSaveKeyEx "export" technique is NOT covered.
  It uses SeBackupPrivilege to save the hive and (a) never trips the
  registry SACL (backup-privilege codepath bypasses object-access
  auditing -- confirmed: zero 4663/4656 on the hive keys tied to an export
  session), and (b) its only telemetry, the 4674 privileged-object event,
  carries "Object Name: -" (no object) -- so the only way to isolate an
  export from ordinary backup-privilege use (splunkd, Edge, Teams, etc.,
  which generate thousands of 4674 SeBackup events) would be to match the
  acting tool's process name (reg.exe). Per the project rule against
  tool/process-specific detections (an attacker can `reg save` with any
  tool), that match was removed and the export branch dropped rather than
  ship a tool-specific or noise-flooded search. Remote hive export via the
  Remote Registry service IS still detected -- see Windows Credential Dump
  (Remote), method=secdump -- because there the fixed svchost service and
  the external-logon anchor provide a tool-agnostic signal.
verification:
  date: '2026-09-28'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: local SYSTEM (one-shot scheduled task) for the host-default case; john-kali (192.168.1.11) over WinRM for the remote-traced case
  technique: >-
    `reg query HKLM\SAM\SAM\Domains\Account\Users /s` and
    `reg query HKLM\SECURITY\Policy\Secrets /s` (any tool reading the hive
    keys trips the same 4663 signal; reg was used only as a convenient
    driver, it is not matched by the search).
  result: >-
    Fired once per execution. SYSTEM-run query -> user=WORKSTATION$,
    Source_Network_Address defaulted to the host's own IP (10.0.2.8), hives
    correctly SAM (SAM-only run) and "SAM and LSA" (SAM+SECURITY run,
    resolved from the 4663 object). A query run inside a session originated
    remotely traces Source_Network_Address through the logon session to the
    connecting IP (validated with the same join the export test used, which
    resolved 192.168.1.11). Zero rows across six disjoint pre-test windows
    of normal range operation.
embed:
  title: Windows Credential Dump (Local)
  additional_fields:
    - host
    - user
    - hives
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog rows: "SAM hive dumping", "LSA hive dumping (incl. LSA secrets)")'
  - 'Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- consolidated by the user 2026-09-28 into two detections (Local/Remote); Local carries attacker IP + host + user + hives (the export/query method split was dropped when the tool-specific reg.exe match was removed, since export has no tool-agnostic signal)'
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
