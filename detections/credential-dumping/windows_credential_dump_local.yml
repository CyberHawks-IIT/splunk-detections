name: Windows Credential Dump (Local)
id: windows-credential-dump-local
version: 3
date: '2026-09-28'
status: production
category: credential-dumping
description: >-
  A process other than lsass.exe accessing the local SAM and/or SECURITY
  registry hives on a host -- local credential-hive dumping, detected by the
  action taken on the hive keys rather than the tool used. The `method`
  field distinguishes `query` (direct RegQueryValueEx/RegEnumKeyEx
  enumeration -- 4663 reads of the hive keys) from `export`
  (RegSaveKeyEx/`reg save` -- a 4656 handle-open of the hive key using
  backup privilege, with no per-value reads, corroborated by a same-session
  4674 SeBackupPrivilege/SeRestorePrivilege). The attacker IP is resolved by
  tracing the acting session's 4624 logon (Source Network Address),
  defaulting to the host's own IP when the session is local. `hives` reports
  SAM / LSA / "SAM and LSA" from the 4656/4663 object name.
data_source:
  - 'Windows Events -- 4656 (handle-open naming \REGISTRY\MACHINE\SAM|SECURITY; requires Audit Handle Manipulation), 4663 (value reads on the hive keys), 4674 (SeBackupPrivilege/SeRestorePrivilege), 4624 (logon session -> source IP)'
search: |-
  index=windows (((EventCode=4656 OR EventCode=4663) (Object_Name="*MACHINE*SAM*" OR Object_Name="*MACHINE*SECURITY*") NOT Process_Name="*lsass.exe") OR (EventCode=4674 (Privileges="*SeBackupPrivilege*" OR Privileges="*SeRestorePrivilege*") NOT Process_Name="*lsass.exe"))
  | eval hive=case(like(Object_Name,"%SECURITY%"),"LSA", like(Object_Name,"%SAM%"),"SAM", true(),null())
  | eval is_read=if(EventCode=4663,1,0)
  | eval is_open=if(EventCode=4656,1,0)
  | eval is_bkp=if(EventCode=4674,1,0)
  | rex field=ComputerName "(?<host>[^.]+)"
  | bin _time span=1m
  | stats sum(is_read) as reads sum(is_open) as opens sum(is_bkp) as bkp values(hive) as hive_list values(Account_Name) as user by _time host Logon_ID
  | where reads>0 OR (opens>0 AND bkp>0)
  | eval method=if(reads>0,"query","export")
  | eval hives=case(mvcount(hive_list)>1,"SAM and LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")
  | rename Logon_ID as session_id
  | join type=left session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | eval session_id=mvindex(Logon_ID,-1) | stats latest(Source_Network_Address) as logon_src by session_id ]
  | lookup known_range_hosts hostname AS host OUTPUT ip AS host_ip
  | eval Source_Network_Address=if(isnull(logon_src) OR logon_src IN ("-","127.0.0.1","::1","0.0.0.0",""), host_ip, logon_src)
  | table Source_Network_Address host user method hives
how_to_implement: >-
  Requires three audit subcategories (all in cyber-range's detection_logging
  role, configure_audit_policy.ps1) plus the SAM/SECURITY registry SACL:
  "Registry" (4663 value reads), "Sensitive Privilege Use" +
  FullPrivilegeAuditing (4674 backup-privilege use), and -- added 2026-09-28
  -- "Handle Manipulation" (4656 handle-open with the Object Name
  populated). Handle Manipulation is what makes the `export` technique
  detectable tool-agnostically: RegSaveKeyEx's backup codepath bypasses the
  ordinary object-access SACL (no 4663) and its 4674 event carries no object
  name, but with Handle Manipulation on it emits a 4656 that DOES name
  \REGISTRY\MACHINE\SAM / \SECURITY. Detection is action-based, not
  tool-based -- it keys on the object accessed (the hive keys) and the
  privilege exercised, never on the acting process name. The lsass.exe
  exclusion is a baseline-noise filter (lsass reads the SAM hive constantly
  during normal authentication), not an attacker-tool match. `method` is
  derived action-based: a 4663 value-read means `query`; a 4656 hive-open
  with backup privilege and no value-reads means `export`. IP trace uses the
  New Logon "Logon ID" (last value of the multivalue Logon_ID on 4624);
  known_range_hosts (dt_detection_content) resolves the host's own IP for
  the local-default case.
known_false_positives: >-
  None observed -- a non-lsass process reading or backup-opening the
  SAM/SECURITY hive keys does not occur in normal range operation (over the
  baseline the only non-lsass access to these keys was verification
  activity). The `export` branch is deliberately corroborated (a hive
  handle-open AND same-session backup-privilege use, with no value-reads) so
  it does not fire on an incidental READ_CONTROL open of the hive alone.
  Handle Manipulation is a somewhat noisy subcategory in general (it emits
  4656 for handle opens to every SACL'd object, notably the AD object SACLs
  on the DCs) -- this is extra Splunk ingest, not false positives, since the
  search is scoped to the SAM/SECURITY hive keys. The object filter relies
  on only the SAM/SECURITY hives (and the other SACL'd objects, which don't
  match SAM/SECURITY) carrying audit SACLs.
verification:
  date: '2026-09-28'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (192.168.1.11) over WinRM for the export case; local SYSTEM (one-shot scheduled task) for the query case
  technique: >-
    export: `reg save HKLM\SAM ...` run under an Administrator WinRM session
    (RegSaveKeyEx). query: `reg query HKLM\SAM\... /s` as SYSTEM. reg is only
    a convenient driver -- the search matches neither its name nor its
    command line, only the 4656/4663/4674 telemetry any tool would produce.
  result: >-
    Fired once per execution with the correct method. export -> method=
    export, user=Administrator, Source_Network_Address traced through the
    logon session to 192.168.1.11, hives=SAM (from the 4656 object). query
    -> method=query, user=WORKSTATION$, Source_Network_Address defaulted to
    the host's own IP (10.0.2.8), hives resolved from the 4663 objects. Zero
    rows in a quiet post-enablement window; zero across earlier pre-test
    windows.
embed:
  title: Windows Credential Dump (Local)
  additional_fields:
    - host
    - user
    - method
    - hives
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog rows: "SAM hive dumping", "LSA hive dumping (incl. LSA secrets)")'
  - 'Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- consolidated by the user 2026-09-28 into two detections (Local/Remote); Local carries attacker IP + host + user + method + hives. The export technique (initially thought undetectable without a tool match) was made tool-agnostic by enabling Audit Handle Manipulation (4656 names the hive), restoring the method field.'
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
