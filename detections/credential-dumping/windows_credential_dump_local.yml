name: Windows Credential Dump (Local)
id: windows-credential-dump-local
version: 1
date: '2026-09-28'
status: production
category: credential-dumping
description: >-
  A process other than lsass.exe reading the local SAM and/or SECURITY
  registry hives on a host -- local credential-hive dumping. Covers both
  techniques with a `method` field: `export` (reg.exe exercising
  SeBackupPrivilege/SeRestorePrivilege to `reg save` a hive, the
  RegSaveKeyEx backup-privilege path) and `query` (direct
  RegQueryValueEx/RegEnumKeyEx enumeration of the hive keys). The attacker
  IP is resolved by tracing the acting process's logon session back to the
  4624 that created it (the source IP that connected), defaulting to the
  host's own IP when the session is local/interactive and no remote origin
  exists. When the technique names the hive in telemetry (`query`, via the
  4663 object) the `hives` field reports SAM / LSA / "SAM and LSA";
  `export` (4674 privilege-use, no object) reports "SAM or LSA".
data_source:
  - 'Windows Events -- 4674 (SeBackupPrivilege/SeRestorePrivilege via reg.exe), 4663 (object access on \REGISTRY\MACHINE\SAM\ or \SECURITY\), 4624 (logon session -> source IP)'
search: |-
  index=windows ((EventCode=4674 Process_Name="*reg.exe" (Privileges="*SeBackupPrivilege*" OR Privileges="*SeRestorePrivilege*")) OR (EventCode=4663 Object_Name="*MACHINE*" (Object_Name="*SAM*" OR Object_Name="*SECURITY*") NOT Process_Name="*lsass.exe"))
  | eval method=if(EventCode=4674,"export","query")
  | eval hive=case(like(Object_Name,"%SECURITY%"),"LSA", like(Object_Name,"%SAM%"),"SAM", true(),null())
  | rex field=ComputerName "(?<host>[^.]+)"
  | bin _time span=1m
  | stats values(hive) as hive_list values(Account_Name) as user by _time host method Logon_ID
  | eval hives=case(mvcount(hive_list)>1,"SAM and LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")
  | rename Logon_ID as session_id
  | join type=left session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | eval session_id=mvindex(Logon_ID,-1) | stats latest(Source_Network_Address) as logon_src by session_id ]
  | lookup known_range_hosts hostname AS host OUTPUT ip AS host_ip
  | eval Source_Network_Address=if(isnull(logon_src) OR logon_src IN ("-","127.0.0.1","::1","0.0.0.0",""), host_ip, logon_src)
  | table Source_Network_Address host user method hives
how_to_implement: >-
  Requires, for the `query` method, the registry SACL on HKLM\SAM and
  HKLM\SECURITY plus the "Registry" audit subcategory (both set by
  cyber-range's detection_logging role -- confirmed live on workstation:
  Everyone/Success+Failure audit ACE, ContainerInherit+ObjectInherit). For
  the `export` method, the Windows Security log's "Sensitive Privilege Use"
  subcategory AND the FullPrivilegeAuditing LSA registry value (a reboot to
  take effect), plus 4673/4674 in the forwarder's Security-channel
  whitelist (defense-tooling). The logon-session -> source-IP trace joins
  on the New Logon "Logon ID" (extracted as the last value of the
  multivalue Logon_ID on 4624, avoiding a costly _raw rex); the -1h
  subsearch lookback bounds how far back the session's originating logon can
  be. `known_range_hosts` (dt_detection_content) resolves the host's own IP
  for the local-default case.
known_false_positives: >-
  None observed. Two notes from live testing 2026-09-28: (1) The `export`
  event (4674) never names the source hive -- only an object-less privilege
  check -- so `hives` is "SAM or LSA" for export; only `query` (4663) names
  \REGISTRY\MACHINE\SAM\ vs \SECURITY\, so only query resolves SAM / LSA /
  "SAM and LSA". This is why the two techniques share one detection with a
  method field rather than being split by hive. (2) `reg save` run as
  SYSTEM (e.g. via a PsExec/atexec/smbexec SYSTEM context) does NOT generate
  a 4674 -- SYSTEM's privilege use is not audited -- so the `export` method
  only fires when reg.exe runs under a real user token (interactive,
  RunAs, or an admin network/WinRM session); a SYSTEM-context export is not
  detected by this signal. The `query` method fires regardless of context
  (SYSTEM-run reg query on workstation shows Account_Name=WORKSTATION$).
  The base signals (reg.exe using backup privilege; a non-lsass process
  reading the SAM/SECURITY keys) are inherently rare on this range; the
  object filter relies on only the SAM and SECURITY hives carrying an audit
  SACL (no other MACHINE\...SAM/SECURITY key is audited).
verification:
  date: '2026-09-28'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11) for the remote-shell export; local SYSTEM (one-shot scheduled task) for the query technique
  technique: >-
    query: `reg query HKLM\SAM\SAM\Domains\Account\Users /s` and
    `reg query HKLM\SECURITY\Policy\Secrets /s` as SYSTEM on workstation.
    export: `netexec winrm 10.0.2.8 -u Administrator ... -x 'reg save
    HKLM\SAM C:\Windows\Temp\wsam.hive /y'` (reg.exe under the WinRM
    network logon) and `netexec smb ... -x 'reg save ...'` (atexec/SYSTEM).
  result: >-
    Fired once per execution. query-as-SYSTEM -> method=query, user=
    WORKSTATION$, Source_Network_Address defaulted to the host's own IP
    (10.0.2.8), hives correctly SAM (SAM-only run) and "SAM and LSA"
    (SAM+SECURITY run, resolved from the 4663 object). export-over-WinRM ->
    method=export, user=Administrator, Source_Network_Address correctly
    traced through the logon session to 192.168.1.11, hives="SAM or LSA".
    Zero rows across six disjoint pre-test windows spanning normal range
    operation (the external-logon trace and the rare base signals suppress
    the noisy raw 4674 backup-privilege traffic entirely).
embed:
  title: Windows Credential Dump (Local)
  additional_fields:
    - host
    - user
    - method
    - hives
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog rows: "SAM hive dumping", "LSA hive dumping (incl. LSA secrets)")'
  - 'Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- consolidated by the user 2026-09-28 into two detections (Local/Remote), each carrying attacker IP + host + user + method (+ hives where determinable), superseding the earlier three-way "SAM/LSA Dump: Registry Export" / "SAM Dump: Registry Query" / "LSA Dump: Registry Query" split'
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
