name: SAM Dump (Remote)
id: credential-dumping-sam-dump-remote
version: 1
date: '2026-09-27'
status: production
category: credential-dumping
description: >-
  A per-account SAMR detail query (`SamrOpenUser` + `SamrQueryInformationUser2`)
  against a domain controller -- the RPC-level signature of a full remote
  SAM account dump (e.g. `secretsdump.py`'s SAMR-based user enumeration
  path, or any tool that iterates every RID pulling full account info).
  Distinct from the already-shipped SMB Anonymous Object Enumeration
  detection, which keys on the coarser `SamrEnumerateUsersInDomain`/
  `Groups`/`Aliases` listing calls only -- this one specifically needs the
  per-account follow-up query that constitutes an actual "dump" rather than
  a bare name listing. A genuine remote *hive* dump (`netexec --sam`,
  `secretsdump -sam`) instead goes through Remote Registry/MS-RRP, which is
  covered by the local SAM registry SACL (SAM Dump: Registry Query) --
  this detection's own surface is the SAMR interface itself, which can go
  dark under SMB encryption.
data_source:
  - Zeek — dce_rpc.log, SAMR interface, `SamrOpenUser`/`SamrQueryInformationUser2`
search: |-
  index=zeek sourcetype=zeek:dce_rpc endpoint=samr (operation=SamrOpenUser OR operation=SamrQueryInformationUser2)
  | bucket _time span=1m
  | stats count by _time id_orig_h id_resp_h
  | rename id_orig_h as Source_Network_Address, id_resp_h as host
  | table Source_Network_Address host
how_to_implement: >-
  No infra fix needed -- dce_rpc.log was already forwarded and used by
  other detections in this backlog. **Real finding from live testing, not
  assumed:** confirmed that impacket's SMB/RPC client (secretsdump.py,
  samrdump.py, lookupsid.py) negotiates RPC-level packet privacy
  (encryption of the DCE-RPC PDU itself, independent of SMB-layer
  encryption) whenever it authenticates with real credentials -- this makes
  the RPC content completely opaque to Zeek's dce_rpc analyzer, confirmed
  by testing the identical technique with valid creds via impacket (zero
  dce_rpc.log entries) vs Samba's `rpcclient` (fully decoded). Anonymous/
  null-session impacket calls stay visible because there's no security
  context to seal for. **This means any detection depending on
  dce_rpc.log content for an AUTHENTICATED session needs a client that
  doesn't negotiate RPC sealing (rpcclient/smbclient) to be visible at
  all** -- a real, durable limitation of this detection surface for
  impacket-based (and likely most modern) tooling, not specific to this
  test.
known_false_positives: >-
  None observed in a 24h lookback (the only matches found were this
  session's own earlier testing). **Documented gap:** dce_rpc.log carries
  no username field, so `user` (requested by the planner) isn't obtainable
  from this data source alone -- `Source_Network_Address`/`host` are the
  available attribution, matching the pattern already established for
  other Zeek-only detections in this project.
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    rpcclient -U 'cyberhawks.lab/dsmith%Summer2026' 10.0.2.2 -c
    'enumdomusers' (authenticated SAMR enumeration; the RPC-sealing finding
    above was discovered while trying the equivalent impacket tools first
    and getting zero dce_rpc.log entries despite the RPC calls succeeding)
  result: >-
    Fired exactly once, correctly attributing 192.168.1.11 and host=dc1.
    Also independently confirmed via an anonymous impacket-samrdump.py run
    (visible, since anonymous RPC has no sealing context) dumping the
    range's full 1000+ account pool.
embed:
  title: SAM Dump (Remote)
  additional_fields:
    - host
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog row: "SAM — remote via SAMR")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
