name: Windows Credential Dump (Remote)
id: windows-credential-dump-remote
version: 4
date: '2026-09-30'
status: production
category: credential-dumping
description: >-
  A remote credential-hive dump against a host via the Remote Registry
  service (MS-RRP / winreg) -- the svchost.exe hosting RemoteRegistry
  exercising SeBackupPrivilege/SeRestorePrivilege on behalf of an
  authenticated remote (network-logon) principal, the signature of
  secretsdump.py / `netexec --sam`/`--lsa` and similar tools. The `method`
  field distinguishes `secdump` (the registry-export RPC, BaseRegSaveKey --
  svchost backup-opens the hive key, a 4656 Handle-Manipulation event naming
  \MACHINE\SAM|SECURITY) from `regdump` (the registry-query RPC path -- backup
  privilege enabled via 4673 with no hive-export open). Attacker IP and the
  authenticating account come from the matching 4624 Type-3 network logon;
  that join is also the detection's primary noise filter. `hives` is resolved
  from the secdump hive-open (SAM / LSA / "SAM, LSA"); a regdump names no
  hive, so it reports "SAM or LSA".
data_source:
  - 'Windows Events -- 4656 (svchost backup-open of \MACHINE\SAM|SECURITY; requires Audit Handle Manipulation -- secdump), 4673 (svchost SeBackupPrivilege enabled -- regdump/secdump), 4624 Type 3 (network logon -> source IP + user)'
search: |-
  index=windows ((EventCode=4673 (Privileges="*SeBackupPrivilege*" OR Privileges="*SeRestorePrivilege*")) OR (EventCode=4656 (Object_Name="*MACHINE*SAM*" OR Object_Name="*MACHINE*SECURITY*"))) Process_Name="*svchost.exe" NOT Account_Name IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE","-") `detection_window`
  | eval hseg=mvindex(split(Object_Name,"\\"),3)
  | eval hive=case(EventCode!=4656,null(), hseg=="SECURITY","LSA", hseg=="SAM","SAM", true(),null())
  | where EventCode=4673 OR isnotnull(hive)
  | rex field=ComputerName "(?<host>[^.]+)"
  | stats values(hive) as hive_list values(Account_Name) as user by host Logon_ID
  | eval method=if(isnotnull(hive_list),"secdump","regdump")
  | eval host_key=lower(host), session_id=lower(Logon_ID)
  | `logon_source`
  | where isnotnull(logon_src)
  | stats values(user) as user values(hive_list) as hive_list by attacker_ip host method
  | eval hives=case(method=="regdump","SAM or LSA", mvcount(hive_list)>1,"SAM, LSA", hive_list=="SAM","SAM", hive_list=="LSA","LSA", true(),"SAM or LSA")
  | `normalize_host(host)`
  | `normalize_user(user)`
  | table attacker_ip host user method hives
how_to_implement: >-
  Requires "Sensitive Privilege Use" auditing (4673) + "Handle Manipulation"
  (4656) and 4673/4656 in the forwarder's Security-channel whitelist. No
  Zeek/dce_rpc dependency: this replaces the
  earlier Zeek SAMR/LSARPC "SAM Dump (Remote)"/"LSA Dump (Remote)"
  detections, which actually detected authenticated *account enumeration*
  (a different technique -- anonymous enumeration remains covered by SMB
  Anonymous Object Enumeration) and could not see impacket's RPC-sealed
  traffic anyway. The svchost SeBackup/SeRestore signal is high-volume on
  its own (local backup/service activity runs as SYSTEM/LOCAL SERVICE and
  as local "Administrator"); the inner join to a 4624 Type-3 logon with a
  real external Source_Network_Address is what isolates a genuine remote
  registry dump, since RemoteRegistry impersonates the connecting network
  principal. The New Logon "Logon ID" is taken as the last value of the
  multivalue Logon_ID on 4624 (no _raw rex). 2026-09-29: reworked off 4674
  (dropped from ingest -- its FullPrivilegeAuditing firehose was ~550 MB/day
  of benign desktop-app backup use). secdump now keys on svchost's 4656
  backup-open of the hive key (BaseRegSaveKey, surfaced by Handle
  Manipulation), which also names the hive -- so `hives` is now recoverable
  for secdump rather than always "SAM or LSA". regdump still keys on the
  bare 4673 SeBackupPrivilege enable with no hive-open.
known_false_positives: >-
  None observed across pre-test windows of normal range operation, despite
  the raw base signal being noisy (svchost SeBackup activity from local/
  service context) -- every one is excluded because its logon session is not
  an external network logon. Residual theoretical FP: a legitimate remote
  (network/RDP) admin session that itself triggers RemoteRegistry backup-
  privilege use; RemoteRegistry is disabled by default in this range (tools
  must enable it), so this is not expected. hives: a secdump surfaces the
  hive from svchost's 4656 backup-open; a regdump (query path) opens no hive
  and reports "SAM or LSA". Note: a single secdump invocation saves multiple
  hives (e.g. --lsa saves SECURITY + SYSTEM) and netexec reconnects per hive,
  producing multiple network-logon sessions; the final `stats by
  Source_Network_Address host method` collapses these to one alert per
  attacker/host/method within a scheduled run, so one dump = one alert.

  2026-09-30: the 4624 session join matched on Logon ID alone. Logon IDs
  are per host (LUIDs), so a session on another machine with the same ID
  could supply the attacker IP. The join is now on host + Logon ID, like
  every other session-trace detection.
throttle: [attacker_ip, host, method]
changes_2026_09_30: >-
  Per logon session, then per attacker (the minute bucket is gone). Runs
  every minute over the events indexed in the previous minute
  (`detection_window`), so an event is evaluated however late it arrives;
  before this, each run searched the last minute of event time, and
  anything indexed after its run (Security up to ~50s late, Zeek conn p90
  ~1 min) was never evaluated. Each result row is its own alert, throttled
  for 5m on the `throttle` fields.
verification:
  date: '2026-09-29'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    netexec smb 10.0.2.8 -u Administrator --local-auth --sam {regdump|secdump}
    and --lsa secdump against workstation; impacket-reg confirmed the direct-
    query path is access-denied on the protected keys, i.e. netexec's regdump
    is the working registry-query technique.
  result: >-
    Reverified 2026-09-29 on the 4674-free rework. Each invocation fired
    once attributing Source_Network_Address=192.168.1.11, host=workstation,
    user=Administrator: --lsa secdump -> method=secdump, hives=LSA; --sam
    secdump -> secdump/SAM; --sam regdump -> regdump/"SAM or LSA". regdump
    sessions exercised SeBackup via 4673 only (no hive-open); secdump
    sessions produced a svchost 4656 backup-open naming the hive, which both
    drives the method split and now recovers `hives`. All ran under the
    impersonated Administrator network-logon session (Logon_ID matched the
    4624 Type-3 from 192.168.1.11); the local reg-based dumps in the same
    windows did not surface here (their sessions run reg.exe, not svchost).
embed:
  title: Windows Credential Dump (Remote)
  additional_fields:
    - host
    - user
    - method
    - hives
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog rows: "SAM -- remote via SAMR", "LSA -- remote via LSARPC")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- consolidated by the user 2026-09-28 into two detections (Local/Remote); this reframes "remote" as the remote-registry hive dump (regdump/secdump) rather than SAMR/LSARPC enumeration
disabled: false
