name: Windows Credential Dump (Remote)
id: windows-credential-dump-remote
version: 1
date: '2026-09-28'
status: production
category: credential-dumping
description: >-
  A remote credential-hive dump against a host via the Remote Registry
  service (MS-RRP / winreg) -- the svchost.exe hosting RemoteRegistry
  exercising SeBackupPrivilege/SeRestorePrivilege on behalf of an
  authenticated remote (network-logon) principal, the signature of
  secretsdump.py / `netexec --sam`/`--lsa` and similar tools. The `method`
  field distinguishes `secdump` (the registry-export RPC, BaseRegSaveKey --
  produces a 4674 privileged-object operation as the hive is saved) from
  `regdump` (the registry-query RPC path -- backup privilege enabled via
  4673 but no 4674 save). Attacker IP and the authenticating account come
  from the matching 4624 Type-3 network logon; that join is also the
  detection's primary noise filter. Remote-registry telemetry never names
  the source hive, so `hives` is always "SAM or LSA".
data_source:
  - 'Windows Events -- 4674 (svchost SeBackupPrivilege/SeRestorePrivilege, secdump), 4673 (same privileges enabled, regdump), 4624 Type 3 (network logon -> source IP + user)'
search: |-
  index=windows (EventCode=4673 OR EventCode=4674) Process_Name="*svchost.exe" (Privileges="*SeBackupPrivilege*" OR Privileges="*SeRestorePrivilege*") NOT Account_Name IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE","-")
  | eval is_save=if(EventCode=4674,1,0)
  | rex field=ComputerName "(?<host>[^.]+)"
  | bin _time span=1m
  | stats max(is_save) as is_save values(Account_Name) as user by _time host Logon_ID
  | eval method=if(is_save=1,"secdump","regdump")
  | rename Logon_ID as session_id
  | join type=inner session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | eval session_id=mvindex(Logon_ID,-1) | stats latest(Source_Network_Address) as Source_Network_Address by session_id ]
  | eval hives="SAM or LSA"
  | stats values(user) as user by Source_Network_Address host method hives
  | table Source_Network_Address host user method hives
how_to_implement: >-
  Requires "Sensitive Privilege Use" auditing + FullPrivilegeAuditing (see
  Windows Credential Dump (Local)) and 4673/4674 in the forwarder's
  Security-channel whitelist. No Zeek/dce_rpc dependency: this replaces the
  earlier Zeek SAMR/LSARPC "SAM Dump (Remote)"/"LSA Dump (Remote)"
  detections, which actually detected authenticated *account enumeration*
  (a different technique -- anonymous enumeration remains covered by SMB
  Anonymous Object Enumeration) and could not see impacket's RPC-sealed
  traffic anyway. The svchost SeBackup/SeRestore signal is high-volume on
  its own (local backup/service activity runs as SYSTEM/LOCAL SERVICE and
  as local "Administrator"); the inner join to a 4624 Type-3 logon with a
  real external Source_Network_Address is what isolates a genuine remote
  registry dump, since RemoteRegistry impersonates the connecting network
  principal. The New Logon "Logon ID" is taken as the last value of the
  multivalue Logon_ID on 4624 (no _raw rex).
known_false_positives: >-
  None observed across six disjoint pre-test windows of normal range
  operation, despite the raw base signal being noisy (e.g. WEB emitted
  ~840 svchost 4674 SeBackup events as "Administrator" in ~100 min from
  local/service-context activity) -- every one was excluded because its
  logon session was not an external network logon. Residual theoretical
  FP: a legitimate remote (network/RDP) admin session that itself triggers
  RemoteRegistry backup-privilege use; RemoteRegistry is disabled by
  default in this range (tools must enable it), so this is not expected.
  Remote-registry access produces no hive-naming object-access event
  (confirmed: zero 4663 tied to the attacker's network Logon_IDs for
  either method), so SAM vs LSA cannot be distinguished remotely -- hives
  is always "SAM or LSA". Note: a single secdump invocation saves multiple
  hives (e.g. --lsa saves SECURITY + SYSTEM) and netexec reconnects per
  hive, producing multiple network-logon sessions; the final `stats by
  Source_Network_Address host method` collapses these to one alert per
  attacker/host/method within a scheduled run, so one dump = one alert.
verification:
  date: '2026-09-28'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    netexec smb 10.0.2.8 -u Administrator --local-auth --sam {regdump|secdump}
    and --lsa {regdump|secdump} (all four combinations run) against
    workstation; impacket-reg confirmed the direct-query path is
    access-denied on the protected keys, i.e. netexec's regdump is the
    working registry-query technique.
  result: >-
    Fired once per invocation: two regdump rows and two secdump rows, each
    attributing Source_Network_Address=192.168.1.11, host=workstation,
    user=Administrator, hives="SAM or LSA". regdump sessions exercised
    SeBackup/SeRestore via 4673 only; secdump sessions additionally
    produced svchost 4674 (BaseRegSaveKey), correctly driving the method
    split. Both methods' svchost operations ran under the impersonated
    Administrator network-logon session (Logon_ID matched the 4624 Type-3
    from 192.168.1.11).
embed:
  title: Windows Credential Dump (Remote)
  additional_fields:
    - host
    - user
    - method
    - hives
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog rows: "SAM -- remote via SAMR", "LSA -- remote via LSARPC")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- consolidated by the user 2026-09-28 into two detections (Local/Remote); this reframes "remote" as the remote-registry hive dump (regdump/secdump) rather than SAMR/LSARPC enumeration
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
