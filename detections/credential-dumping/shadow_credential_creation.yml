name: Shadow Credential Creation
id: credential-dumping-shadow-credential-creation
version: 2
date: '2026-09-29'
status: production
category: credential-dumping
description: >-
  A computer or user object's `msDS-KeyCredentialLink` attribute written --
  Shadow Credentials, which attaches an attacker-controlled certificate as
  an alternate credential, enabling PKINIT-based authentication as that
  account without knowing or changing its password. Not tied to legitimate
  key-credential maintenance in this range, so any write is signal.
data_source:
  - >-
    Windows Events -- 5136 (directory service object modified,
    `msDS-KeyCredentialLink`)
search: |-
  index=windows EventCode=5136 "msDS-KeyCredentialLink"
  | rex field=_raw "Subject:\r?\n\tSecurity ID:\t*\S+\r?\n\tAccount Name:\t*(?<user>\S+)"
  | rex field=ComputerName "(?<host>[^.]+)"
  | rex field=ComputerName "(?<host_key>[^.]+)"
  | rex field=_raw "Logon ID:\s+(?<session_id>0x[0-9A-Fa-f]+)"
  | eval host_key=lower(host_key), session_id=lower(session_id)
  | join type=left host_key session_id [ search index=windows EventCode=4624 earliest=-1h Source_Network_Address=* NOT Source_Network_Address IN ("-","127.0.0.1","::1") | rex field=ComputerName "(?<host_key>[^.]+)" | eval host_key=lower(host_key), session_id=lower(mvindex(Logon_ID,-1)) | stats latest(Source_Network_Address) as logon_src by host_key session_id ]
  | lookup known_range_hosts hostname AS host_key OUTPUT ip AS host_ip
  | eval Source_Network_Address=coalesce(logon_src, host_ip)
  | bucket _time span=1m
  | stats values(Source_Network_Address) as Source_Network_Address by _time host user DN
  | rename DN as target
  | table Source_Network_Address host user target
how_to_implement: >-
  Required a real infra fix, matching RBCD Configuration above: no object
  SACL existed on computer3 (the range's own designed Shadow-Credentials
  target -- "user" already holds a WriteProperty grant on this exact
  attribute per cyber-range's VULNERABLE_RANGE_PLAN.md), so 5136 never
  fired despite domain-wide "Directory Service Changes" auditing being on.
  Added an object-scoped ActiveDirectoryAuditRule for WriteProperty on the
  `msDS-KeyCredentialLink` attribute directly on computer3, applied live to
  dc1 and added to cyber-range's `configure_sacls_dc.ps1`.
known_false_positives: >-
  None expected -- no legitimate key-credential provisioning happens in
  this range post-setup.
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: added the logon-session IP trace. Live re-fire (certipy shadow
    add computer3 as user from 192.168.1.11) returns Attacker IP 192.168.1.11.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    certipy-ad shadow add -u user@cyberhawks.lab -p password -account
    computer3 -dc-ip 10.0.2.2
  result: >-
    Fired exactly once, correctly reporting host=DC1, user=user,
    target=CN=computer3,CN=Computers,DC=cyberhawks,DC=lab. Key credential
    removed afterward (certipy-ad shadow remove) to restore the original
    state.
embed:
  title: Shadow Credential Creation
  additional_fields:
    - host
    - target
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog row: "Shadow Credentials (KeyCredentialLink abuse)")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
