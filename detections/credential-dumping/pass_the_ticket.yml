name: Pass-the-Ticket
id: credential-dumping-pass-the-ticket
version: 4
date: '2026-09-30'
status: production
category: credential-dumping
description: >-
  A Kerberos service ticket (TGS-REQ) requested from an IP that did not
  itself perform the initial authentication (AS-REQ) for that same client
  principal, WHEN that AS-REQ was positively observed from a different host
  -- the signature of a stolen/copied TGT (or TGS) being reused from a
  second host rather than the one that originally obtained it. Firing
  requires seeing the original AS-REQ from another IP; a TGS-REQ for a
  principal whose AS-REQ was never observed is not treated as reuse (it is
  almost always an un-captured or pre-lookback TGT, not an attack).
data_source:
  - >-
    Zeek `kerberos.log` -- TGS-REQ events whose source IP is absent from the
    set of IPs that have issued an AS-REQ for the same client principal
    within a 1-day lookback
search: |-
  index=zeek sourcetype=zeek:kerberos request_type=TGS service!="krbtgt/*" `detection_window`
  | eval ckey=lower(replace(client,"[/@].*",""))
  | join type=left ckey [
      search index=zeek sourcetype=zeek:kerberos request_type=AS earliest=-1d latest=+5m
      | eval ckey=lower(replace(client,"[/@].*",""))
      | stats values(id_orig_h) as as_ips by ckey
    ]
  | eval already_known=if(isnull(as_ips), 0, if(mvfind(as_ips, id_orig_h)>=0, 1, 0))
  | where isnotnull(as_ips) AND already_known=0
  | eval origin=mvindex(as_ips, 0)
  | lookup known_range_hosts ip AS origin OUTPUT hostname AS origin_name | eval origin=coalesce(origin_name, origin)
  | rename id_orig_h as destination
  | stats values(origin) as origin values(service) as service by client destination
  | `normalize_host(origin)`
  | table client origin destination service
how_to_implement: >-
  No infra fix needed -- Zeek's `kerberos.log` (`request_type`/`client`/
  `service`/`id_orig_h`) is forwarded and extracted. Same-vnet Kerberos now
  decodes on every path since the sensor's `ignore_checksums` fix
  (2026-09-30); before that only router-crossing traffic produced
  `kerberos.log`, which is why the original test had to be run twice from
  john-kali (a real second IP on its interface) rather than from a same-vnet
  host. **Client-principal normalization is essential:** Zeek logs the realm
  inconsistently between AS and TGS for the same principal (observed live:
  AS `bsmith/CYBERHAWKS`, TGS `bsmith/CYBERHAWKS.LAB` from the same host), so
  the AS/TGS correlation joins on `ckey` -- the principal name with the realm
  stripped and lower-cased -- not the raw `client`. Joining on the raw string
  produced a false positive on every legitimate host (a TGS whose own host's
  AS-REQ was logged under the other realm spelling looked like reuse), most
  visibly on `web` (10.0.2.5, the busiest Kerberos host). The `client` column
  still displays the full principal; only the join key is normalized.
known_false_positives: >-
  With the realm-normalized join key and the positive-AS-evidence requirement
  (`isnotnull(as_ips)`), a legitimate host's own TGS-REQs are correctly paired
  to its own AS-REQ and suppressed. **Constrained delegation is no longer a
  false positive:** S4U2Self/S4U2Proxy produces a TGS-REQ for an impersonated
  user's principal from the delegating service's IP, but that user never did
  an AS-REQ, so `as_ips` is null and the positive-evidence guard suppresses it
  (this range's S4U path is covered by the dedicated Delegation detections).
  Residual: if an attacker steals a TGT and the victim's original AS-REQ was
  never captured (older than the 1-day lookback, or missed), this will not
  fire -- an intentional trade to eliminate the blank-origin false positives;
  reuse is only asserted when the initial authentication was actually seen
  from another host.
throttle: [destination, client]
changes_2026_09_30: >-
  One row per reusing host and ticket owner (the minute bucket is gone).
  Runs over the events indexed in the recent window (`detection_window`), so
  an event is evaluated however late it arrives. Each result row is its own
  alert, throttled for 5m on the `throttle` fields. **False-positive fix
  (later 2026-09-30):** after the sensor `ignore_checksums` fix restored
  same-vnet `kerberos.log`, this fired constantly with a blank origin on
  legitimate hosts (notably web/10.0.2.5). Two causes fixed: (1) the AS/TGS
  join now uses a realm-normalized principal key (Zeek logs `CYBERHAWKS` vs
  `CYBERHAWKS.LAB` inconsistently, breaking the raw-string join), and (2) it
  now requires positive AS evidence (`isnotnull(as_ips)`) so it never claims
  reuse for a principal whose initial authentication was never observed --
  which also removes the S4U constrained-delegation false-positive caveat.
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11 and a second self-assigned IP, 192.168.1.199)
  technique: >-
    impacket-getTGT for dsmith, then impacket-getST -spn cifs/sql1.cyberhawks.lab
    -k -no-pass using the same cached TGT twice -- once from 192.168.1.11
    (the original AS-REQ's source), once from 192.168.1.199 (no AS-REQ ever
    seen from this IP for dsmith)
  result: >-
    Fired exactly once, correctly identifying origin=192.168.1.11,
    destination=192.168.1.199, client=dsmith/CYBERHAWKS.LAB,
    service=cifs/sql1.cyberhawks.lab. Cleanup: removed the temporary
    secondary IP/route from john-kali afterward.
embed:
  title: Pass-the-Ticket
  # No attacker_ip column (ticket-reuse semantics): the attacker is the host
  # reusing the ticket, so the Discord description resolves `destination`.
  attacker_field: destination
  additional_fields:
    - origin
    - destination
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog row: "Pass-the-ticket / ticket reuse")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
