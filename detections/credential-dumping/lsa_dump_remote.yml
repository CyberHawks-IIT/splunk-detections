name: LSA Dump (Remote)
id: credential-dumping-lsa-dump-remote
version: 1
date: '2026-09-27'
status: production
category: credential-dumping
description: >-
  A bulk `LsarLookupSids` call against a domain controller -- resolving
  SIDs to account names in bulk over LSARPC, the signature of tools like
  `lookupsid.py`/`impacket-lookupsid` brute-forcing the domain's RID space,
  or any LSA secrets/policy enumeration workflow that resolves discovered
  SIDs. Confirmed via this session's own SMB Anonymous Object Enumeration
  testing that `LsarLookupSids` returns `STATUS_ACCESS_DENIED` anonymously
  in this range, so this operation can only ever be performed by an
  authenticated principal -- no overlap with that detection's anonymous-only
  scope. A genuine remote LSA *secrets* dump goes through Remote Registry/
  MS-RRP instead, covered by the local SECURITY registry SACL (LSA Dump:
  Registry Query).
data_source:
  - Zeek — dce_rpc.log, LSARPC interface, `LsarLookupSids`
search: |-
  index=zeek sourcetype=zeek:dce_rpc endpoint=lsarpc operation=LsarLookupSids
  | bucket _time span=1m
  | stats count by _time id_orig_h id_resp_h
  | rename id_orig_h as Source_Network_Address, id_resp_h as host
  | table Source_Network_Address host
how_to_implement: >-
  No infra fix needed -- same dce_rpc.log source already forwarded. Same
  RPC-sealing finding as SAM Dump (Remote) applies here: impacket's
  lookupsid.py negotiates RPC packet privacy with real credentials, making
  its LsarLookupSids calls invisible to Zeek -- used `rpcclient`'s
  `lookupsids` command instead, which decodes cleanly.
known_false_positives: >-
  None observed in a 24h lookback. **Documented gap, same as SAM Dump
  (Remote):** dce_rpc.log has no username field, so `user` isn't
  obtainable -- `Source_Network_Address`/`host` are the available fields.
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611, 192.168.1.11)
  technique: >-
    rpcclient -U 'cyberhawks.lab/dsmith%Summer2026' 10.0.2.2 -c 'lookupsids
    S-1-5-21-...-500 S-1-5-21-...-502'
  result: >-
    Fired exactly once, correctly attributing 192.168.1.11 and host=dc1.
    Same technique via impacket-lookupsid.py (real credentials) confirmed
    invisible to Zeek, consistent with the RPC-sealing finding.
embed:
  title: LSA Dump (Remote)
  additional_fields:
    - host
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog row: "LSA — remote via LSARPC")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
