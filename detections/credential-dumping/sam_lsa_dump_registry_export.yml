name: 'SAM/LSA Dump: Registry Export'
id: sam-lsa-dump-registry-export
version: 1
date: '2026-09-27'
status: production
category: credential-dumping
description: >-
  A process other than lsass.exe exercising SeBackupPrivilege or
  SeRestorePrivilege while it has an open handle via reg.exe -- the classic
  `reg save HKLM\SAM`/`HKLM\SECURITY`/`HKLM\SYSTEM` local credential-hive
  export technique (secretsdump.py's local mode, samdump2, manual
  reg.exe use, etc.).
data_source:
  - 'Windows Events -- 4674, Privileges = SeBackupPrivilege or SeRestorePrivilege'
search: |-
  index=windows EventCode=4674 Process_Name="*reg.exe" (Privileges="SeBackupPrivilege" OR Privileges="SeRestorePrivilege")
  | bucket _time span=10s
  | stats count by _time ComputerName Account_Name
  | rename ComputerName as host, Account_Name as user
  | table host user
how_to_implement: >-
  Requires the Windows Security log's "Sensitive Privilege Use" audit
  subcategory AND the FullPrivilegeAuditing LSA registry value (both -- see
  known_false_positives for why), plus 4673/4674 added to the Windows
  forwarder's Security-channel whitelist (defense-tooling,
  splunk_uf_win_security_whitelist / group_vars/splunk_forwarders_windows/
  monitor.yml). cyber-range's detection_logging role
  (configure_audit_policy.ps1) now sets both for future provisioning; this
  session applied it live via a reboot on every reachable range host except
  ca/sql2 (LAPS-managed local admin, not directly accessible this session).
known_false_positives: >-
  This detection needed a real, multi-layered infrastructure fix before it
  could fire at all, discovered live 2026-09-27 while testing `reg save
  HKLM\SAM`/`HKLM\SECURITY` on workstation: (1) RegSaveKeyEx's backup-
  privilege codepath never trips the ordinary Registry/File System SACLs
  this project's other detections rely on -- confirmed zero 4656/4663 for
  reg.exe even with those SACLs and their audit subcategories both
  correctly configured; Windows' real signal for this is Privilege Use,
  not Object Access. (2) "Sensitive Privilege Use" auditing alone wasn't
  enough either -- Windows additionally gates ALL backup/restore-privilege
  auditing behind a separate, rarely-documented LSA registry value
  (FullPrivilegeAuditing, HKLM\SYSTEM\CurrentControlSet\Control\Lsa),
  which requires a reboot to take effect (LSA reads it once at startup).
  (3) Even with both of those, defense-tooling's Windows forwarder ships an
  explicit per-channel Event ID whitelist for the Security log that simply
  didn't include 4673/4674 -- added them. Once all three were fixed and
  workstation rebooted, this became extremely noisy in a different way:
  ANY process routinely exercising backup/restore privilege trips 4674
  (confirmed live: Splunk's own splunkd.exe/splunk-*.exe binaries, Edge
  WebView, Teams, the Widgets dashboard app -- 17,000+ events from
  splunkd.exe alone over one hour). Scoping to Process_Name=reg.exe cuts
  through essentially all of that, since none of that legitimate software
  is reg.exe. No false positives found over 4h once scoped this way.
  Separately-confirmed real limitation, not a false-positive concern but
  worth recording here: this event never names the SOURCE registry key
  (HKLM\SAM vs HKLM\SECURITY vs anything else) -- only an object-less
  privilege check or the destination file reg.exe is writing to, which is
  attacker-controlled and can't be trusted to say which hive was really
  read. That's why this is one merged detection covering both hives rather
  than two -- see SAM Dump: Registry Query / LSA Dump: Registry Query for
  the technique that CAN be split cleanly (direct RegQueryValueEx/
  RegEnumKeyEx enumeration, e.g. as SYSTEM or via netexec-style remote
  registry access, which trips the ordinary per-key SACL with the real
  object name intact).
verification:
  date: '2026-09-27'
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: this control host, Administrator over WinRM (Defender real-time monitoring disabled first)
  technique: 'reg save HKLM\SAM C:\Windows\Temp\sam.hive /y  &  reg save HKLM\SECURITY C:\Windows\Temp\security.hive /y, on workstation'
  result: >-
    Fired exactly once per invocation once the three-part infra fix above
    was in place (SeBackupPrivilege and SeRestorePrivilege both observed
    across the two reg.exe calls, correctly collapsed to one alert by the
    10s bucket).
embed:
  title: 'SAM/LSA Dump: Registry Export'
  additional_fields:
    - host
    - user
references:
  - 'detections/backlog.md, "Credential & ticket dumping" (backlog rows: "SAM hive dumping", "LSA hive dumping (incl. LSA secrets)")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md) -- title chosen directly by the user 2026-09-27 to distinguish this technique from the registry-query variant, superseding that planner's original separate "SAM Dump (Local)"/"LSA Dump (Local)" titles for this specific technique split
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
