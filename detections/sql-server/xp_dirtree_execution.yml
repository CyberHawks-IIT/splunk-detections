name: xp_dirtree Execution
id: sql-server-xp-dirtree
version: 3
date: '2026-09-30'
status: production
category: sql-server
description: >-
  `xp_dirtree` invoked on a SQL Server instance -- filesystem enumeration
  from within SQL Server (also a classic technique for coercing an outbound
  UNC-path authentication, i.e. an NTLM-relay trigger). Same escalation
  path as xp_cmdshell: reached via `EXECUTE AS LOGIN='sa'` on sql1.
data_source:
  - >-
    SQL Server Extended Events (`detection_sql_text` session), sql_text
    matching xp_dirtree
search: |-
  index=mssql sourcetype=mssql_xe_text sql_text="*xp_dirtree*" NOT username="svc-sqlmonitor" NOT username="NT SERVICE*"
  | eval host=replace(source, "_mssql_xe_text", "")
  | rex field=sql_text "xp_dirtree\s+'(?<path>[^']+)'"
  | rename username as user
  | lookup known_range_hosts hostname AS host OUTPUT ip AS host_ip
  | join type=left host_ip [ search index=zeek sourcetype=zeek:conn id_resp_p=1433 NOT id_orig_h="10.0.10.2" | lookup known_range_hosts ip AS id_orig_h OUTPUT hostname AS src_known | where isnull(src_known) | rename id_resp_h as host_ip | stats latest(id_orig_h) as Source_Network_Address by host_ip ]
  | rename Source_Network_Address as attacker_ip
  | eval host=if(isnull(host), null(), mvmap(host, if(match(host, "^[0-9.]+$") OR like(host, "%:%"), host, lower(replace(host, "\..*$", "")))))
  | eval user=if(isnull(user), null(), mvmap(user, replace(replace(user, "^.*\\\\", ""), "@.*$", "")))
  | table attacker_ip host user path
how_to_implement: >-
  Same data source and operational gotcha as xp_cmdshell Execution --
  DB Connect's `detection_sql_text` XE input, already live. See that
  detection's how_to_implement for the checkpoint/timeout note.
known_false_positives: >-
  None -- xp_dirtree only appears in 24h of data from this session's own
  live test. Same `user`-reflects-execution-context caveat as xp_cmdshell
  Execution applies here too.
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: added the Attacker-IP field via a Zeek conn.log TCP/1433
    correlation (the sqlserver.client_net_address XE action does not exist on
    these SQL builds -- verified live -- and impacket's client_hostname is a
    random DESKTOP-xxxx, not an IP). The correlation resolves the detection host
    to its IP (known_range_hosts), then joins to a Zeek 1433 flow to that host
    from a source that is neither the DB Connect monitor (10.0.10.2) nor a known
    range host -- i.e. an external SQL client. Also excludes NT SERVICE*
    principals (SQL-internal telemetry queries that merely mention the trigger
    substrings, e.g. SQLTELEMETRY's config enumeration). Live-verified from
    john-kali (192.168.1.11) running the real technique via impacket-
    mssqlclient: all resolve Source_Network_Address=192.168.1.11. DOCUMENTED
    CAVEAT (user-accepted): the 1433 correlation is by host, not by the exact
    session, so on a host with concurrent external SQL clients in the same
    window it can mis-attribute; in this low-traffic range the attacker is the
    sole external 1433 source. This whole item was unblocked by fixing the DB
    Connect ingestion: the mssql_xe_text inputs had been failing since
    2026-09-28 12:01 with a Jackson self-reference error that MASKED the real
    cause -- 'Login failed for user svc-sqlmonitor' (its SQL password had
    drifted from DB Connect's stored identity). Reset svc-sqlmonitor's password
    on sql1+sql2 to the committed value; inputs now flow.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611), via impacket-mssqlclient as dsmith (Windows Auth)
  technique: >-
    EXECUTE AS LOGIN = 'sa'; EXEC master..xp_dirtree 'C:\Windows', 1, 1 --
    against sql1 (10.0.2.6)
  result: 'Real directory listing returned (90+ entries under C:\Windows). Fired exactly once.'
embed:
  title: xp_dirtree Execution
  additional_fields:
    - host
    - user
    - path
references:
  - 'detections/backlog.md, "SQL Server" (backlog row: "xp_dirtree execution")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
