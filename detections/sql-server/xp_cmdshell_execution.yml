name: xp_cmdshell Execution
id: sql-server-xp-cmdshell
version: 4
date: '2026-09-30'
status: production
category: sql-server
description: >-
  `xp_cmdshell` invoked on a SQL Server instance -- arbitrary OS command
  execution from within SQL Server, the classic escalation step once
  `sysadmin` is reached (e.g. via `EXECUTE AS LOGIN='sa'` on sql1, which any
  domain user can attempt since sql1 is open to Windows Auth by design).
  Nothing in this range's normal operation ever calls this procedure.
data_source:
  - >-
    SQL Server Extended Events (`detection_sql_text` session), sql_text
    matching xp_cmdshell
search: |-
  index=mssql sourcetype=mssql_xe_text sql_text="*xp_cmdshell*" NOT username="svc-sqlmonitor" NOT username="NT SERVICE*"
  | eval event_epoch=strptime(substr(event_time, 1, 19) . " +0000", "%Y-%m-%d %H:%M:%S %z")
  | where isnotnull(event_epoch) AND _time - event_epoch <= 600
  | eval host=replace(source, "_mssql_xe_text", "")
  | rename username as user, sql_text as command
  | lookup known_range_hosts hostname AS host OUTPUT ip AS host_ip
  | join type=left host_ip [ search index=zeek sourcetype=zeek:conn id_resp_p=1433 NOT id_orig_h="10.0.10.2" | lookup known_range_hosts ip AS id_orig_h OUTPUT hostname AS src_known | where isnull(src_known) | rename id_resp_h as host_ip | stats latest(id_orig_h) as Source_Network_Address by host_ip ]
  | rename Source_Network_Address as attacker_ip
  | eval host=if(isnull(host), null(), mvmap(host, if(match(host, "^[0-9.]+$") OR like(host, "%:%"), host, lower(replace(host, "\..*$", "")))))
  | eval user=if(isnull(user), null(), mvmap(user, replace(replace(user, "^.*\\\\", ""), "@.*$", "")))
  | table attacker_ip host user command
how_to_implement: >-
  Requires defense-tooling's DB Connect setup already forwarding
  `detection_sql_text`'s XE output into the `mssql` index (`mssql_xe_text`
  sourcetype) -- already live, no infra fix needed for the data source
  itself. `NOT username="svc-sqlmonitor"` excludes DB Connect's own
  monitoring identity from ever matching (defensive; its queries are plain
  SELECTs and would never actually contain "xp_cmdshell", but excluded on
  principle same as other detections in this backlog exclude known
  service/tooling accounts). **Operational gotcha hit this session, not a
  detection-design issue:** repeatedly restarting splunkd (redeploying
  savedsearches.conf for other detections) reset DB Connect's KV-store
  checkpoints for these inputs to their 1900-01-01 default, forcing a full
  re-scan of the accumulated `detection_sql_text*.xel` files that then
  exceeded the connector's query timeout and looped on
  `SQLTimeoutException` indefinitely. Fixed operationally (not a code
  change) by stopping the XE session, clearing the old `.xel` files, and
  restarting it -- not expected to recur under normal operation, but if
  this input goes quiet again after a `splunk restart`, check
  `splunk_app_db_connect_server.log` for the same timeout pattern before
  assuming the detection itself is broken.
known_false_positives: >-
  None -- xp_cmdshell only appears in 24h of data when this session
  actually called it (twice, both this session's own live tests). Note
  `user` reflects the *execution context at the time xp_cmdshell ran*
  (`sa`, since it always runs post-impersonation in this range's actual
  attack chain), not the original login that got there -- correlate with
  the EXECUTE AS Impersonation detection's output for the true actor
  (`dsmith` in this range's design).

  2026-09-30: selects by ARRIVAL time, and drops re-read history. DB Connect
  stamps each row with the time it read it (index_time_mode = current), so
  _time is arrival and the -1m window already means "arrived in the last
  minute". But when Splunk stops or starts, DB Connect's last/first poll can
  run while the KV store is down, fail to load its checkpoint, fall back to
  the 1900 init value and re-read the whole audit/XE history, which then
  arrives "now" and re-alerted old activity with no attacker IP (no live
  1433 flow to join; seen at a 01:24 UTC restart). Each row still carries
  its real SQL-side event_time (UTC), so the search now also requires the
  row to have arrived within 10 minutes of when it happened (DB Connect's
  60s poll + SQL flush delay fit well inside that). A replay of anything
  older is dropped; a real event is alerted once, when it arrives.
verification:
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: added the Attacker-IP field via a Zeek conn.log TCP/1433
    correlation (the sqlserver.client_net_address XE action does not exist on
    these SQL builds -- verified live -- and impacket's client_hostname is a
    random DESKTOP-xxxx, not an IP). The correlation resolves the detection host
    to its IP (known_range_hosts), then joins to a Zeek 1433 flow to that host
    from a source that is neither the DB Connect monitor (10.0.10.2) nor a known
    range host -- i.e. an external SQL client. Also excludes NT SERVICE*
    principals (SQL-internal telemetry queries that merely mention the trigger
    substrings, e.g. SQLTELEMETRY's config enumeration). Live-verified from
    john-kali (192.168.1.11) running the real technique via impacket-
    mssqlclient: all resolve Source_Network_Address=192.168.1.11. DOCUMENTED
    CAVEAT (user-accepted): the 1433 correlation is by host, not by the exact
    session, so on a host with concurrent external SQL clients in the same
    window it can mis-attribute; in this low-traffic range the attacker is the
    sole external 1433 source. This whole item was unblocked by fixing the DB
    Connect ingestion: the mssql_xe_text inputs had been failing since
    2026-09-28 12:01 with a Jackson self-reference error that MASKED the real
    cause -- 'Login failed for user svc-sqlmonitor' (its SQL password had
    drifted from DB Connect's stored identity). Reset svc-sqlmonitor's password
    on sql1+sql2 to the committed value; inputs now flow.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611), via impacket-mssqlclient as dsmith (Windows Auth)
  technique: >-
    EXECUTE AS LOGIN = 'sa'; EXEC sp_configure 'xp_cmdshell', 1; RECONFIGURE;
    EXEC xp_cmdshell 'whoami' -- against sql1 (10.0.2.6)
  result: >-
    Real command execution confirmed (`cyberhawks\svc-mssql`, sql1's own
    service account, returned). Fired exactly once.
embed:
  title: xp_cmdshell Execution
  additional_fields:
    - host
    - user
    - command
references:
  - 'detections/backlog.md, "SQL Server" (backlog row: "xp_cmdshell execution")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
schedule:
  cron: '* * * * *'
  earliest: '-1m'
  latest: now
disabled: false
