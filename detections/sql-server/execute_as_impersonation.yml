name: EXECUTE AS Impersonation
id: sql-server-execute-as-impersonation
version: 5
date: '2026-09-30'
status: production
category: sql-server
description: >-
  A T-SQL `EXECUTE AS LOGIN` impersonation succeeding -- on sql1, a bug in
  the `sa` login's own permission grants lets any authenticated login
  impersonate `sa` outright, an instant path from "any domain user" to
  `sysadmin`. This is the actual escalation step that everything else in
  this category (xp_cmdshell, xp_dirtree, the linked-server pivot) chains
  off of.
data_source:
  - >-
    SQL Server Audit (`detection_impersonation_audit`), action_id = IMP,
    a literal "EXECUTE AS" statement present
search: |-
  index=mssql sourcetype=mssql_audit action_id="IMP*" succeeded=1 statement="EXECUTE AS*" NOT server_principal_name="NT SERVICE*" `detection_window`
  | eval event_epoch=strptime(substr(event_time, 1, 19) . " +0000", "%Y-%m-%d %H:%M:%S %z")
  | where isnotnull(event_epoch) AND _time - event_epoch <= 600
  | eval host=replace(source, "_mssql_audit", "")
  | rex field=statement "EXECUTE AS LOGIN\s*=\s*.(?<impersonated>[^'\"]+)"
  | rename server_principal_name as user
  | lookup known_range_hosts hostname AS host OUTPUT ip AS host_ip
  | join type=left host session_id [ search index=mssql sourcetype=mssql_audit action_id=LGIS earliest=-7d latest=+5m | eval host=replace(source, "_mssql_audit", ""), login=tostring(floor(strptime(substr(event_time, 1, 19) . " +0000", "%Y-%m-%d %H:%M:%S %z"))) . "|" . client_address | stats values(login) as logins by host session_id | eval logins=mvjoin(logins, ";") ]
  | eval logins=split(logins, ";")
  | eval prior_logins=mvmap(logins, if(tonumber(mvindex(split(logins, "|"), 0)) <= event_epoch + 1, logins, null()))
  | eval attacker_ip=mvindex(split(mvindex(mvsort(prior_logins), -1), "|"), 1)
  | eval attacker_ip=if(attacker_ip="local machine", host_ip, attacker_ip)
  | stats values(attacker_ip) as attacker_ip values(impersonated) as impersonated by host session_id user
  | `normalize_host(host)`
  | `normalize_user(user)`
  | `normalize_user(impersonated)`
  | table attacker_ip host user impersonated
how_to_implement: >-
  Requires defense-tooling's DB Connect setup already forwarding
  `detection_impersonation_audit`'s output into the `mssql` index
  (`mssql_audit` sourcetype) -- already live, no infra fix needed. The
  `statement="EXECUTE AS*"` filter is required: SQL Server also logs
  action_id=IMP for internal context switches with no literal statement
  text (e.g. SQL Agent job execution running as `sa` against `msdb`) --
  those aren't a T-SQL-level impersonation a user performed and are
  excluded by requiring the statement text to actually be present.
known_false_positives: >-
  Investigated the raw action_id=IMP baseline before adding the
  `statement="EXECUTE AS*"` filter: found regular background `sa`-to-`dbo`
  events against `msdb` with no statement text at all (SQL Agent's own
  internal impersonation, not a real EXECUTE AS call) -- excluded by the
  filter above, confirmed zero false positives afterward. The 5 remaining
  matches in 24h are all real: this session's 2 live tests plus 3 from an
  earlier session's own build-verification pass (also dsmith -> sa),
  correctly deduplicated per-minute rather than one alert per statement.

  INGESTION FALSE POSITIVE (fixed 2026-09-30, not a logic issue): this fired
  every minute because DB Connect never persisted its rising-column
  checkpoint for the conf-written inputs, re-reading every audit/XE row since
  1900 on each poll and re-indexing it at the current time. Fixed in
  defense-tooling's splunk_indexer role (checkpoint_key pinned per input and
  a seeded KV checkpoint document). If this starts firing repeatedly on the
  same statement again, check DB Connect's readCount before the SPL.

  2026-09-30: selects by ARRIVAL time, and drops re-read history. DB Connect
  stamps each row with the time it read it (index_time_mode = current), so
  _time is arrival and the -1m window already means "arrived in the last
  minute". But when Splunk stops or starts, DB Connect's last/first poll can
  run while the KV store is down, fail to load its checkpoint, fall back to
  the 1900 init value and re-read the whole audit/XE history, which then
  arrives "now" and re-alerted old activity with no attacker IP (no live
  1433 flow to join; seen at a 01:24 UTC restart). Each row still carries
  its real SQL-side event_time (UTC), so the search now also requires the
  row to have arrived within 10 minutes of when it happened (DB Connect's
  60s poll + SQL flush delay fit well inside that). A replay of anything
  older is dropped; a real event is alerted once, when it arrives.

  2026-09-30 (attacker IP, session-based): the attacker IP used to be
  guessed from Zeek -- the most recent external 1433 connection to the
  server -- which names the wrong client whenever two are connected at once
  (and, with a -1m window, usually found none: the row arrives up to a DB
  Connect poll after the connection). Now exact: SQL Server's own login audit
  (SUCCESSFUL_LOGIN_GROUP, cyber-range detection_logging) records each
  login's session_id and client address, and the audit/XE rows carry the
  session_id of the session that acted. The search takes that server's
  latest login for the same session_id at or before the event (session_ids
  are reused only after a session ends, so while it's open the match is
  unique). A "local machine" login (on the SQL server itself) resolves to the
  server's own IP. The 7-day login lookback only bounds how long a session
  may have been open. Events collected before 2026-09-30 01:51 UTC have no
  session_id, so they resolve no IP. (The subsearch hands `logins` over as
  one ;-joined string: `join` flattens a multivalue field into a single
  newline-joined value, which made the first live test pick the wrong
  login.)
throttle: [attacker_ip, host, user]
changes_2026_09_30: >-
  Grouped by SQL session (host + session_id, the same key the attacker IP
  is traced from) instead of host+user+minute, so two attackers using one
  SQL login are separate alerts, and a session whose login can't be traced
  still alerts (attacker_ip blank) instead of being dropped. Runs every minute over the events indexed in the
  previous minute (`detection_window`), so an event is evaluated however
  late it arrives; before this, each run searched the last minute of event
  time, and anything indexed after its run (Security up to ~50s late, Zeek
  conn p90 ~1 min) was never evaluated. Each result row is its own alert,
  throttled for 5m on the `throttle` fields.
verification:
  reverification_2026_09_30_session: >-
    Session-based attacker IP, two concurrent attackers on sql1, both as
    dsmith: A (test box, 10.0.2.10) connected at 02:01:39 and held its
    session (WAITFOR 70s); B (john-kali, 192.168.1.11) connected at
    02:01:54 and ran EXECUTE AS + the portal Users read at once; A ran the
    same at ~02:02:50, when B held the most recent connection (the old Zeek
    logic would have named B). Scheduled job results, i.e. what Discord
    received: 02:03 runs -> 192.168.1.11, 02:04 runs -> 10.0.2.10, each
    posted (HTTP 204). A's session_id (59) had earlier belonged to a pooled
    svc-sqlmonitor session from 10.0.10.2; the latest-login-at-or-before rule
    picked A's own login.
  reverification_2026_09_30_replay: >-
    Arrival-vs-event-time check. Replayed the 01:24 UTC restart window
    inline: the previous logic returns the IP-less alert seen in Discord, the
    new logic returns nothing. A further Splunk restart at 01:34 made DB
    Connect re-read its full history again; all 25 SQL detection runs after
    it returned 0 results. Live from john-kali as dsmith against sql1 at
    01:38:46 (SELECT FROM CyberHawksPortal Users, then EXECUTE AS LOGIN =
    'sa'): both detections fired once at 01:40, posted to Discord (HTTP 204),
    attacker_ip=192.168.1.11.
  date: '2026-09-27'
  reverification_2026_09_29: >-
    2026-09-29: added the Attacker-IP field via a Zeek conn.log TCP/1433
    correlation (the sqlserver.client_net_address XE action does not exist on
    these SQL builds -- verified live -- and impacket's client_hostname is a
    random DESKTOP-xxxx, not an IP). The correlation resolves the detection host
    to its IP (known_range_hosts), then joins to a Zeek 1433 flow to that host
    from a source that is neither the DB Connect monitor (10.0.10.2) nor a known
    range host -- i.e. an external SQL client. Also excludes NT SERVICE*
    principals (SQL-internal telemetry queries that merely mention the trigger
    substrings, e.g. SQLTELEMETRY's config enumeration). Live-verified from
    john-kali (192.168.1.11) running the real technique via impacket-
    mssqlclient: all resolve Source_Network_Address=192.168.1.11. DOCUMENTED
    CAVEAT (user-accepted): the 1433 correlation is by host, not by the exact
    session, so on a host with concurrent external SQL clients in the same
    window it can mis-attribute; in this low-traffic range the attacker is the
    sole external 1433 source. This whole item was unblocked by fixing the DB
    Connect ingestion: the mssql_xe_text inputs had been failing since
    2026-09-28 12:01 with a Jackson self-reference error that MASKED the real
    cause -- 'Login failed for user svc-sqlmonitor' (its SQL password had
    drifted from DB Connect's stored identity). Reset svc-sqlmonitor's password
    on sql1+sql2 to the committed value; inputs now flow.
  method: Live attack execution against the cyberhawks.lab range
  attacker_source: john-kali (VM 611), via impacket-mssqlclient as dsmith (Windows Auth)
  technique: "EXECUTE AS LOGIN = 'sa' against sql1 (10.0.2.6), as dsmith"
  result: >-
    Real impersonation confirmed (subsequent xp_cmdshell/xp_dirtree/
    OPENQUERY calls all ran in `sa`'s context). Fired exactly once per
    test run, correctly attributing `user=CYBERHAWKS\dsmith`,
    `impersonated=sa`.
embed:
  title: EXECUTE AS Impersonation
  additional_fields:
    - host
    - user
    - impersonated
references:
  - 'detections/backlog.md, "SQL Server" (backlog row: "EXECUTE AS impersonation")'
  - Alert Embed Planner (see splunk-detections memory reference_alert_embed_planner.md)
disabled: false
